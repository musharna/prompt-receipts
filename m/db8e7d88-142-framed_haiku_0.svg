<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#FFF8E7"/>

  <!-- Panel 1 Background -->
  <rect x="10" y="10" width="380" height="380" fill="#E8F4F8" stroke="#333" stroke-width="3" rx="5"/>

  <!-- Panel 2 Background -->
  <rect x="410" y="10" width="380" height="380" fill="#FFF5E6" stroke="#333" stroke-width="3" rx="5"/>

  <!-- Panel 3 Background -->
  <rect x="810" y="10" width="380" height="380" fill="#E8F8E8" stroke="#333" stroke-width="3" rx="5"/>

  <!-- ===== PANEL 1: PIGEON FINDS POSTMAN CAP ===== -->
  <!-- Sky in panel 1 -->
  <rect x="20" y="20" width="360" height="180" fill="#87CEEB"/>

  <!-- Ground in panel 1 -->
  <rect x="20" y="200" width="360" height="180" fill="#90EE90"/>

  <!-- Mailbox on ground -->
  <rect x="100" y="280" width="60" height="40" fill="#DC143C" rx="5"/>
  <circle cx="160" cy="300" r="8" fill="#FFD700"/>
  <path d="M 110 270 Q 130 250 150 270" fill="#DC143C"/>

  <!-- Pigeon in panel 1 -->
  <ellipse cx="240" cy="290" rx="35" ry="38" fill="#808080"/>
  <!-- Head -->
  <circle cx="240" cy="245" r="20" fill="#808080"/>
  <!-- Eye -->
  <circle cx="250" cy="240" r="3" fill="#000"/>
  <!-- Beak -->
  <polygon points="265,242 275,240 265,245" fill="#FF69B4"/>
  <!-- Wing -->
  <ellipse cx="215" cy="285" rx="18" ry="25" fill="#696969"/>

  <!-- Postman cap on ground near pigeon -->
  <rect x="220" y="195" width="50" height="20" fill="#1C1C1C" rx="3"/>
  <ellipse cx="245" cy="195" rx="30" ry="12" fill="#1C1C1C"/>
  <circle cx="245" cy="190" r="8" fill="#FFD700"/>

  <!-- Text for Panel 1 -->
  <text x="200" y="360" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Panel 1: A Lucky Find!</text>

  <!-- ===== PANEL 2: PIGEON DELIVERING MAIL ===== -->
  <!-- Sky in panel 2 -->
  <rect x="420" y="20" width="360" height="180" fill="#87CEEB"/>

  <!-- Ground in panel 2 -->
  <rect x="420" y="200" width="360" height="180" fill="#90EE90"/>

  <!-- House -->
  <rect x="480" y="220" width="100" height="80" fill="#D2691E" stroke="#333" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="480,220 530,170 580,220" fill="#8B4513"/>
  <!-- Door -->
  <rect x="505" y="260" width="25" height="40" fill="#654321"/>
  <circle cx="528" cy="280" r="3" fill="#FFD700"/>
  <!-- Window -->
  <rect x="560" y="240" width="15" height="15" fill="#87CEEB"/>

  <!-- Pigeon with postman cap, flying with letter -->
  <ellipse cx="340" cy="220" rx="28" ry="32" fill="#808080"/>
  <!-- Head -->
  <circle cx="340" cy="180" r="18" fill="#808080"/>
  <!-- Eye -->
  <circle cx="348" cy="175" r="3" fill="#000"/>
  <!-- Beak -->
  <polygon points="360,177 370,175 360,180" fill="#FF69B4"/>
  <!-- Postman cap -->
  <rect x="325" y="155" width="35" height="15" fill="#1C1C1C" rx="2"/>
  <circle x="342" y="153" r="6" fill="#FFD700"/>
  <!-- Wing -->
  <path d="M 310 210 Q 290 200 300 230" stroke="#696969" stroke-width="8" fill="none"/>
  <!-- Other wing -->
  <path d="M 370 210 Q 390 200 380 230" stroke="#696969" stroke-width="8" fill="none"/>

  <!-- Letter in pigeon's beak -->
  <rect x="360" y="175" width="25" height="18" fill="#FFF" stroke="#333" stroke-width="1.5"/>
  <line x1="360" y1="180" x2="385" y2="180" stroke="#FF69B4" stroke-width="1"/>

  <!-- Motion lines -->
  <line x1="300" y1="210" x2="280" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="230" x2="280" y2="240" stroke="#333" stroke-width="2"/>

  <!-- Text for Panel 2 -->
  <text x="600" y="360" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Panel 2: Official Delivery!</text>

  <!-- ===== PANEL 3: EVERYONE PLAYS ALONG ===== -->
  <!-- Sky in panel 3 -->
  <rect x="820" y="20" width="360" height="180" fill="#87CEEB"/>

  <!-- Ground in panel 3 -->
  <rect x="820" y="200" width="360" height="180" fill="#90EE90"/>

  <!-- Little girl receiving mail -->
  <g>
    <!-- Head -->
    <circle cx="920" cy="230" r="15" fill="#FDBCB4"/>
    <!-- Hair -->
    <path d="M 905 230 Q 905 210 920 205 Q 935 210 935 230" fill="#D2691E"/>
    <!-- Body -->
    <rect x="908" y="245" width="24" height="35" fill="#FF69B4" rx="3"/>
    <!-- Arms -->
    <rect x="885" y="250" width="20" height="12" fill="#FDBCB4" rx="4"/>
    <rect x="932" y="250" width="20" height="12" fill="#FDBCB4" rx="4"/>
    <!-- Legs -->
    <line x1="912" y1="280" x2="912" y2="300" stroke="#333" stroke-width="3"/>
    <line x1="920" y1="280" x2="920" y2="300" stroke="#333" stroke-width="3"/>
    <!-- Smile -->
    <path d="M 915 240 Q 920 243 925 240" stroke="#333" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Pigeon delivering letter to girl -->
  <ellipse cx="1000" cy="235" rx="25" ry="28" fill="#808080"/>
  <!-- Head -->
  <circle cx="1000" cy="200" r="16" fill="#808080"/>
  <!-- Eye -->
  <circle cx="1008" cy="196" r="3" fill="#000"/>
  <!-- Beak -->
  <polygon points="1016,198 1024,196 1016,201" fill="#FF69B4"/>
  <!-- Postman cap -->
  <rect x="987" y="180" width="30" height="13" fill="#1C1C1C" rx="2"/>
  <circle cx="1002" cy="178" r="5" fill="#FFD700"/>
  <!-- Wing (proud pose) -->
  <ellipse cx="975" cy="230" rx="15" ry="22" fill="#696969"/>

  <!-- Letter from pigeon to girl -->
  <rect x="940" y="220" width="20" height="15" fill="#FFF" stroke="#333" stroke-width="1"/>
  <line x1="940" y1="224" x2="960" y2="224" stroke="#FF69B4" stroke-width="0.5"/>

  <!-- Happy townsperson in background -->
  <g>
    <!-- Head -->
    <circle cx="1080" cy="240" r="12" fill="#FDBCB4"/>
    <!-- Hair -->
    <path d="M 1070 240 L 1090 240 Q 1090 225 1080 225 Q 1070 225 1070 240" fill="#8B4513"/>
    <!-- Body -->
    <rect x="1072" y="252" width="16" height="28" fill="#4169E1" rx="2"/>
    <!-- Thumbs up -->
    <rect x="1088" y="258" width="4" height="15" fill="#FDBCB4" rx="2"/>
    <rect x="1090" y="255" width="6" height="5" fill="#FDBCB4" rx="1"/>
  </g>

  <!-- Speech bubble "Great job!" -->
  <ellipse cx="1070" cy="310" rx="45" ry="25" fill="#FFE4B5" stroke="#333" stroke-width="2"/>
  <polygon points="1030,330 1020,345 1035,335" fill="#FFE4B5" stroke="#333" stroke-width="1.5"/>
  <text x="1070" y="315" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial">Great job!</text>

  <!-- Heart symbols for happiness -->
  <text x="880" y="190" font-size="20">💕</text>
  <text x="1120" y="210" font-size="20">💕</text>

  <!-- Text for Panel 3 -->
  <text x="1000" y="360" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Panel 3: The Best Postman Ever!</text>

  <!-- Comic title at top -->
  <text x="600" y="30" font-size="28" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#333">PERCY THE PIGEON POSTMAN</text>
</svg>