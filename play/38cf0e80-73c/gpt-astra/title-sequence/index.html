<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studies in impermanence — title sequence</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101211;color:#e5ded0;font:13px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:38px 40px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:3px;color:#a39f91}h1{font:normal 30px Georgia,serif;margin:9px 0}header span{color:#888b81;font-size:11px} .screen{position:relative;background:#080b0c;aspect-ratio:16/9;overflow:hidden;border:1px solid #30332c}canvas{width:100%;height:100%;display:block}.caption{position:absolute;bottom:7%;left:6%;pointer-events:none}.caption small{font-size:9px;letter-spacing:3px;color:#b6ab8d}.caption h2{font:normal 26px Georgia,serif;letter-spacing:2px;margin:8px 0}.toolbar{display:flex;align-items:center;gap:16px;padding:19px 0}button{border:1px solid #45483e;background:transparent;color:inherit;padding:10px 16px;cursor:pointer;font:inherit}button:hover,button[aria-pressed=true]{background:#d7ccb1;color:#141713}button:focus-visible,input:focus-visible{outline:2px solid #e6c68b;outline-offset:4px}input{flex:1;accent-color:#c9b68e;min-width:60px}.time{font-variant-numeric:tabular-nums;color:#a9ab9f;font-size:11px}.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.shots button{text-align:left;padding:19px}.shots b{display:block;font:normal 18px Georgia,serif;margin:8px 0}.shots small{font-size:10px;opacity:.7}.foot{display:flex;justify-content:space-between;color:#777d72;font-size:10px;letter-spacing:1px;margin-top:25px}@media(max-width:650px){main{padding:22px 14px}h1{font-size:24px}header span{display:none}.shots button{padding:12px}.shots b{font-size:15px}.caption h2{font-size:18px}.caption small{font-size:7px}.toolbar{gap:8px}button{padding:9px}.foot{letter-spacing:0}}
</style>
<main>
<header><div><div class="eyebrow">MOTION STUDIES / 001—003</div><h1>Studies in impermanence</h1></div><span>THREE SHOTS · TWELVE SECONDS</span></header>
<div class="screen"><canvas id="film" width="1280" height="720" aria-label="Animated teacup breaking, candle smoke, and water pouring into a glass bowl"></canvas><div class="caption"><small id="number"></small><h2 id="title"></h2></div></div>
<div class="toolbar"><button id="play">Pause</button><button id="replay">Replay</button><input id="seek" aria-label="Sequence time" type="range" min="0" max="12" step="0.01" value="0"><span class="time" id="time">00.0 / 12.0</span></div>
<div class="shots"><button data-shot="0"><small>01 / PORCELAIN</small><b>The breaking</b><small>Teacup · stone · impact</small></button><button data-shot="1"><small>02 / SMOKE</small><b>The lingering</b><small>Snuffed candle · rising smoke</small></button><button data-shot="2"><small>03 / WATER</small><b>The becoming</b><small>Pour · glass · ripples</small></button></div>
<div class="foot"><span>PROCEDURAL MOTION · STYLIZED PREVIS</span><span>Space to pause / 1–3 to select a shot</span></div>
</main>
<script>
'use strict';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),W=1280,H=720;
const names=['The breaking','The lingering','The becoming'];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const rand=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function ellipse(x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);c.fill()}
function line(points,color,width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke()}
function background(shot){let g=c.createRadialGradient(760,220,30,660,370,750);g.addColorStop(0,shot===1?'#26312c':'#29302f');g.addColorStop(.55,'#11191a');g.addColorStop(1,'#040809');c.fillStyle=g;c.fillRect(0,0,W,H);if(shot===0){g=c.createLinearGradient(0,480,0,720);g.addColorStop(0,'#343936');g.addColorStop(1,'#151e20');c.fillStyle=g;c.fillRect(0,480,W,240);for(let i=0;i<3400;i++){let x=rand(i)*W,y=480+rand(i+6000)*240;c.fillStyle=`rgba(190,181,153,${rand(i+8000)*.1})`;c.fillRect(x,y,rand(i+20)*4,1)}line([[0,579],[1280,557]],'#141b1c',2);line([[385,480],[236,720]],'#151d1d',2);line([[994,480],[1160,720]],'#171f1e',2)}else{g=c.createLinearGradient(0,574,0,720);g.addColorStop(0,'#212a27');g.addColorStop(1,'#0b1112');c.fillStyle=g;c.fillRect(0,574,W,146)}}
function cup(t){const impact=1.45;let d=t-impact;
 if(d<0){const q=clamp(t/impact),y=160+320*q*q;ellipse(677,537,65+q*25,14,'#080e0f88');c.save();c.translate(651,y);c.rotate(-.27+q*.38);c.shadowColor='#0009';c.shadowBlur=25;c.strokeStyle='#cecbb9';c.lineWidth=15;c.beginPath();c.ellipse(87,1,35,42,-.1,0,Math.PI*2);c.stroke();let g=c.createLinearGradient(-80,0,80,0);g.addColorStop(0,'#8a928a');g.addColorStop(.3,'#f2e5c8');g.addColorStop(.7,'#c9c8b3');g.addColorStop(1,'#748482');c.fillStyle=g;c.beginPath();c.moveTo(-84,-53);c.bezierCurveTo(-82,19,-63,73,-39,80);c.quadraticCurveTo(0,92,41,80);c.bezierCurveTo(69,61,83,0,84,-53);c.closePath();c.fill();c.shadowBlur=0;ellipse(0,-53,84,22,'#e9dfc6');ellipse(0,-54,72,14,'#677a73');ellipse(0,-51,66,10,'#293f3c');line([[-65,-17],[-54,29],[-39,55]],'#fff4ce55',2);c.restore();
 }else{ellipse(665,546,170,25,'#050b0c66');for(let i=0;i<64;i++){const a=rand(i+3)*Math.PI*2,vel=45+rand(i+81)*195,age=d*.87,vx=Math.cos(a)*vel,vy=-80-rand(i+26)*155;let x=651+vx*age,y=521+vy*age+210*age*age;const floor=532+Math.sin(a)*55;let rot=rand(i+16)*6+age*(rand(i+9)-.5)*15;if(y>floor){const hit=(-vy+Math.sqrt(vy*vy+840*(floor-521)))/420,after=Math.max(0,age-hit);y=floor-Math.abs(Math.sin(after*9))*22*Math.exp(-after*3);x=651+vx*(hit+(1-Math.exp(-after*2))*.5);rot=rand(i+16)*6+hit*(rand(i+9)-.5)*15+Math.min(after,.5)*2}const size=8+rand(i+54)*22;ellipse(x+5,floor+7,size,3,'#0005');c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=['#dbd7c0','#a8b1a4','#ede0c2','#687d76'][i%4];c.beginPath();c.moveTo(-size,-size*.5);c.lineTo(size*.8,-size*.3);c.lineTo(size*.3,size*.5);c.lineTo(-size*.7,size*.25);c.closePath();c.fill();c.strokeStyle='#faf0d255';c.lineWidth=1;c.stroke();c.restore()}for(let i=0;i<75;i++){let age=d,alpha=.15*Math.exp(-age*1.5);ellipse(655+(rand(i+44)-.5)*age*430,526-rand(i+15)*Math.sqrt(age)*70,3+age*15,2+age*9,`rgba(204,198,173,${alpha})`)}}
}
function candle(t){ellipse(733,592,138,19,'#0007');let g=c.createLinearGradient(674,0,783,0);g.addColorStop(0,'#686a57');g.addColorStop(.3,'#d7c6a0');g.addColorStop(.65,'#bfb28d');g.addColorStop(1,'#535e50');c.fillStyle=g;c.fillRect(674,438,108,147);ellipse(728,585,54,10,'#a59b7c');ellipse(728,438,54,15,'#c8b895');ellipse(728,440,25,7,'#756f53');line([[728,441],[724,420]],'#242b25',5);ellipse(724,420,3,3,`rgba(241,117,49,${.8*Math.exp(-t*1.8)})`);
 for(let i=0;i<125;i++){let born=i*.028-.4,age=t-born;if(age<0||age>3.5)continue;let u=age/3.5,x=724+Math.sin(age*2.9+born*1.3)*age*24+age*age*8,y=418-age*89;let r=3+age*14,a=.06*Math.sin(Math.PI*clamp(u))*(1-clamp(born/4));g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(202,221,211,${a})`);g.addColorStop(.5,`rgba(179,207,195,${a*.65})`);g.addColorStop(1,'rgba(179,207,195,0)');ellipse(x,y,r,r*1.8,g)}
 for(let j=0;j<5;j++){let pts=[];for(let i=0;i<100;i++){let age=i/100*Math.min(t+.3,3.6),x=724+Math.sin(age*3+t*.8+j*.22)*age*19+age*age*8;pts.push([x,419-age*89])}c.save();c.filter='blur(3px)';line(pts,`rgba(182,208,198,${.07-j*.009})`,2+j);c.restore()}
}
function bowl(t){const x=738,y=442,rx=211,ry=64,fill=clamp((t-.25)/3.6);ellipse(x,602,227,23,'#0006');let g=c.createLinearGradient(520,0,958,0);g.addColorStop(0,'#ccf2e31a');g.addColorStop(.12,'#b1ead00b');g.addColorStop(.5,'#c6ffe008');g.addColorStop(.9,'#a2d4c419');g.addColorStop(1,'#edfff344');c.fillStyle=g;c.beginPath();c.ellipse(x,y,rx,ry,0,Math.PI,2*Math.PI);c.bezierCurveTo(933,551,868,606,738,609);c.bezierCurveTo(610,606,544,551,527,442);c.fill();c.strokeStyle='#b5d3c551';c.lineWidth=2;c.stroke();let level=587-fill*94,waterRx=85+fill*100,waterRy=23+fill*26;g=c.createLinearGradient(0,level,0,606);g.addColorStop(0,'#76a99c38');g.addColorStop(1,'#48756c65');c.fillStyle=g;c.beginPath();c.moveTo(x-waterRx,level);c.bezierCurveTo(x-waterRx+18,602,x-65,608,x,608);c.bezierCurveTo(x+65,608,x+waterRx-18,602,x+waterRx,level);c.closePath();c.fill();ellipse(x,level,waterRx,waterRy,'#88baa62d');
 if(t>.18&&t<3.65){const start=clamp((t-.18)*5),bottom=-50+(level+50)*start;for(let j=0;j<6;j++){let pts=[];for(let k=0;k<60;k++){let yy=-50+(bottom+50)*k/59;pts.push([723+j*2+Math.sin(yy*.035-t*13)*2+Math.sin(yy*.1+t*7),yy])}line(pts,['#bfe3d640','#ddf4dc77','#ecffeea0','#e9ffed66','#a1cec677','#74a89944'][j],2.5)}if(start===1){ellipse(729,level,15,5,'#d3eee099');for(let i=0;i<22;i++){let age=((t*1.2+rand(i))%.55),a=rand(i+8)*Math.PI*2;let px=730+Math.cos(a)*age*105,py=level-130*age+250*age*age+Math.sin(a)*age*30;ellipse(px,py,1.5,2.6,'#d5f3dd88')}}}
 for(let i=0;i<7;i++){let phase=(t*.9+i/7)%1,r=phase*waterRx;c.strokeStyle=`rgba(188,229,208,${(1-phase)*.27*fill})`;c.lineWidth=1.2;c.beginPath();c.ellipse(x,level,r,phase*waterRy,0,0,Math.PI*2);c.stroke()}c.strokeStyle='#d1ecdb8f';c.lineWidth=2;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.stroke();c.strokeStyle='#c9e4d940';c.beginPath();c.ellipse(x,y+3,rx-5,ry-3,0,0,Math.PI*2);c.stroke();line([[544,467],[559,509],[583,545]],'#e3ffeb70',3);line([[930,471],[909,526],[882,552]],'#e3ffeb50',2);ellipse(x,610,79,5,'#d1efe132')}
let elapsed=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now();const play=document.querySelector('#play'),seek=document.querySelector('#seek');
function draw(){let shot=Math.min(2,Math.floor(elapsed/4)),t=elapsed-shot*4;background(shot);c.save();if(shot===0)cup(t);if(shot===1)candle(t);if(shot===2)bowl(t);c.restore();let g=c.createRadialGradient(660,320,190,640,360,780);g.addColorStop(0,'#0000');g.addColorStop(1,'#000b');c.fillStyle=g;c.fillRect(0,0,W,H);let fade=Math.min(clamp(t/.18),clamp((4-t)/.23));c.fillStyle=`rgba(5,8,9,${1-fade})`;c.fillRect(0,0,W,H);document.querySelector('#number').textContent=`0${shot+1} / ${['PORCELAIN','SMOKE','WATER'][shot]}`;document.querySelector('#title').textContent=names[shot];document.querySelector('.caption').style.opacity=fade;document.querySelectorAll('[data-shot]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.shot)===shot));seek.value=elapsed;document.querySelector('#time').textContent=`${elapsed.toFixed(1).padStart(4,'0')} / 12.0`;play.textContent=playing?'Pause':'Play'}
function tick(now){if(playing){elapsed+=Math.min((now-last)/1000,.1);if(elapsed>=12){elapsed=12;playing=false}}last=now;draw();requestAnimationFrame(tick)}
play.onclick=()=>{if(elapsed>=12)elapsed=0;playing=!playing};document.querySelector('#replay').onclick=()=>{elapsed=0;playing=true};seek.oninput=()=>{elapsed=Number(seek.value)};function select(i){elapsed=i*4+.01;playing=true}document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>select(Number(b.dataset.shot)));document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();play.click()}if(['1','2','3'].includes(e.key))select(Number(e.key)-1)});requestAnimationFrame(tick);
</script>
</html>
