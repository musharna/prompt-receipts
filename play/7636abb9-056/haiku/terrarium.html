<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrarium – Moss, Ferns &amp; Ceramic Deer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e2d4; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hint {
    position: absolute; left: 16px; bottom: 14px; color: #5a4d3c; font-size: 14px;
    background: rgba(255,255,255,0.55); padding: 6px 10px; border-radius: 6px; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const rng = (() => {
  let s = 20241107;
  return () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
})();
const rand = (a, b) => a + (b - a) * rng();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e2d4);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.4, 2.5, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true;
controls.minDistance = 2.5;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.55;
controls.update();

const sun = new THREE.DirectionalLight(0xfff3e0, 2.2);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -2.5; sun.shadow.camera.right = 2.5;
sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -1;
sun.shadow.radius = 4;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a6a4a, 0.6));

const SOIL_TOP = 1.05;

const floor = new THREE.Mesh(
  new THREE.CylinderGeometry(3, 3, 0.1, 64),
  new THREE.MeshStandardMaterial({ color: 0xb08a5e, roughness: 0.8 })
);
floor.position.y = -0.05;
floor.receiveShadow = true;
scene.add(floor);

// Glass jar
const jarPoints = [
  [0, 0], [0.82, 0], [0.9, 0.03], [0.94, 0.1], [0.95, 0.25],
  [0.95, 2.2], [0.92, 2.4], [0.85, 2.55], [0.8, 2.62], [0.8, 2.72]
].map(([x, y]) => new THREE.Vector2(x, y));
const glass = new THREE.Mesh(
  new THREE.LatheGeometry(jarPoints, 96),
  new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.04,
    transmission: 1, thickness: 0.08, ior: 1.5,
    specularIntensity: 1, clearcoat: 0.3, side: THREE.DoubleSide
  })
);
scene.add(glass);

const lid = new THREE.Mesh(
  new THREE.CylinderGeometry(0.86, 0.86, 0.18, 64),
  new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.75 })
);
lid.position.y = 2.79;
lid.castShadow = true;
scene.add(lid);

// Layers: pebbles (seen through glass), charcoal, soil
const charcoal = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9, 0.9, 0.06, 64),
  new THREE.MeshStandardMaterial({ color: 0x2b2a28, roughness: 0.9 })
);
charcoal.position.y = 0.25;
charcoal.receiveShadow = true;
scene.add(charcoal);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9, 0.9, SOIL_TOP - 0.28, 64, 1),
  new THREE.MeshStandardMaterial({ color: 0x5a4130, roughness: 1 })
);
soil.position.y = (SOIL_TOP + 0.28) / 2;
soil.receiveShadow = true;
scene.add(soil);

const pebbleColors = [0xbdb6a8, 0x8f8a80, 0xd8cfbf, 0x6f6a62];
const pebbleMats = pebbleColors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 }));
for (let i = 0; i < 70; i++) {
  const r = rand(0.03, 0.06);
  const a = rand(0, Math.PI * 2);
  const d = Math.sqrt(rng()) * 0.82;
  const p = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), pebbleMats[i % pebbleMats.length]);
  p.position.set(Math.cos(a) * d, rand(0.03, 0.12), Math.sin(a) * d);
  p.scale.y = 0.7;
  p.castShadow = true;
  scene.add(p);
}

// Moss patches
const mossMats = [0x4f7a2e, 0x6b9a3a, 0x3d6127, 0x7fae4a].map(
  c => new THREE.MeshStandardMaterial({ color: c, roughness: 1 })
);
const mossGeo = new THREE.SphereGeometry(1, 9, 6);
function addMossPatch(cx, cz, radius, count) {
  for (let i = 0; i < count; i++) {
    const a = rng() * Math.PI * 2;
    const d = Math.sqrt(rng()) * radius;
    const s = rand(0.04, 0.09);
    const m = new THREE.Mesh(mossGeo, mossMats[Math.floor(rng() * mossMats.length)]);
    m.scale.set(s, s * 0.45, s);
    m.position.set(cx + Math.cos(a) * d, SOIL_TOP + s * 0.2, cz + Math.sin(a) * d);
    m.castShadow = true;
    m.receiveShadow = true;
    scene.add(m);
  }
}
addMossPatch(-0.45, 0.35, 0.22, 40);
addMossPatch(0.25, -0.5, 0.2, 34);
addMossPatch(0.55, 0.45, 0.14, 22);
addMossPatch(-0.7, -0.2, 0.15, 20);
addMossPatch(0.0, 0.8, 0.18, 26);

// Ferns
const stemMat = new THREE.MeshStandardMaterial({ color: 0x5a7a34, roughness: 0.7 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f8a3a, roughness: 0.6, side: THREE.DoubleSide });
const leafGeo = new THREE.PlaneGeometry(1, 1);
leafGeo.translate(0, 0.5, 0);
const UP = new THREE.Vector3(0, 1, 0);

function makeFern(x, z, size, azimuth) {
  const fern = new THREE.Group();
  fern.position.set(x, SOIL_TOP, z);
  const frondCount = 5;
  for (let f = 0; f < frondCount; f++) {
    const a = azimuth + (f / (frondCount - 1) - 0.5) * 1.8 + rand(-0.15, 0.15);
    const dir = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
    const len = size * rand(0.8, 1.15);
    const pts = [
      new THREE.Vector3(0, 0, 0),
      dir.clone().multiplyScalar(len * 0.15).addScaledVector(UP, len * 0.4),
      dir.clone().multiplyScalar(len * 0.45).addScaledVector(UP, len * 0.72),
      dir.clone().multiplyScalar(len * 0.7).addScaledVector(UP, len * 0.45)
    ];
    const curve = new THREE.CatmullRomCurve3(pts);
    const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.012, 6), stemMat);
    stem.castShadow = true;
    fern.add(stem);

    for (let i = 0; i < 16; i++) {
      const t = 0.15 + (i / 15) * 0.8;
      const p = curve.getPointAt(t);
      const tan = curve.getTangentAt(t);
      const side = new THREE.Vector3().crossVectors(tan, UP).normalize();
      const leafLen = len * 0.2 * (1 - t * 0.6);
      for (const s of [-1, 1]) {
        const leafDir = tan.clone().multiplyScalar(0.6).addScaledVector(side, s * 0.8).normalize();
        const leaf = new THREE.Mesh(leafGeo, leafMat);
        leaf.position.copy(p);
        leaf.quaternion.setFromUnitVectors(UP, leafDir);
        leaf.scale.set(leafLen * 0.4, leafLen, 1);
        leaf.castShadow = true;
        fern.add(leaf);
      }
    }
  }
  scene.add(fern);
}
const ferns = [
  [0.5, 0.2, 0.5, 0.2], [0.55, -0.5, 0.45, -1.0], [-0.6, 0.45, 0.48, 2.6],
  [-0.4, -0.6, 0.46, -2.4], [0.0, -0.75, 0.42, -1.6], [-0.1, 0.7, 0.44, 1.6]
];
for (const [x, z, size, az] of ferns) makeFern(x, z, size, az);

// Ceramic deer
const deer = new THREE.Group();
deer.position.set(0, SOIL_TOP, 0);
deer.scale.setScalar(0.9);
deer.rotation.y = -0.4;
scene.add(deer);

const glaze = new THREE.MeshStandardMaterial({ color: 0xefe6d6, roughness: 0.3, metalness: 0 });
const glazeDark = new THREE.MeshStandardMaterial({ color: 0xd9c7a8, roughness: 0.35 });

function part(geo, mat, pos, rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos);
  m.rotation.set(...rot);
  m.scale.set(...scale);
  m.castShadow = true;
  m.receiveShadow = true;
  deer.add(m);
  return m;
}

part(new THREE.CapsuleGeometry(0.2, 0.45, 8, 16), glaze, [0, 0.55, 0], [0, 0, Math.PI / 2]);
for (const [x, z] of [[0.22, 0.1], [0.22, -0.1], [-0.22, 0.1], [-0.22, -0.1]]) {
  part(new THREE.CylinderGeometry(0.05, 0.04, 0.45, 12), glazeDark, [x, 0.22, z]);
}
part(new THREE.CylinderGeometry(0.09, 0.12, 0.4, 12), glaze, [0.38, 0.8, 0], [0, 0, -0.5]);
part(new THREE.SphereGeometry(0.13, 16, 12), glaze, [0.55, 1.02, 0], [0, 0, 0], [1.4, 1, 0.9]);
part(new THREE.SphereGeometry(0.04, 8, 6), glazeDark, [0.66, 0.99, 0]);
part(new THREE.SphereGeometry(0.06, 10, 8), glaze, [-0.6, 0.6, 0]);
for (const s of [-1, 1]) {
  part(new THREE.ConeGeometry(0.03, 0.1, 8), glaze, [0.5, 1.13, s * 0.1], [s * 0.4, 0, 0.6]);
  const antler = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.5, 1.12, s * 0.05),
    new THREE.Vector3(0.45, 1.3, s * 0.09),
    new THREE.Vector3(0.42, 1.45, s * 0.12),
    new THREE.Vector3(0.4, 1.52, s * 0.1)
  ]);
  const branch = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.45, 1.3, s * 0.09),
    new THREE.Vector3(0.52, 1.36, s * 0.16)
  ]);
  for (const c of [antler, branch]) {
    const tube = new THREE.Mesh(new THREE.TubeGeometry(c, 10, 0.015, 6), glazeDark);
    tube.castShadow = true;
    deer.add(tube);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
