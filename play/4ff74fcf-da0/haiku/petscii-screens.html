<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PETSCII screens</title>
<style>
html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; }
canvas { width: min(96vw, 153.6vh); height: auto; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="800"></canvas>
<script>
const COLS = 40, ROWS = 25, CELL = 32;
const PAL = ['#000000', '#ffffff', '#883932', '#67b6bd', '#8b3f96', '#55a049', '#40318d', '#bfce72',
             '#8b5429', '#574200', '#b86962', '#505050', '#787878', '#94e089', '#7869c4', '#9f9f9f'];
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const hash = (c, r) => Math.imul(c * 73 + r * 151 + 1, 0x9E3779B1) >>> 31;
const mod = (n, m) => ((n % m) + m) % m;

function fillCell(c, r, color) {
  ctx.fillStyle = color;
  ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
}

function quadCell(c, r, mask, fg, bg) {
  fillCell(c, r, bg);
  ctx.fillStyle = fg;
  const h = CELL / 2, x = c * CELL, y = r * CELL;
  if (mask & 1) ctx.fillRect(x, y, h, h);
  if (mask & 2) ctx.fillRect(x + h, y, h, h);
  if (mask & 4) ctx.fillRect(x, y + h, h, h);
  if (mask & 8) ctx.fillRect(x + h, y + h, h, h);
}

function diagCell(c, r, upperLeft, fg, bg) {
  fillCell(c, r, bg);
  ctx.fillStyle = fg;
  const x = c * CELL, y = r * CELL, s = CELL;
  ctx.beginPath();
  if (upperLeft) {
    ctx.moveTo(x, y); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s);
  } else {
    ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s); ctx.lineTo(x, y + s);
  }
  ctx.closePath();
  ctx.fill();
}

function putChar(c, r, ch, fg, bg) {
  fillCell(c, r, bg);
  ctx.fillStyle = fg;
  ctx.font = 'bold 24px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ch, c * CELL + CELL / 2, r * CELL + CELL / 2 + 1);
}

function putText(c0, r, str, fg, bg) {
  [...str].forEach((ch, i) => putChar(c0 + i, r, ch, fg, bg));
}

function putCentered(r, str, fg, bg) {
  putText(Math.floor((COLS - str.length) / 2), r, str, fg, bg);
}

function panel(c0, r0, w, h, border, inner) {
  for (let r = r0; r < r0 + h; r++) {
    for (let c = c0; c < c0 + w; c++) {
      const edge = r === r0 || r === r0 + h - 1 || c === c0 || c === c0 + w - 1;
      fillCell(c, r, edge ? border : inner);
    }
  }
}

function intro(t) {
  const ramp = [6, 14, 3, 1, 7];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const h = Math.sin(c * 0.35 + t * 1.3) + Math.cos(r * 0.45 - t * 0.9) + Math.sin((c + r) * 0.2 + t * 0.6);
      const idx = Math.min(ramp.length - 1, Math.max(0, Math.floor((h + 3) / 6 * ramp.length)));
      const upperLeft = (hash(c, r) + Math.floor(t * 0.5)) & 1;
      diagCell(c, r, upperLeft, PAL[ramp[idx]], PAL[0]);
    }
  }
  panel(6, 8, 28, 9, PAL[1], PAL[0]);
  putCentered(10, 'RETRO COMPUTING', PAL[1], PAL[0]);
  putCentered(12, 'MEETUP', PAL[7], PAL[0]);
}

function breakCard(t) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let mask = 0, sum = 0;
      for (let dy = 0; dy < 2; dy++) {
        for (let dx = 0; dx < 2; dx++) {
          const x = c * 2 + dx, y = r * 2 + dy;
          const v = Math.sin(x * 0.42 + t) + Math.sin(y * 0.38 - t * 0.7) + Math.sin((x + y) * 0.25 + t * 0.5);
          sum += v;
          if (v > 0) mask |= 1 << (dy * 2 + dx);
        }
      }
      quadCell(c, r, mask, sum > 0 ? PAL[14] : PAL[3], PAL[6]);
    }
  }
  panel(9, 9, 22, 7, PAL[1], PAL[0]);
  putCentered(11, 'BREAK', PAL[7], PAL[0]);
  putCentered(13, 'BACK IN A MOMENT', PAL[1], PAL[0]);
}

function outro(t) {
  const ramp = [6, 14, 3, 1];
  const cx = (COLS - 1) / 2, cy = (ROWS - 1) / 2;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const dx = c - cx, dy = r - cy;
      const d = Math.hypot(dx, dy);
      const a = Math.atan2(dy, dx);
      const k = Math.floor(d * 0.6 - t * 2);
      const upperLeft = (Math.floor(a * 4 / Math.PI) + k) & 1;
      diagCell(c, r, upperLeft, PAL[ramp[mod(k, ramp.length)]], PAL[0]);
    }
  }
  panel(4, 9, 32, 7, PAL[1], PAL[0]);
  putCentered(11, 'THANKS FOR WATCHING', PAL[7], PAL[0]);
  putCentered(13, 'SEE YOU AT THE NEXT MEETUP', PAL[1], PAL[0]);
}

const SCREENS = [['intro', intro], ['break', breakCard], ['outro', outro]];
let current = 0, paused = false, t = 0, last = performance.now();

function frame(now) {
  if (!paused) t += (now - last) / 1000;
  last = now;
  SCREENS[current][1](t);
  requestAnimationFrame(frame);
}

document.addEventListener('keydown', e => {
  if (e.key === '1' || e.key === '2' || e.key === '3') current = Number(e.key) - 1;
  else if (e.key === ' ') { paused = !paused; e.preventDefault(); }
  else if (e.key === 's' || e.key === 'S') {
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `petscii-${SCREENS[current][0]}.png`;
      a.click();
    });
  }
});

requestAnimationFrame(frame);
</script>
</body>
</html>
