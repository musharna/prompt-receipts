    .tw2 { animation: blink 4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: 1; transform: scale(1) rotate(0deg); }
                         50%     { opacity: .3; transform: scale(.45) rotate(45deg); } }
    @keyframes blink   { 0%,100% { opacity: .9; } 50% { opacity: .1; } }
