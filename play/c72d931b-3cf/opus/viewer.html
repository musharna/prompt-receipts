<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Park trees</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#b9d3e8}#l{position:fixed;left:10px;top:8px;font:13px sans-serif;color:#234}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div id="l">Drag to orbit, scroll to zoom. <code>?tree=olive_old</code> shows a single tree.</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const NAMES = ['weeping_willow', 'silver_birch', 'olive_old', 'cherry_blossom', 'oak_young'];
const q = new URLSearchParams(location.search);
const list = q.get('tree') ? [q.get('tree')] : NAMES;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d3e8);
scene.fog = new THREE.Fog(0xb9d3e8, 60, 140);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x5a6b3a, 1.3));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(20, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 120 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 64), new THREE.MeshStandardMaterial({ color: 0x5f7f3a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
const spacing = 13;
const x0 = -spacing * (list.length - 1) / 2;
if (list.length === 1) { camera.position.set(9, 5, 14); controls.target.set(0, 4, 0); }
else { camera.position.set(0, 9, 48); controls.target.set(0, 5, 0); }
if (q.get('cam')) { const c = q.get('cam').split(',').map(Number); camera.position.set(c[0], c[1], c[2]); controls.target.set(c[3], c[4], c[5]); }
controls.update();

const loader = new GLTFLoader();
let pending = list.length;
list.forEach((name, i) => loader.load(`models/${name}.glb`, g => {
  g.scene.position.x = x0 + i * spacing;
  g.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(g.scene);
  if (--pending === 0) document.title = 'loaded';
}));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
