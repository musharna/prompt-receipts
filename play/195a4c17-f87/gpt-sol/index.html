<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small collection of warm, handmade-feeling interface animations for a pottery shop."
    />
    <title>Clay & Kin — Tiny shop animations</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="intro">
        <a class="brand" href="#" aria-label="Clay and Kin home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 44 44" role="img">
              <path d="M9 14.5c0 12.8 4.6 20 13 20s13-7.2 13-20H9Z" />
              <path d="M7 10.5c0-2 6.7-3.7 15-3.7s15 1.7 15 3.7-6.7 3.7-15 3.7-15-1.7-15-3.7Z" />
              <path d="M15.3 25.3c2.2 1.2 4.4 1.8 6.7 1.8 2.4 0 4.7-.6 6.9-1.9" />
            </svg>
          </span>
          <span>Clay &amp; Kin</span>
        </a>
        <div class="eyebrow">From the interface studio</div>
        <h1>Small moments,<br /><em>made by hand.</em></h1>
        <p class="lede">
          Four tactile micro-animations for the moments that make shopping feel personal.
          Tap each tile to see it move.
        </p>
      </header>

      <section class="animation-grid" aria-label="Shop animation examples">
        <button class="motion-card success-card" data-animation="success" type="button">
          <span class="card-number">01</span>
          <span class="demo-stage">
            <span class="motion-icon success-icon is-playing" aria-hidden="true">
              <svg viewBox="0 0 120 120">
                <circle class="success-ring" cx="60" cy="60" r="38" />
                <path class="success-tick" d="m41 61 12 12 27-29" />
              </svg>
              <i class="success-ray ray-one"></i>
              <i class="success-ray ray-two"></i>
              <i class="success-ray ray-three"></i>
            </span>
          </span>
          <span class="card-copy">
            <strong>Order placed</strong>
            <small>A satisfying little finish</small>
          </span>
          <span class="replay">Tap to replay <span aria-hidden="true">↻</span></span>
        </button>

        <button class="motion-card error-card" data-animation="error" type="button">
          <span class="card-number">02</span>
          <span class="demo-stage">
            <span class="motion-icon error-icon is-playing" aria-hidden="true">
              <svg viewBox="0 0 120 120">
                <circle class="error-ring" cx="60" cy="60" r="38" />
                <path class="error-line error-line-one" d="M45 45 75 75" />
                <path class="error-line error-line-two" d="M75 45 45 75" />
              </svg>
            </span>
          </span>
          <span class="card-copy">
            <strong>Not quite</strong>
            <small>Clear, gentle feedback</small>
          </span>
          <span class="replay">Tap to replay <span aria-hidden="true">↻</span></span>
        </button>

        <button
          class="motion-card favourite-card"
          data-animation="favourite"
          type="button"
          aria-pressed="false"
        >
          <span class="card-number">03</span>
          <span class="demo-stage">
            <span class="motion-icon heart-icon is-playing" aria-hidden="true">
              <svg class="heart-svg" viewBox="0 0 120 120">
                <path
                  class="heart-shape"
                  d="M60 91.5 28.8 62.1C12.2 46.5 35.9 23.9 51.3 39.7L60 48.6l8.7-8.9c15.4-15.8 39.1 6.8 22.5 22.4L60 91.5Z"
                />
              </svg>
              <i class="heart-dot dot-one"></i>
              <i class="heart-dot dot-two"></i>
              <i class="heart-dot dot-three"></i>
              <i class="heart-dot dot-four"></i>
              <i class="heart-dot dot-five"></i>
              <i class="heart-dot dot-six"></i>
            </span>
          </span>
          <span class="card-copy">
            <strong>Saved to favourites</strong>
            <small>A pop of affection</small>
          </span>
          <span class="replay">Tap to replay <span aria-hidden="true">↻</span></span>
        </button>

        <button class="motion-card sparkle-card" data-animation="sparkle" type="button">
          <span class="new-label">Just glazed</span>
          <span class="card-number">04</span>
          <span class="demo-stage pottery-stage">
            <span class="pot" aria-hidden="true">
              <i class="pot-rim"></i>
              <i class="pot-shine"></i>
            </span>
            <span class="motion-icon sparkle-icon is-playing" aria-hidden="true">
              <svg class="sparkle sparkle-one" viewBox="0 0 40 40">
                <path d="M20 2c1.5 11.8 6.2 16.5 18 18-11.8 1.5-16.5 6.2-18 18-1.5-11.8-6.2-16.5-18-18C13.8 18.5 18.5 13.8 20 2Z" />
              </svg>
              <svg class="sparkle sparkle-two" viewBox="0 0 40 40">
                <path d="M20 4c1.3 10.5 5.5 14.7 16 16-10.5 1.3-14.7 5.5-16 16-1.3-10.5-5.5-14.7-16-16 10.5-1.3 14.7-5.5 16-16Z" />
              </svg>
              <svg class="sparkle sparkle-three" viewBox="0 0 40 40">
                <path d="M20 5c1.2 9.8 5.2 13.8 15 15-9.8 1.2-13.8 5.2-15 15-1.2-9.8-5.2-13.8-15-15 9.8-1.2 13.8-5.2 15-15Z" />
              </svg>
            </span>
          </span>
          <span class="card-copy">
            <strong>Fresh from the kiln</strong>
            <small>A quiet twinkle for new pieces</small>
          </span>
          <span class="replay">Tap to replay <span aria-hidden="true">↻</span></span>
        </button>
      </section>

      <footer>
        <span>Wheel-thrown in small batches</span>
        <span class="footer-flower" aria-hidden="true">✣</span>
        <span>Made slowly, kept for years</span>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
