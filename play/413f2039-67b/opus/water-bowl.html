<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Water Pouring into a Glass Bowl</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1620; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hint { position: fixed; bottom: 14px; width: 100%; text-align: center;
          font: 13px system-ui, sans-serif; color: #7f97ab; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click to toggle pouring · R to empty the bowl</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr, bowl;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = Math.min(W, H) * 0.28;
  // Bowl = lower part of a circle, cut off a little below the center (the rim)
  bowl = { cx: W / 2, cy: H * 0.52, R, rimY: H * 0.52 + R * 0.08 };
}
window.addEventListener('resize', resize);
resize();

// ---------- State ----------
let pouring = true;
let fill = 0;                 // filled area in px² of bowl cross-section
const particles = [];         // stream drops
const splashes = [];          // splash droplets
const N = 80;                 // surface wave resolution
const wave = new Float32Array(N), waveV = new Float32Array(N);

canvas.addEventListener('click', () => pouring = !pouring);
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { fill = 0; wave.fill(0); waveV.fill(0); }
});

// ---------- Geometry helpers ----------
// Area of the bowl cross-section below height y (circle segment below y, capped at rim)
function areaBelow(y) {
  const { cy, R } = bowl;
  const d = y - cy;                      // distance of chord from center (positive = below)
  if (d >= R) return 0;
  const dd = Math.max(-R, d);
  return R * R * Math.acos(dd / R) - dd * Math.sqrt(R * R - dd * dd);
}
const maxArea = () => areaBelow(bowl.rimY - 4);

function levelFromArea(a) {
  let lo = bowl.rimY, hi = bowl.cy + bowl.R;
  for (let i = 0; i < 30; i++) {
    const mid = (lo + hi) / 2;
    if (areaBelow(mid) > a) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function halfWidthAt(y) {
  const d = y - bowl.cy;
  return Math.sqrt(Math.max(0, bowl.R * bowl.R - d * d));
}

// ---------- Simulation ----------
const G = 1400;
function spawnStream(dt) {
  const n = Math.ceil(220 * dt);
  for (let i = 0; i < n; i++) {
    particles.push({
      x: bowl.cx - bowl.R * 0.12 + (Math.random() - 0.5) * 3,
      y: H * 0.04,
      vx: 18 + Math.random() * 4,
      vy: 40 + Math.random() * 20,
      r: 2.2 + Math.random() * 1.6
    });
  }
}

function disturb(x, amount) {
  const level = levelFromArea(fill);
  const hw = halfWidthAt(level);
  if (hw < 2) return;
  const i = Math.round(((x - (bowl.cx - hw)) / (2 * hw)) * (N - 1));
  for (let k = -2; k <= 2; k++) {
    const j = i + k;
    if (j >= 0 && j < N) waveV[j] += amount * (1 - Math.abs(k) / 3);
  }
}

function step(dt) {
  if (pouring && fill < maxArea()) spawnStream(dt);

  const level = levelFromArea(fill);
  const bottom = bowl.cy + bowl.R;
  const hasWater = fill > 20;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    // hit the water surface, or the glass bottom when empty
    const glassY = bowl.cy + Math.sqrt(Math.max(0, bowl.R ** 2 - (p.x - bowl.cx) ** 2)) - 3;
    const hitY = hasWater ? Math.min(level, glassY) : glassY;
    if (p.y >= hitY) {
      fill = Math.min(maxArea(), fill + p.r * p.r * 2.2);
      if (hasWater) disturb(p.x, 22);
      if (Math.random() < 0.35) {
        splashes.push({
          x: p.x, y: hitY,
          vx: (Math.random() - 0.5) * 260,
          vy: -120 - Math.random() * 260,
          r: 1 + Math.random() * 1.8, life: 1
        });
      }
      particles.splice(i, 1);
    }
  }

  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i];
    s.vy += G * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.6;
    const lvl = fill > 20 ? level : bottom;
    if ((s.vy > 0 && s.y > lvl) || s.life <= 0) splashes.splice(i, 1);
  }

  // spring-based surface waves
  for (let k = 0; k < 3; k++) {
    for (let i = 0; i < N; i++) {
      const l = wave[i - 1] ?? 0, r = wave[i + 1] ?? 0;
      waveV[i] += ((l + r) / 2 - wave[i]) * 60 * dt - wave[i] * 6 * dt;
      waveV[i] *= 0.992;
    }
    for (let i = 0; i < N; i++) wave[i] += waveV[i] * dt;
  }
  for (let i = 0; i < N; i++) wave[i] = Math.max(-8, Math.min(8, wave[i]));
}

// ---------- Rendering ----------
function bowlPath() {
  const { cx, cy, R, rimY } = bowl;
  const a = Math.asin((rimY - cy) / R);
  ctx.beginPath();
  ctx.arc(cx, cy, R, a, Math.PI - a);
  ctx.closePath();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b2b3a'); g.addColorStop(1, '#0a1118');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // table
  const tY = bowl.cy + bowl.R + 6;
  const tg = ctx.createLinearGradient(0, tY, 0, H);
  tg.addColorStop(0, '#2a2420'); tg.addColorStop(1, '#14100d');
  ctx.fillStyle = tg; ctx.fillRect(0, tY, W, H - tY);
  // bowl shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(bowl.cx, tY + 4, bowl.R * 0.75, 10, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawStream() {
  ctx.fillStyle = 'rgba(150,210,255,0.55)';
  for (const p of particles) {
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r, p.r * 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // bright core highlight
  ctx.fillStyle = 'rgba(230,248,255,0.35)';
  for (let i = 0; i < particles.length; i += 3) {
    const p = particles[i];
    ctx.fillRect(p.x - 0.6, p.y - p.r, 1.2, p.r * 2);
  }
  ctx.fillStyle = 'rgba(190,230,255,0.75)';
  for (const s of splashes) {
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWater(t) {
  if (fill < 20) return;
  const level = levelFromArea(fill);
  const hw = halfWidthAt(level);
  const x0 = bowl.cx - hw, x1 = bowl.cx + hw;

  ctx.save();
  bowlPath(); ctx.clip();

  const surfY = i => level + wave[i] + Math.sin(t * 2.2 + i * 0.35) * 0.8;
  ctx.beginPath();
  ctx.moveTo(x0 - 10, surfY(0));
  for (let i = 0; i < N; i++) ctx.lineTo(x0 + (i / (N - 1)) * (x1 - x0), surfY(i));
  ctx.lineTo(x1 + 10, surfY(N - 1));
  ctx.lineTo(x1 + 10, bowl.cy + bowl.R + 10);
  ctx.lineTo(x0 - 10, bowl.cy + bowl.R + 10);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, level, 0, bowl.cy + bowl.R);
  g.addColorStop(0, 'rgba(90,170,230,0.55)');
  g.addColorStop(1, 'rgba(25,80,150,0.75)');
  ctx.fillStyle = g; ctx.fill();

  // surface line + meniscus shimmer
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const x = x0 + (i / (N - 1)) * (x1 - x0);
    i ? ctx.lineTo(x, surfY(i)) : ctx.moveTo(x, surfY(i));
  }
  ctx.strokeStyle = 'rgba(210,240,255,0.8)'; ctx.lineWidth = 1.6; ctx.stroke();

  // caustic-ish light bands
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 5; k++) {
    const y = level + 12 + k * 14 + Math.sin(t * 1.3 + k) * 3;
    ctx.strokeStyle = `rgba(120,200,255,${0.05 - k * 0.008})`;
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 8) {
      const yy = y + Math.sin(x * 0.04 + t * 2 + k) * 3;
      x === x0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawGlass() {
  const { cx, cy, R, rimY } = bowl;
  // body tint
  ctx.save();
  bowlPath();
  const g = ctx.createRadialGradient(cx - R * 0.3, cy + R * 0.3, R * 0.1, cx, cy, R);
  g.addColorStop(0, 'rgba(255,255,255,0.03)');
  g.addColorStop(1, 'rgba(200,230,255,0.12)');
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();

  // outline (double for thickness)
  const a = Math.asin((rimY - cy) / R);
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(210,235,255,0.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R, a, Math.PI - a); ctx.stroke();
  ctx.strokeStyle = 'rgba(210,235,255,0.18)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, R - 6, a + 0.03, Math.PI - a - 0.03); ctx.stroke();

  // rim ellipse
  const rimHW = halfWidthAt(rimY);
  ctx.strokeStyle = 'rgba(220,240,255,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, rimY, rimHW, R * 0.09, 0, 0, Math.PI * 2); ctx.stroke();

  // specular highlights
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(cx, cy, R - 12, Math.PI * 0.62, Math.PI * 0.82); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R - 12, Math.PI * 0.2, Math.PI * 0.28); ctx.stroke();

  // foot
  ctx.fillStyle = 'rgba(200,230,255,0.15)';
  ctx.strokeStyle = 'rgba(210,235,255,0.4)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(cx, cy + R + 2, R * 0.3, 5, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
}

function drawPitcherSpout() {
  const x = bowl.cx - bowl.R * 0.12, y = H * 0.04;
  ctx.fillStyle = '#c9d3dc';
  ctx.beginPath();
  ctx.moveTo(x - 60, y - 40); ctx.lineTo(x + 4, y - 6);
  ctx.quadraticCurveTo(x + 8, y + 2, x, y + 2);
  ctx.lineTo(x - 70, y - 18); ctx.closePath(); ctx.fill();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  step(dt);
  const t = now / 1000;
  drawBackground();
  drawWater(t);
  drawGlass();
  drawStream();
  drawPitcherSpout();
  if (fill >= maxArea() - 1 && pouring) pouring = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
