<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Grower</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6eaf2; }
  canvas { display: block; }
  #panel { position: fixed; top: 14px; left: 14px; width: 260px; padding: 14px 16px;
    background: rgba(12, 14, 22, .72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .08); border-radius: 12px; font-size: 13px; box-sizing: border-box; }
  #panel h1 { font-size: 15px; font-weight: 600; margin: 0 0 8px; letter-spacing: .02em; }
  #panel label { display: block; margin: 10px 0 3px; opacity: .9; }
  #panel label .val { float: right; opacity: .6; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { width: 100%; margin: 0; accent-color: #9fd3ff; }
  #panel select, #panel button { font: inherit; color: inherit; background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .12); border-radius: 7px; padding: 5px 8px; }
  #panel select { width: 100%; }
  #panel button { cursor: pointer; flex: 1; }
  #panel button:hover { background: rgba(255, 255, 255, .14); }
  #panel .row { display: flex; gap: 6px; margin-top: 12px; }
  #panel .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  #panel .hint { margin: 12px 0 0; font-size: 11.5px; line-height: 1.45; opacity: .5; }
  #stats { position: fixed; bottom: 12px; left: 14px; font-size: 12px; opacity: .6;
    font-variant-numeric: tabular-nums; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="panel">
  <h1>Crystal Grower</h1>

  <label>Material</label>
  <select id="material">
    <option value="quartz">Quartz (clear)</option>
    <option value="amethyst">Amethyst</option>
    <option value="citrine">Citrine</option>
    <option value="emerald">Emerald beryl</option>
    <option value="rose">Rose quartz</option>
    <option value="diamond">Diamond</option>
  </select>

  <label>Supersaturation <span class="val" id="v_supersat"></span></label>
  <input id="supersat" type="range" min="0.02" max="0.6" step="0.01" value="0.15">

  <label>Diffusion limit <span class="val" id="v_diffusion"></span></label>
  <input id="diffusion" type="range" min="0" max="1" step="0.01" value="0.2">

  <label>Facet anisotropy <span class="val" id="v_aniso"></span></label>
  <input id="aniso" type="range" min="0" max="1" step="0.01" value="0.8">

  <label>Sim steps / frame <span class="val" id="v_steps"></span></label>
  <input id="steps" type="range" min="1" max="12" step="1" value="3">

  <label>Grid resolution</label>
  <select id="grid">
    <option value="48">48³ (fast)</option>
    <option value="64" selected>64³</option>
    <option value="96">96³ (slow, detailed)</option>
  </select>

  <div class="row">
    <button id="play">Pause</button>
    <button id="reset">Reset</button>
    <button id="shot">Save PNG</button>
  </div>

  <div class="check">
    <input id="rotate" type="checkbox">
    <label for="rotate" style="margin:0">Auto-rotate</label>
  </div>

  <p class="hint">
    Drag to orbit · right-drag to pan · scroll to zoom · Space to pause.<br>
    <b>Low diffusion limit</b> = compact, faceted crystals.
    <b>High</b> = branching dendrites, like snowflakes.
  </p>
</div>

<div id="stats"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const BOX = 1.2;   // half-size of the growth box, world units

const PRESETS = {
  quartz:   { ior: 1.544, att: '#ffffff', dist: 1e6,  thick: 1.0, disp: 0 },
  amethyst: { ior: 1.544, att: '#7a2cff', dist: 0.6,  thick: 1.0, disp: 0 },
  citrine:  { ior: 1.55,  att: '#ffa316', dist: 0.6,  thick: 1.0, disp: 0 },
  emerald:  { ior: 1.576, att: '#1ea86a', dist: 0.45, thick: 1.0, disp: 0 },
  rose:     { ior: 1.544, att: '#ff8fb8', dist: 0.9,  thick: 1.0, disp: 0 },
  diamond:  { ior: 2.417, att: '#ffffff', dist: 1e6,  thick: 0.8, disp: 3 },
};

const P = { material: 'quartz', supersat: 0.15, diffusion: 0.2, aniso: 0.8, steps: 3, grid: 64 };

// ---- SIM START
// Lattice growth on a cubic grid. Each empty cell touching the crystal attaches
// with a probability set by: how many faces it shares with the crystal (kinks
// grow fast, flat faces slow -> facets), the local nutrient level (diffusion
// limit -> branching), and the overall supersaturation (speed).
const W_BASE = [0, 0.03, 0.2, 0.7, 1, 1, 1];   // attachment weight by face-neighbour count

class Grower {
  constructor(N) {
    this.N = N;
    const n = N * N * N;
    this.occ = new Uint8Array(n);
    this.conc = new Float32Array(n).fill(1);   // nutrient: 1 far away, 0 at crystal
    this.count = 0;
    this.steps = 0;
    this.changed = false;
    this.finished = false;
    const c = N >> 1;
    for (let k = c - 1; k <= c + 1; k++)
      for (let j = c - 1; j <= c + 1; j++)
        for (let i = c - 1; i <= c + 1; i++) this.set(i + N * j + N * N * k);
  }

  set(id) {
    if (!this.occ[id]) { this.occ[id] = 1; this.count++; }
  }

  step(p) {
    const N = this.N, N2 = N * N, occ = this.occ, conc = this.conc;

    // 1. Relax the nutrient toward quasi-steady state (crystal acts as a sink).
    for (let sweep = 0; sweep < 2; sweep++) {
      for (let k = 1; k < N - 1; k++)
        for (let j = 1; j < N - 1; j++) {
          let id = 1 + N * j + N2 * k;
          for (let i = 1; i < N - 1; i++, id++) {
            conc[id] = occ[id] ? 0
              : (conc[id - 1] + conc[id + 1] + conc[id - N] + conc[id + N] + conc[id - N2] + conc[id + N2]) / 6;
          }
        }
    }

    // 2. Stochastic attachment at the crystal surface.
    const w = [0];
    for (let n = 1; n <= 6; n++) w[n] = 1 + p.aniso * (W_BASE[n] - 1);
    const D = p.diffusion, S = p.supersat;
    const add = [];
    for (let k = 1; k < N - 1; k++)
      for (let j = 1; j < N - 1; j++) {
        let id = 1 + N * j + N2 * k;
        for (let i = 1; i < N - 1; i++, id++) {
          if (occ[id]) continue;
          const n = occ[id - 1] + occ[id + 1] + occ[id - N] + occ[id + N] + occ[id - N2] + occ[id + N2];
          if (n === 0) continue;
          const rate = S * w[n] * (1 - D + D * conc[id]);
          if (Math.random() < rate) add.push(id);
        }
      }

    for (const id of add) {
      this.set(id);
      const i = id % N, j = ((id / N) | 0) % N, k = (id / N2) | 0;
      if (i <= 2 || j <= 2 || k <= 2 || i >= N - 3 || j >= N - 3 || k >= N - 3) this.finished = true;
    }
    if (add.length) this.changed = true;
    this.steps++;
  }
}

// Separable [1,2,1]/4 blur along one axis. `s` is the index stride of that axis.
function blurStride(src, dst, N, s) {
  const n = src.length, N2 = N * N;
  for (let id = 0; id < n; id++) {
    const c = s === 1 ? id % N : s === N ? ((id / N) | 0) % N : (id / N2) | 0;
    const lo = c > 0 ? src[id - s] : src[id];
    const hi = c < N - 1 ? src[id + s] : src[id];
    dst[id] = 0.25 * lo + 0.5 * src[id] + 0.25 * hi;
  }
}

// Smooth the 0/1 occupancy into a continuous field so the iso-surface is not blocky.
function smoothField(occ, N, passes = 2) {
  const n = occ.length, N2 = N * N;
  let src = new Float32Array(n), dst = new Float32Array(n);
  for (let id = 0; id < n; id++) src[id] = occ[id];
  for (let pass = 0; pass < passes; pass++)
    for (const s of [1, N, N2]) {
      blurStride(src, dst, N, s);
      [src, dst] = [dst, src];
    }
  return src;
}

// Naive surface nets: one vertex per sign-changing cell, one quad per sign-changing grid edge.
// Returns world-space positions/normals and triangle indices.
function surfaceNets(f, N, iso, half) {
  const N2 = N * N;
  const vid = new Int32Array(N * N2).fill(-1);
  const pos = [], nrm = [];
  const CX = [0, 1, 0, 1, 0, 1, 0, 1], CY = [0, 0, 1, 1, 0, 0, 1, 1], CZ = [0, 0, 0, 0, 1, 1, 1, 1];
  const CO = [0, 1, N, 1 + N, N2, 1 + N2, N + N2, 1 + N + N2];
  const EDGE = [0, 1, 2, 3, 4, 5, 6, 7, 0, 2, 1, 3, 4, 6, 5, 7, 0, 4, 1, 5, 2, 6, 3, 7];

  for (let k = 0; k < N - 1; k++)
    for (let j = 0; j < N - 1; j++)
      for (let i = 0; i < N - 1; i++) {
        const id = i + N * j + N2 * k;
        let mask = 0;
        for (let c = 0; c < 8; c++) if (f[id + CO[c]] >= iso) mask |= 1 << c;
        if (mask === 0 || mask === 255) continue;

        let sx = 0, sy = 0, sz = 0, m = 0;
        for (let e = 0; e < 24; e += 2) {
          const a = EDGE[e], b = EDGE[e + 1];
          const fa = f[id + CO[a]], fb = f[id + CO[b]];
          if ((fa >= iso) !== (fb >= iso)) {
            const t = (iso - fa) / (fb - fa);
            sx += CX[a] + (CX[b] - CX[a]) * t;
            sy += CY[a] + (CY[b] - CY[a]) * t;
            sz += CZ[a] + (CZ[b] - CZ[a]) * t;
            m++;
          }
        }

        // Gradient from the 8 corners gives a smooth outward normal.
        let gx = 0, gy = 0, gz = 0;
        for (let c = 0; c < 8; c++) {
          const v = f[id + CO[c]];
          gx += CX[c] ? v : -v;
          gy += CY[c] ? v : -v;
          gz += CZ[c] ? v : -v;
        }
        const L = Math.hypot(gx, gy, gz) || 1;

        vid[id] = pos.length / 3;
        pos.push(i + sx / m, j + sy / m, k + sz / m);
        nrm.push(-gx / L, -gy / L, -gz / L);
      }

  const idx = [];
  const ST = [1, N, N2];
  for (let a = 0; a < 3; a++) {
    const p = (a + 1) % 3, q = (a + 2) % 3;
    for (let k = 0; k < N - 1; k++)
      for (let j = 0; j < N - 1; j++)
        for (let i = 0; i < N - 1; i++) {
          const co = [i, j, k];
          if (co[p] === 0 || co[q] === 0) continue;
          const id = i + N * j + N2 * k;
          const inA = f[id] >= iso, inB = f[id + ST[a]] >= iso;
          if (inA === inB) continue;
          const v0 = vid[id - ST[p] - ST[q]], v1 = vid[id - ST[p]], v2 = vid[id], v3 = vid[id - ST[q]];
          if (v0 < 0 || v1 < 0 || v2 < 0 || v3 < 0) continue;

          // Wind the quad so its front face points out of the solid.
          const o = 3 * v0, A = 3 * v1, B = 3 * v2;
          const e1 = [pos[A] - pos[o], pos[A + 1] - pos[o + 1], pos[A + 2] - pos[o + 2]];
          const e2 = [pos[B] - pos[o], pos[B + 1] - pos[o + 1], pos[B + 2] - pos[o + 2]];
          const cr = e1[(a + 1) % 3] * e2[(a + 2) % 3] - e1[(a + 2) % 3] * e2[(a + 1) % 3];
          if (cr * (inA ? 1 : -1) >= 0) idx.push(v0, v1, v2, v0, v2, v3);
          else idx.push(v0, v2, v1, v0, v3, v2);
        }
  }

  const positions = new Float32Array(pos.length);
  const scale = (2 * half) / (N - 1);
  for (let t = 0; t < pos.length; t++) positions[t] = pos[t] * scale - half;
  return { positions, normals: Float32Array.from(nrm), indices: Uint32Array.from(idx) };
}
// ---- SIM END

// ---------------------------------------------------------------- rendering

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = gradientTexture();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;   // reflections & ambient light

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(3.4, 2.4, 4.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.1, 0);
controls.enableDamping = true;
controls.minDistance = 1.5;
controls.maxDistance = 14;

const key = new THREE.DirectionalLight(0xfff3e0, 2.0);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 4;
key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 20 });
scene.add(key);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.3 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -BOX;
floor.receiveShadow = true;
scene.add(floor);

// Transmissive glass. Crystals are see-through, so they do not cast opaque shadows.
const material = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.02,
  transmission: 1, thickness: 1, ior: 1.544,
  specularIntensity: 1, envMapIntensity: 1.2,
  attenuationColor: new THREE.Color(0xffffff), attenuationDistance: 1e6,
});
const crystal = new THREE.Mesh(new THREE.BufferGeometry(), material);
scene.add(crystal);

function applyPreset(name) {
  const m = PRESETS[name];
  material.ior = m.ior;
  material.attenuationColor.set(m.att);
  material.attenuationDistance = m.dist;
  material.thickness = m.thick;
  material.dispersion = m.disp;   // colour fringing (diamond fire)
  material.needsUpdate = true;
}

function gradientTexture() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, '#2a3142');
  grd.addColorStop(0.6, '#101420');
  grd.addColorStop(1, '#050608');
  g.fillStyle = grd;
  g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------------------------------------------------------------- app state

let grower, meshMs = 0;

function newGrowth() {
  grower = new Grower(P.grid);
  rebuildMesh();
}

function rebuildMesh() {
  const t0 = performance.now();
  const N = grower.N;
  const g = surfaceNets(smoothField(grower.occ, N), N, 0.5, BOX);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(g.positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(g.normals, 3));
  geo.setIndex(new THREE.BufferAttribute(g.indices, 1));
  geo.computeBoundingSphere();
  crystal.geometry.dispose();
  crystal.geometry = geo;
  grower.changed = false;
  meshMs = performance.now() - t0;
}

// ---------------------------------------------------------------- UI

const $ = id => document.getElementById(id);
let running = true;

function bindRange(id, key, fmt) {
  const el = $(id), out = $('v_' + id);
  const update = () => { P[key] = parseFloat(el.value); out.textContent = fmt(P[key]); };
  el.addEventListener('input', update);
  update();
}
bindRange('supersat', 'supersat', v => v.toFixed(2));
bindRange('diffusion', 'diffusion', v => v.toFixed(2));
bindRange('aniso', 'aniso', v => v.toFixed(2));
bindRange('steps', 'steps', v => String(v | 0));

$('material').value = P.material;
$('material').addEventListener('change', e => { P.material = e.target.value; applyPreset(P.material); });
$('grid').addEventListener('change', e => { P.grid = parseInt(e.target.value, 10); newGrowth(); });
$('reset').addEventListener('click', newGrowth);
$('play').addEventListener('click', togglePause);
$('shot').addEventListener('click', () => {
  renderer.render(scene, camera);   // grab the buffer in the same task as the render
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = 'crystal.png';
  a.click();
});
$('rotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); togglePause(); } });

function togglePause() {
  running = !running;
  $('play').textContent = running ? 'Pause' : 'Play';
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------- loop

applyPreset(P.material);
newGrowth();

let frame = 0, fpsFrames = 0, fpsTime = performance.now(), fps = 0, statsTime = 0;

function loop(now) {
  requestAnimationFrame(loop);
  frame++;
  fpsFrames++;

  if (running && !grower.finished)
    for (let s = 0; s < P.steps; s++) grower.step(P);

  if (grower.changed && (!running || grower.finished || frame % 4 === 0)) rebuildMesh();

  controls.update();
  renderer.render(scene, camera);

  if (now - fpsTime > 500) {
    fps = Math.round(fpsFrames * 1000 / (now - fpsTime));
    fpsFrames = 0; fpsTime = now;
  }
  if (now - statsTime > 250) {
    statsTime = now;
    const N = grower.N, pct = (100 * grower.count / ((N - 2) ** 3)).toFixed(1);
    const status = grower.finished ? ' · reached box wall, press Reset' : (running ? ' · growing' : ' · paused');
    $('stats').textContent =
      `${grower.count.toLocaleString()} voxels (${pct}% of box) · step ${grower.steps} · mesh ${meshMs.toFixed(0)} ms · ${fps} fps${status}`;
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
