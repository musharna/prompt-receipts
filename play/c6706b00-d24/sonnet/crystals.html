<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crystal Grower</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; font-family: system-ui, sans-serif; color: #dfe6f0; }
  canvas { display: block; }
  #ui { position: absolute; top: 12px; left: 12px; width: 230px; padding: 12px 14px; background: rgba(12,14,20,.72);
        border: 1px solid rgba(255,255,255,.1); border-radius: 10px; backdrop-filter: blur(8px); font-size: 13px; }
  #ui h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; letter-spacing: .04em; }
  #ui label { display: block; margin: 8px 0 2px; opacity: .8; }
  #ui input[type=range], #ui select { width: 100%; }
  #ui select, #ui button { background: #1b2030; color: inherit; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 4px 6px; }
  #ui button { cursor: pointer; margin: 8px 6px 0 0; }
  #ui button:hover { background: #262d44; }
  #bar { height: 6px; background: #1b2030; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  #bar div { height: 100%; width: 100%; background: linear-gradient(90deg,#4aa3ff,#9be7ff); }
  #hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .5; pointer-events: none; }
</style>
</head>
<body>
<div id="ui">
  <h1>CRYSTAL GROWER</h1>
  <label>Mineral</label>
  <select id="mineral">
    <option value="quartz">Clear quartz</option>
    <option value="amethyst">Amethyst</option>
    <option value="citrine">Citrine</option>
    <option value="rose">Rose quartz</option>
    <option value="aqua">Aquamarine</option>
    <option value="smoky">Smoky quartz</option>
  </select>
  <label>Time-lapse speed <span id="vSpeed"></span></label>
  <input id="speed" type="range" min="0" max="8" step="0.1" value="2">
  <label>Solution feed rate</label>
  <input id="feed" type="range" min="0" max="1" step="0.01" value="0.35">
  <label>Nucleation rate</label>
  <input id="nuc" type="range" min="0" max="1" step="0.01" value="0.5">
  <label>Supersaturation <span id="vS"></span></label>
  <div id="bar"><div id="barfill"></div></div>
  <div style="margin-top:8px">Crystals: <span id="count">0</span></div>
  <button id="pause">Pause</button><button id="reset">Reset</button><button id="rot">Auto-rotate</button>
</div>
<div id="hint">drag to orbit · scroll to zoom · right-drag to pan</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090b10);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);
camera.position.set(5, 3.5, 7);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1.5;
controls.maxDistance = 25;
controls.autoRotateSpeed = 0.8;

const key = new THREE.DirectionalLight(0xfff2e0, 2.2);
key.position.set(5, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 25 });
scene.add(key);
const rim1 = new THREE.PointLight(0x7fb0ff, 40, 30); rim1.position.set(-6, 2, -5); scene.add(rim1);
const rim2 = new THREE.PointLight(0xffb070, 30, 30); rim2.position.set(5, -3, -4); scene.add(rim2);
const under = new THREE.PointLight(0xffffff, 20, 30); under.position.set(0, -7, 3); scene.add(under);

// ---------- host rock ----------
const ROCK_R = 2.2;
function rockNoise(x, y, z) {
  return 0.5 * Math.sin(x * 2.1 + 1.3 * Math.sin(y * 1.7)) * Math.cos(z * 2.3 + y)
       + 0.3 * Math.sin(x * 5.3 + y * 4.1) * Math.sin(z * 4.7 - x * 2.0)
       + 0.15 * Math.sin(x * 11 + z * 9) * Math.cos(y * 10);
}
const rockR = d => ROCK_R * (1 + 0.07 * rockNoise(d.x, d.y, d.z));
const rockGeo = new THREE.IcosahedronGeometry(1, 6);
{
  const p = rockGeo.attributes.position, v = new THREE.Vector3(), col = [];
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    const n = rockNoise(v.x * 1.7, v.y * 1.7, v.z * 1.7);
    p.setXYZ(i, v.x * rockR(v), v.y * rockR(v), v.z * rockR(v));
    const s = 0.16 + 0.08 * n;
    col.push(s * 1.05, s * 0.92, s * 0.8);
  }
  rockGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  rockGeo.computeVertexNormals();
}
const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0.05 }));
rock.receiveShadow = true; rock.castShadow = true;
scene.add(rock);

// ---------- minerals ----------
const MINERALS = {
  quartz:   { color: 0xffffff, att: 0xf4fbff, dist: 6,   rough: 0.02 },
  amethyst: { color: 0xc9a0ff, att: 0x8a3fe0, dist: 1.6, rough: 0.03 },
  citrine:  { color: 0xffe2a0, att: 0xf0a020, dist: 1.8, rough: 0.03 },
  rose:     { color: 0xffd6e2, att: 0xf08aa8, dist: 2.0, rough: 0.12 },
  aqua:     { color: 0xc8fff6, att: 0x30c8c0, dist: 1.6, rough: 0.02 },
  smoky:    { color: 0xd8d0c8, att: 0x6a5648, dist: 1.4, rough: 0.04 },
};
const materials = [0, 1, 2].map(() => new THREE.MeshPhysicalMaterial({
  transmission: 1, thickness: 1.2, ior: 1.55, metalness: 0, flatShading: true,
  clearcoat: 0.6, clearcoatRoughness: 0.02, envMapIntensity: 1.4, specularIntensity: 1,
  dispersion: 0.4, attenuationDistance: 3, side: THREE.FrontSide,
}));
function setMineral(name) {
  const m = MINERALS[name];
  materials.forEach((mat, i) => {
    mat.color.set(m.color); mat.attenuationColor.set(m.att);
    mat.attenuationDistance = m.dist * (0.8 + 0.2 * i);
    mat.roughness = m.rough + 0.015 * i;
    mat.needsUpdate = true;
  });
}
setMineral('quartz');

// ---------- crystal geometry (hexagonal prism + pyramid termination) ----------
const prismGeo = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true); prismGeo.translate(0, 0.5, 0);
const tipGeo = new THREE.CylinderGeometry(0.1, 1, 1, 6, 1, false); tipGeo.translate(0, 0.5, 0);
tipGeo.rotateY(0); // same hex orientation as the prism

const UP = new THREE.Vector3(0, 1, 0);
const crystals = [];       // all crystals
const roots = [];          // crystals nucleated on the rock
const MAX_ROOTS = 80, MAX_TOTAL = 150;

class Crystal {
  constructor(parent, depth) {
    this.group = new THREE.Group();
    const mat = materials[(Math.random() * materials.length) | 0];
    this.prism = new THREE.Mesh(prismGeo, mat);
    this.tip = new THREE.Mesh(tipGeo, mat);
    for (const m of [this.prism, this.tip]) { m.castShadow = true; this.group.add(m); }
    this.depth = depth;
    this.L = 0.02; this.R = 0.015;
    this.aspect = (depth ? 2.5 : 3) + Math.random() * 4;
    this.maxR = (depth ? 0.12 : 0.2) + Math.random() * 0.18;
    this.vigor = 0.6 + Math.random() * 0.8;
    this.neighbors = 0;
    this.children = 0;
    parent.add(this.group);
    this.update();
    crystals.push(this);
  }
  update() {
    this.prism.scale.set(this.R, this.L, this.R);
    this.tip.position.y = this.L;
    this.tip.scale.set(this.R, this.R * 1.15, this.R);
  }
  dispose() { this.group.parent.remove(this.group); }
}

// ---------- simulation state ----------
let S = 1;                 // supersaturation of the surrounding solution
const rnd = (a, b) => a + Math.random() * (b - a);

function nucleateRoot() {
  if (roots.length >= MAX_ROOTS) return;
  for (let tries = 0; tries < 20; tries++) {
    const d = new THREE.Vector3().randomDirection();
    const p = d.clone().multiplyScalar(rockR(d) - 0.05);
    if (roots.some(r => r.base.distanceToSquared(p) < 0.03)) continue;
    const c = new Crystal(scene, 0);
    c.base = p;
    c.group.position.copy(p);
    const axis = d.clone().add(new THREE.Vector3().randomDirection().multiplyScalar(0.35)).normalize();
    c.group.quaternion.setFromUnitVectors(UP, axis);
    c.neighbors = roots.filter(r => r.base.distanceToSquared(p) < 0.5).length;
    for (const r of roots) if (r.base.distanceToSquared(p) < 0.5) r.neighbors++;
    roots.push(c);
    return;
  }
}

function nucleateChild() {
  const cands = crystals.filter(c => c.depth < 2 && c.L > 0.5 && c.children < 5);
  if (!cands.length) return;
  const par = cands[(Math.random() * cands.length) | 0];
  par.children++;
  const c = new Crystal(par.group, par.depth + 1);
  const phi = rnd(0, Math.PI * 2), tilt = rnd(0.5, 1.1);
  const out = new THREE.Vector3(Math.sin(phi), 0, Math.cos(phi));
  c.group.position.copy(out).multiplyScalar(par.R * 0.85).setY(rnd(0.2, 0.95) * par.L);
  c.group.quaternion.setFromAxisAngle(UP, phi).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), tilt));
}

function reset() {
  for (const c of crystals) c.dispose();
  crystals.length = 0; roots.length = 0; S = 1;
  for (let i = 0; i < 8; i++) nucleateRoot();
}

const ui = id => document.getElementById(id);
let paused = false;
function step(dt) {
  const feed = +ui('feed').value, nuc = +ui('nuc').value;
  // solution replenishment toward saturation limit
  S += (1 - S) * (0.03 + 0.5 * feed) * dt;
  // nucleation (needs enough supersaturation)
  const nRate = nuc * 4 * Math.max(0, S - 0.25) ** 2;
  if (crystals.length < MAX_TOTAL && Math.random() < nRate * dt) {
    if (Math.random() < 0.4 && crystals.length > 6) nucleateChild();
    else nucleateRoot();
  }
  // growth
  let consumed = 0;
  for (const c of crystals) {
    const crowd = 1 / (1 + 0.12 * c.neighbors);
    const g = 0.5 * Math.max(0, S - 0.12) * c.vigor * crowd / (1 + 0.35 * c.L) * dt;
    const dR = g * 0.1 * (1 - c.R / c.maxR);
    const dL = g * 0.1 * c.aspect * (c.R < c.maxR * 0.98 ? 1 : 0.35);
    c.R += Math.max(dR, 0); c.L += dL;
    c.update();
    consumed += c.R * c.R * dL * 4 + c.R * c.L * dR * 4;
  }
  S = Math.max(0, S - consumed * 0.6);
}

// ---------- UI ----------
ui('mineral').onchange = e => setMineral(e.target.value);
ui('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause'; };
ui('reset').onclick = reset;
ui('rot').onclick = () => { controls.autoRotate = !controls.autoRotate; };
ui('speed').oninput = e => { ui('vSpeed').textContent = '×' + (+e.target.value).toFixed(1); };
ui('speed').oninput({ target: ui('speed') });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- main loop ----------
reset();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (!paused) {
    const speed = +ui('speed').value;
    const sub = Math.ceil(speed);
    for (let i = 0; i < sub; i++) step(dt * speed / sub);
  }
  ui('count').textContent = crystals.length;
  ui('vS').textContent = (S * 100).toFixed(0) + '%';
  ui('barfill').style.width = (S * 100) + '%';
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
