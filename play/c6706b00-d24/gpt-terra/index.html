<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRISM — Crystal Growth Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      :root { --ink:#e9edee; --muted:#7c8589; --panel:rgba(16,20,21,.76); --line:rgba(255,255,255,.11); --cyan:#b8f5ff; }
      *{box-sizing:border-box} body{margin:0;background:#0b0e0f;color:var(--ink);font-family:Manrope,Arial,sans-serif;overflow:hidden}
      #scene{position:fixed;inset:0} .grain{position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
      header{position:fixed;z-index:2;top:0;width:100%;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--line);background:linear-gradient(#101415aa,transparent)}
      .brand{font-size:14px;letter-spacing:.28em;font-weight:700}.brand i{display:inline-block;width:8px;height:8px;background:#d5fcff;border-radius:50%;margin-right:12px;box-shadow:0 0 13px #aaf5ff}.status{font:11px 'DM Mono';color:#aeb9bb;letter-spacing:.11em}.status span{color:#bfffe9}
      .top-actions{display:flex;gap:10px}.icon-btn,button{border:1px solid var(--line);background:#171c1e;color:#e5eeee;height:37px;padding:0 14px;border-radius:4px;font:11px 'DM Mono';letter-spacing:.08em;cursor:pointer}.icon-btn:hover,button:hover{border-color:#a9d5d9;background:#21292b}.primary{background:#dbf8f5;color:#122021;border-color:#dbf8f5;font-weight:bold}
      .side{position:fixed;z-index:2;left:38px;top:116px;width:230px}.eyebrow{font:10px 'DM Mono';letter-spacing:.15em;color:#8c999b;margin-bottom:10px}.side h1{font-size:25px;line-height:1.15;font-weight:500;margin:0 0 28px;letter-spacing:-.04em}.card{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);padding:17px;margin-bottom:12px;border-radius:5px}.control{margin:0 0 19px}.control:last-child{margin:0}.control label{display:flex;justify-content:space-between;font:10px 'DM Mono';letter-spacing:.1em;color:#a5afb1;margin-bottom:11px}.control b{color:#e9f8f8;font-weight:400}input[type=range]{width:100%;height:3px;appearance:none;background:#3b4445;outline:0}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border:2px solid #c7faff;border-radius:50%;background:#152122;box-shadow:0 0 8px #8be8ef}
      .swatches{display:flex;gap:8px}.swatch{width:24px;height:24px;border:1px solid #ffffff24;border-radius:50%;cursor:pointer}.swatch.active{outline:2px solid #e9ffff;outline-offset:3px}.hint{font-size:11px;line-height:1.65;color:#879194;padding-left:2px}
      .readout{position:fixed;z-index:2;right:39px;bottom:37px;width:220px}.meter{font:11px 'DM Mono';letter-spacing:.12em;display:flex;justify-content:space-between;margin-bottom:12px}.meter span{color:#95f1ee}.progress{height:2px;background:#354143}.progress i{height:100%;width:0;background:#bcffff;display:block;box-shadow:0 0 10px #bfffff}.legend{display:flex;gap:17px;margin-top:17px;font:9px 'DM Mono';color:#899597;letter-spacing:.08em}.legend em{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;background:#c5ffff}.legend em:nth-child(2){background:#9b86ff}.legend em:nth-child(3){background:#ffd89c}
      .center-note{position:fixed;z-index:1;bottom:37px;left:50%;transform:translateX(-50%);font:10px 'DM Mono';letter-spacing:.13em;color:#778285;text-align:center}.center-note kbd{border:1px solid #ffffff2b;padding:3px 5px;border-radius:2px;color:#a9b5b6;margin:0 3px}
      #tooltip{position:fixed;z-index:3;display:none;background:#eaffff;color:#172123;padding:6px 9px;border-radius:3px;font:10px 'DM Mono'}
      @media(max-width:700px){header{padding:0 18px}.side{left:18px;top:94px;width:205px}.readout{right:18px;bottom:18px}.center-note{display:none}.status{display:none}}
    </style>
  </head>
  <body>
    <div id="scene"></div><div class="grain"></div><div id="tooltip"></div>
    <header><div class="brand"><i></i>PRISM / GROWTH LAB</div><div class="status">SYSTEM <span>● LIVE</span> &nbsp; 14.7°C</div><div class="top-actions"><button class="icon-btn" id="reset">↺ RESET</button><button class="primary" id="export">CAPTURE</button></div></header>
    <aside class="side"><div class="eyebrow">SYNTHETIC MINERALOGY</div><h1>Grow a crystal<br>from first principles.</h1><div class="card">
      <div class="control"><label>GROWTH RATE <b id="rateVal">0.68×</b></label><input id="rate" type="range" min="0" max="100" value="68"></div>
      <div class="control"><label>SUPERSATURATION <b id="satVal">72%</b></label><input id="sat" type="range" min="20" max="100" value="72"></div>
      <div class="control"><label>CRYSTAL HUE</label><div class="swatches"><div class="swatch active" data-color="#a6f6ff" style="background:#a6f6ff"></div><div class="swatch" data-color="#b6a2ff" style="background:#b6a2ff"></div><div class="swatch" data-color="#ffc7d9" style="background:#ffc7d9"></div><div class="swatch" data-color="#ffd190" style="background:#ffd190"></div></div></div>
    </div><div class="hint">Drag the scene to orbit.<br>Scroll to move through the specimen.</div></aside>
    <div class="center-note"><kbd>DRAG</kbd> ORBIT &nbsp; <kbd>SCROLL</kbd> ZOOM &nbsp; <kbd>SPACE</kbd> PAUSE</div>
    <section class="readout"><div class="meter"><span>FORMATION</span><b id="percent">00.0%</b></div><div class="progress"><i id="bar"></i></div><div class="legend"><span><em></em>NUCLEI</span><span><em></em>FACETS</span><span><em></em>SOLUTION</span></div></section>
    <script>
      const host=document.querySelector('#scene'), renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;host.appendChild(renderer.domElement);
      const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x080c0d,.055);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1.6,7.4);
      const hemi=new THREE.HemisphereLight(0xbef8ff,0x071113,1.8);scene.add(hemi);const key=new THREE.DirectionalLight(0xd7fbff,2.6);key.position.set(-4,5,5);scene.add(key);const rim=new THREE.PointLight(0x78c4ff,3,11);rim.position.set(3,2,-3);scene.add(rim);
      const root=new THREE.Group();scene.add(root);const crystal=new THREE.Group();root.add(crystal);const particles=new THREE.Group();scene.add(particles);
      const floor=new THREE.Mesh(new THREE.CircleGeometry(4.7,80),new THREE.MeshBasicMaterial({color:0x091112,transparent:true,opacity:.6}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.65;scene.add(floor);
      let hue='#a6f6ff', growth=0, running=true, rate=.68, saturation=.72, drag=false, px=0,py=0, az=.25,el=.18,dist=7.4;
      const parts=[];for(let i=0;i<180;i++){let a=Math.random()*Math.PI*2,r=.6+Math.random()*3.2;let p=new THREE.Mesh(new THREE.SphereGeometry(.012+Math.random()*.024,5,5),new THREE.MeshBasicMaterial({color:0x94dfe5,transparent:true,opacity:.18+Math.random()*.48}));p.position.set(Math.cos(a)*r,(Math.random()-.55)*3,Math.sin(a)*r);p.userData={a,r,s:Math.random()*2+1,phase:Math.random()*6.28};particles.add(p);parts.push(p)}
      function makeCrystal(){while(crystal.children.length)crystal.remove(crystal.children[0]); const color=new THREE.Color(hue); const mat=new THREE.MeshPhysicalMaterial({color,metalness:.04,roughness:.13,transmission:.18,thickness:1.2,transparent:true,opacity:.88,side:THREE.DoubleSide,envMapIntensity:1.4}); const core=new THREE.Mesh(new THREE.OctahedronGeometry(1.05,1),mat);core.scale.set(.8,1.35,.8);crystal.add(core); for(let i=0;i<16;i++){let angle=i/16*Math.PI*2+(i%2)*.17, h=.45+Math.random()*.8; let shard=new THREE.Mesh(new THREE.ConeGeometry(.12+Math.random()*.14,h,5),mat);shard.position.set(Math.cos(angle)*(.5+Math.random()*.28),-.15+Math.random()*.7,Math.sin(angle)*(.5+Math.random()*.28));shard.rotation.set((Math.random()-.5)*.5, -angle, (Math.random()-.5)*.4);shard.userData.base=1;crystal.add(shard)} const glow=new THREE.PointLight(color,2.2,4);glow.position.y=.2;crystal.add(glow)}makeCrystal();
      function updateCam(){camera.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+0.1,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,0,0)}
      addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-px)*.008;el=Math.max(-.55,Math.min(.75,el+(e.clientY-py)*.008));px=e.clientX;py=e.clientY});addEventListener('wheel',e=>{dist=Math.max(3.4,Math.min(11,dist+e.deltaY*.006))},{passive:true});
      const rateInput=document.querySelector('#rate'),satInput=document.querySelector('#sat');rateInput.oninput=()=>{rate=rateInput.value/100;document.querySelector('#rateVal').textContent=rate.toFixed(2)+'×'};satInput.oninput=()=>{saturation=satInput.value/100;document.querySelector('#satVal').textContent=satInput.value+'%'};
      document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>{document.querySelector('.swatch.active').classList.remove('active');s.classList.add('active');hue=s.dataset.color;makeCrystal()});document.querySelector('#reset').onclick=()=>growth=0;document.querySelector('#export').onclick=()=>{renderer.render(scene,camera);let a=document.createElement('a');a.download='prism-crystal.png';a.href=renderer.domElement.toDataURL();a.click()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();running=!running}});
      let last=performance.now();function animate(t){requestAnimationFrame(animate);let dt=Math.min(.05,(t-last)/1000);last=t;if(running)growth=Math.min(1,growth+dt*.045*rate*(.4+saturation));let scale=.04+growth*.96;crystal.scale.setScalar(scale);crystal.rotation.y=t*.00016;parts.forEach((p,i)=>{let q=t*.001*p.userData.s+p.userData.phase;p.position.y+=Math.sin(q)*.002; p.material.opacity=.13+Math.min(1,growth*2)*.42});root.rotation.z=Math.sin(t*.0003)*.035;updateCam();let pc=(growth*100).toFixed(1);document.querySelector('#percent').textContent=pc+'%';document.querySelector('#bar').style.width=pc+'%';renderer.render(scene,camera)}animate(performance.now());
      addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    </script>
  </body>
</html>
