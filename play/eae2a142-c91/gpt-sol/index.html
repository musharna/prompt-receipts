<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dff7f3" />
    <title>Mochi — Desktop Axolotl</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="mochi-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="desktop" id="desktop">
      <div class="sky-glow glow-one"></div>
      <div class="sky-glow glow-two"></div>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M12 9C7 9 5 13 6 17c-2 1-3 3-2 5l5-2c2 3 5 4 8 4 6 0 10-3 10-8s-4-8-10-8c-2 0-4 0-5 1Z"/><circle cx="20.5" cy="14" r="1.5"/></svg>
          </span>
          <span>Mochi</span>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="soundButton" aria-label="Toggle sound" title="Toggle sound">
            <svg class="sound-on" viewBox="0 0 24 24"><path d="M11 5 6.8 8.5H3.5v7h3.3L11 19V5Zm4 3.5c1 .8 1.5 2 1.5 3.5S16 14.7 15 15.5M17.8 5.7a8.5 8.5 0 0 1 0 12.6"/></svg>
            <svg class="sound-off" viewBox="0 0 24 24"><path d="M11 5 6.8 8.5H3.5v7h3.3L11 19V5Zm4 4 5 5m0-5-5 5"/></svg>
          </button>
          <button class="icon-button" id="settingsButton" aria-label="Open settings" aria-expanded="false" title="Settings">
            <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19 13.5 1.4 1.1-2 3.5-1.8-.7c-.6.5-1.2.9-2 1.1l-.3 2h-4l-.3-2a7 7 0 0 1-2-1.1l-1.8.7-2-3.5 1.4-1.1a7 7 0 0 1 0-2.3l-1.4-1.1 2-3.5 1.8.7c.6-.5 1.2-.9 2-1.1l.3-2h4l.3 2a7 7 0 0 1 2 1.1l1.8-.7 2 3.5-1.4 1.1c.1.8.1 1.6 0 2.3Z"/></svg>
          </button>
        </div>
      </header>

      <section class="welcome-card" aria-labelledby="greeting">
        <div class="eyebrow"><span class="online-dot"></span> Your desktop buddy is active</div>
        <h1 id="greeting">Good afternoon! <span>♡</span></h1>
        <p>Mochi is exploring your taskbar.<br />Move your mouse to say hello!</p>
        <div class="mood-row">
          <div class="mood-face">●ᴗ●</div>
          <div>
            <span>Current mood</span>
            <strong id="moodText">Feeling curious</strong>
          </div>
        </div>
      </section>

      <section class="status-pill" id="statusPill" aria-live="polite">
        <span class="status-icon" id="statusIcon">✦</span>
        <span id="statusText">Mochi is out for a stroll</span>
      </section>

      <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
        <div class="panel-head">
          <div><small>MOCHI'S SPACE</small><h2>Pet settings</h2></div>
          <button class="close-button" id="closeSettings" aria-label="Close settings">×</button>
        </div>
        <label>
          <span>Nap after <b id="idleValue">12 seconds</b></span>
          <input id="idleRange" type="range" min="5" max="30" value="12" />
        </label>
        <label class="switch-row">
          <span><b>Follow my pointer</b><small>Mochi will wander nearby</small></span>
          <input id="followToggle" type="checkbox" checked /><i></i>
        </label>
        <button class="wake-button" id="wakeButton">Call Mochi over</button>
      </aside>

      <div class="plant plant-left" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <div class="plant plant-right" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
      <div class="pebbles left-pebbles" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="pebbles right-pebbles" aria-hidden="true"><i></i><i></i></div>

      <div class="pet-wrap" id="petWrap" aria-label="Mochi the axolotl" role="img">
        <div class="thought" id="thought">oh! hello ♡</div>
        <div class="zzz"><i>Z</i><i>z</i><i>z</i></div>
        <div class="pet-shadow"></div>
        <svg class="axolotl" viewBox="0 0 240 150" aria-hidden="true">
          <defs>
            <linearGradient id="bodyPaint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc2bd"/><stop offset="1" stop-color="#f2919c"/></linearGradient>
            <linearGradient id="bellyPaint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe5d9"/><stop offset="1" stop-color="#ffc4bd"/></linearGradient>
          </defs>
          <g class="tail">
            <path d="M145 99c31 8 55 1 68-14 10-12 6-25-3-24-8 1-5 14-18 17-17 4-33-9-48-9Z" fill="url(#bodyPaint)" stroke="#bd6477" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M164 84c19 3 34 0 42-9" fill="none" stroke="#ffd7cf" stroke-width="4" stroke-linecap="round" opacity=".85"/>
          </g>
          <g class="back-legs" fill="url(#bodyPaint)" stroke="#bd6477" stroke-width="3.5" stroke-linecap="round">
            <path d="M135 99c9 10 17 20 25 18 5-1 4-6 0-8 7 3 10-3 5-6 5 0 6-5 1-7-8-4-14-7-18-14Z"/>
            <path d="M96 104c1 14 4 25 13 27 5 1 7-4 3-7 6 5 11 1 7-4 5 2 8-3 3-6-6-5-9-12-10-20Z"/>
          </g>
          <path class="body" d="M74 62c21-17 58-13 77 7 17 19 8 44-20 48-26 3-51-7-62-25-7-11-5-22 5-30Z" fill="url(#bodyPaint)" stroke="#bd6477" stroke-width="4"/>
          <path d="M93 74c18-9 44-3 51 13 5 12-4 20-21 21-19 1-38-7-42-19-2-7 3-12 12-15Z" fill="url(#bellyPaint)" opacity=".9"/>
          <g class="front-legs" fill="url(#bodyPaint)" stroke="#bd6477" stroke-width="3.5" stroke-linecap="round">
            <path d="M80 94c-8 8-15 20-9 25 3 3 7 0 7-4 1 7 7 7 8 1 2 5 8 3 7-2-1-7 0-13 4-19Z"/>
            <path d="M130 101c5 12 12 21 20 19 5-1 4-6 0-8 6 4 10-1 6-5 5 1 7-4 2-7-7-4-10-9-12-16Z"/>
          </g>
          <g class="gills" fill="#e87088" stroke="#ad526a" stroke-width="3.5" stroke-linecap="round">
            <path d="M67 62C52 47 49 34 55 31c5-2 8 12 14 20-3-15 1-26 7-24 5 1 2 15 2 25 6-13 15-19 19-14 4 5-9 16-13 26Z"/>
            <path d="M57 75c-17 2-28-3-27-9 1-5 14-1 23 0-12-8-16-18-11-21 5-2 11 11 17 18Z"/>
          </g>
          <g class="head">
            <path d="M41 60c9-15 32-18 46-7 13 10 17 32 7 46-11 16-40 16-53 2-10-11-9-28 0-41Z" fill="url(#bodyPaint)" stroke="#bd6477" stroke-width="4"/>
            <ellipse class="eye eye-left" cx="52" cy="74" rx="4.5" ry="5.5" fill="#42323e"/>
            <ellipse class="eye eye-right" cx="80" cy="73" rx="4.5" ry="5.5" fill="#42323e"/>
            <circle cx="50.5" cy="72" r="1.3" fill="white"/><circle cx="78.5" cy="71" r="1.3" fill="white"/>
            <path class="mouth" d="M58 88c5 4 11 4 16-1" fill="none" stroke="#9e5061" stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="46" cy="86" rx="7" ry="4" fill="#ef8290" opacity=".55"/><ellipse cx="84" cy="85" rx="7" ry="4" fill="#ef8290" opacity=".55"/>
          </g>
        </svg>
      </div>

      <footer class="taskbar" id="taskbar">
        <button class="start-button" aria-label="Menu"><span></span><span></span><span></span><span></span></button>
        <div class="search-box"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg><span>Search</span></div>
        <div class="task-icons">
          <button aria-label="Folder"><svg viewBox="0 0 24 24"><path d="M3.5 7h6l2-2h9v14h-17Z"/></svg></button>
          <button class="active" aria-label="Mochi"><span class="mini-mochi">•ᴗ•</span></button>
          <button aria-label="Browser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M4 12h16M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></svg></button>
        </div>
        <div class="tray"><span>⌃</span><span>◔</span><span class="clock" id="clock">2:34<br><small>10/7/2026</small></span></div>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
