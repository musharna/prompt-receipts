<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0c14; overflow-x: hidden; }
  #fog {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: -1; pointer-events: none; display: block;
  }
  main {
    position: relative; min-height: 100%; box-sizing: border-box;
    padding: 18vh 8vw; color: #ece9f4; font-family: system-ui, sans-serif;
  }
  h1 { font-weight: 300; font-size: clamp(2.5rem, 7vw, 5rem); margin: 0 0 0.3em; }
  p { max-width: 36ch; line-height: 1.6; opacity: 0.85; }
</style>
</head>
<body>
<canvas id="fog" aria-hidden="true"></canvas>
<main>
  <h1>Your Name</h1>
  <p>Designer and developer. Replace this with your portfolio content.</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('fog');
  const ctx = canvas.getContext('2d');

  const FONT_PX = 14;
  const FEATURE_PX = 260;
  const SPEED = 1;
  const FRAME_MS = 1000 / 30;
  const RAMP = ' .:-~=+*o';
  const STOPS = [
    [12, 14, 28],
    [40, 62, 102],
    [66, 124, 140],
    [184, 162, 204],
    [238, 232, 244]
  ];

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  const hash = (x, y) => {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  };

  const smooth = t => t * t * (3 - 2 * t);

  const valueNoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = smooth(x - xi), v = smooth(y - yi);
    const a = hash(xi, yi), b = hash(xi + 1, yi);
    const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };

  const fbm = (x, y) => {
    let sum = 0, amp = 0.5, freq = 1;
    for (let i = 0; i < 4; i++) {
      sum += amp * valueNoise(x * freq, y * freq);
      freq *= 2.03;
      amp *= 0.5;
    }
    return sum / 0.9375;
  };

  const density = (x, y, t) => {
    const qx = fbm(x + t * 0.05, y - t * 0.02);
    const qy = fbm(x + 5.2 - t * 0.03, y + 1.3 + t * 0.04);
    return fbm(x + 3 * qx + t * 0.04, y + 3 * qy - t * 0.015);
  };

  const palette = u => {
    const f = clamp(u, 0, 0.999) * (STOPS.length - 1);
    const i = Math.floor(f), k = f - i;
    const a = STOPS[i], b = STOPS[i + 1];
    return [
      a[0] + (b[0] - a[0]) * k,
      a[1] + (b[1] - a[1]) * k,
      a[2] + (b[2] - a[2]) * k
    ];
  };

  let cw = 8, cellH = FONT_PX, cols = 0, rows = 0;
  let t0 = performance.now(), lastFrame = 0;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `${FONT_PX}px ui-monospace, Menlo, Consolas, monospace`;
    ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width;
    cols = Math.ceil(innerWidth / cw) + 1;
    rows = Math.ceil(innerHeight / cellH) + 1;
  };

  const draw = seconds => {
    const t = seconds * SPEED;
    ctx.fillStyle = '#0a0c14';
    ctx.fillRect(0, 0, innerWidth, innerHeight);
    for (let r = 0; r < rows; r++) {
      const py = r * cellH / FEATURE_PX;
      for (let c = 0; c < cols; c++) {
        const n = density(c * cw / FEATURE_PX, py, t);
        const d = clamp((n - 0.32) / 0.4, 0, 1);
        if (d < 0.05) continue;
        const glyph = RAMP[Math.min(RAMP.length - 1, Math.floor(d * RAMP.length))];
        const [R, G, B] = palette(d * 0.9 + 0.05 * Math.sin(t * 0.1 + r * 0.02));
        ctx.fillStyle = `rgba(${R | 0},${G | 0},${B | 0},${(0.2 + 0.8 * d).toFixed(3)})`;
        ctx.fillText(glyph, c * cw, r * cellH);
      }
    }
  };

  const loop = now => {
    if (now - lastFrame >= FRAME_MS) {
      lastFrame = now;
      draw((now - t0) / 1000);
    }
    requestAnimationFrame(loop);
  };

  window.addEventListener('resize', () => {
    resize();
    if (reduceMotion) draw(0);
  });

  resize();
  if (reduceMotion) {
    draw(0);
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
