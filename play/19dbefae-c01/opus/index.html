<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Streams on Dark Water</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #071a2b 0%, #030a14 55%, #010307 100%);
  }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 14px; left: 0; right: 0;
    text-align: center;
    font: 12px/1 Georgia, serif; letter-spacing: 0.2em;
    color: rgba(160, 210, 230, 0.25);
    pointer-events: none;
    transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move to disturb the water · click to scatter</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  const COUNT = Math.min(1400, Math.floor(innerWidth * innerHeight / 900));
  const VIEW = 38, SEP = 14, MAX_SPEED = 3.2, MIN_SPEED = 1.6, MAX_FORCE = 0.06;
  const CELL = VIEW;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // Fish: each carries its own hue offset so the school shimmers instead of looking uniform.
  const fish = [];
  for (let i = 0; i < COUNT; i++) {
    const a = Math.random() * Math.PI * 2;
    fish.push({
      x: Math.random() * W, y: Math.random() * H,
      px: 0, py: 0,
      vx: Math.cos(a) * 2, vy: Math.sin(a) * 2,
      hue: Math.random() * 40 - 20,
      w: 0.6 + Math.random() * 1.1,
    });
  }
  for (const f of fish) { f.px = f.x; f.py = f.y; }

  // Spatial hash so neighbour lookups stay cheap with a large school.
  let grid = new Map();
  function buildGrid() {
    grid.clear();
    for (const f of fish) {
      const k = ((f.x / CELL) | 0) + ',' + ((f.y / CELL) | 0);
      let b = grid.get(k);
      if (!b) grid.set(k, b = []);
      b.push(f);
    }
  }

  // Slow underwater current: a drifting curl-ish field that bends the streams.
  function current(x, y, t) {
    const s = 0.0016;
    const a = Math.sin(x * s + t * 0.00013) * 2.1 + Math.cos(y * s * 1.3 - t * 0.0001) * 1.7
            + Math.sin((x + y) * s * 0.6 + t * 0.00007);
    return [Math.cos(a) * 0.035, Math.sin(a) * 0.035];
  }

  const mouse = { x: -1e4, y: -1e4, active: false, burst: 0 };
  const hint = document.getElementById('hint');
  addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    hint.style.opacity = 0;
  });
  addEventListener('pointerleave', () => { mouse.active = false; });
  addEventListener('pointerdown', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.burst = 1;
    hint.style.opacity = 0;
  });

  function limit(f, max) {
    const m = Math.hypot(f.vx, f.vy);
    if (m > max) { f.vx = f.vx / m * max; f.vy = f.vy / m * max; }
    return m;
  }

  function step(t) {
    buildGrid();
    for (const f of fish) {
      let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0;
      const gx = (f.x / CELL) | 0, gy = (f.y / CELL) | 0;
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        const b = grid.get((gx + i) + ',' + (gy + j));
        if (!b) continue;
        for (const o of b) {
          if (o === f) continue;
          const dx = o.x - f.x, dy = o.y - f.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > VIEW * VIEW) continue;
          ax += o.vx; ay += o.vy;
          cx += o.x; cy += o.y;
          if (d2 < SEP * SEP && d2 > 0) { sx -= dx / d2; sy -= dy / d2; }
          n++;
        }
      }

      let fx = 0, fy = 0;
      if (n) {
        // alignment
        fx += (ax / n - f.vx) * 0.05;
        fy += (ay / n - f.vy) * 0.05;
        // cohesion
        fx += (cx / n - f.x) * 0.0009;
        fy += (cy / n - f.y) * 0.0009;
        // separation
        fx += sx * 1.4;
        fy += sy * 1.4;
      }

      const [ux, uy] = current(f.x, f.y, t);
      fx += ux; fy += uy;

      // Predator / disturbance
      if (mouse.active || mouse.burst > 0) {
        const dx = f.x - mouse.x, dy = f.y - mouse.y;
        const d = Math.hypot(dx, dy) || 1;
        const r = 110 + mouse.burst * 260;
        if (d < r) {
          const k = (1 - d / r) * (0.5 + mouse.burst * 2.5);
          fx += dx / d * k; fy += dy / d * k;
        }
      }

      const fm = Math.hypot(fx, fy);
      const maxF = MAX_FORCE + mouse.burst * 0.6 + (mouse.active ? 0.15 : 0);
      if (fm > maxF) { fx = fx / fm * maxF; fy = fy / fm * maxF; }

      f.vx += fx; f.vy += fy;
      const sp = limit(f, MAX_SPEED + mouse.burst * 3);
      if (sp < MIN_SPEED) { f.vx = f.vx / sp * MIN_SPEED; f.vy = f.vy / sp * MIN_SPEED; }

      f.px = f.x; f.py = f.y;
      f.x += f.vx; f.y += f.vy;

      // Wrap at edges; reset previous position so no streak crosses the screen.
      let wrapped = false;
      if (f.x < -10) { f.x += W + 20; wrapped = true; }
      else if (f.x > W + 10) { f.x -= W + 20; wrapped = true; }
      if (f.y < -10) { f.y += H + 20; wrapped = true; }
      else if (f.y > H + 10) { f.y -= H + 20; wrapped = true; }
      if (wrapped) { f.px = f.x; f.py = f.y; }
    }
    mouse.burst *= 0.94;
    if (mouse.burst < 0.01) mouse.burst = 0;
  }

  function draw(t) {
    // Fade the previous frame toward transparent so the CSS water shows through
    // and every fish leaves a luminous wake.
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.075)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    const baseHue = 185 + Math.sin(t * 0.00005) * 25; // drifts between cyan and sea-green
    for (const f of fish) {
      const sp = Math.hypot(f.vx, f.vy);
      const heat = Math.min(1, (sp - MIN_SPEED) / (MAX_SPEED * 2));
      const hue = baseHue + f.hue - heat * 150; // fast fish flare toward gold
      const light = 55 + heat * 25;
      ctx.strokeStyle = `hsla(${hue}, 90%, ${light}%, 0.55)`;
      ctx.lineWidth = f.w;
      ctx.beginPath();
      ctx.moveTo(f.px - f.vx * 1.5, f.py - f.vy * 1.5);
      ctx.lineTo(f.x, f.y);
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(t) {
    step(t);
    draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
