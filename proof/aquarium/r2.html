<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; background: #14121c; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font: 12px monospace; color: #6d6a80; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
    box-shadow: 0 0 0 6px #2b2838, 0 0 0 10px #1c1a26, 0 20px 40px rgba(0,0,0,.6);
  }
  .bar { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
  p { margin: 0; letter-spacing: 1px; }
  button {
    font: bold 13px monospace; letter-spacing: 1px; text-transform: uppercase;
    color: #2a1606; background: #f2a33a; border: 0; padding: 7px 14px; cursor: pointer;
    box-shadow: inset -3px -3px 0 #b8691e, inset 3px 3px 0 #ffd27a, 0 0 0 3px #2a1606;
  }
  button:active { box-shadow: inset 3px 3px 0 #b8691e, inset -3px -3px 0 #ffd27a, 0 0 0 3px #2a1606; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="feed">Feed</button>
  <p>click the water to drop a pellet &middot; click the pufferfish to spook it</p>
</div>
<script>
// SURF is the waterline; the strip above it is sky
const W = 192, H = 120, SURF = 12, SAND = 100;
const DAY_LENGTH = 60; // seconds for a full day + night
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

function resize() {
  const s = Math.max(1, Math.floor(Math.min((innerWidth - 40) / W, (innerHeight - 110) / H)));
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', resize);
resize();

// deterministic RNG so the background looks the same every load
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(1337);
const rand = (a, b) => a + Math.random() * (b - a);

const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

// ---------- static background ----------
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
const sandTop = new Array(W);
(function buildBackground() {
  const g = bg.getContext('2d');
  const px = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };

  // water: banded gradient with ordered dithering between bands
  const water = ['#4fb6e0', '#3a9fd0', '#2c86bd', '#226ea6', '#1a588e', '#144575', '#0f355e'];
  for (let y = SURF; y < H; y++) {
    const v = Math.min(1, (y - SURF) / (SAND - SURF)) * (water.length - 1);
    const i = Math.floor(v), f = v - i;
    for (let x = 0; x < W; x++) {
      const k = (BAYER[y & 3][x & 3] + 0.5) / 16 < f ? Math.min(i + 1, water.length - 1) : i;
      px(x, y, water[k]);
    }
  }

  // distant background rocks silhouette
  for (let x = 0; x < W; x++) {
    const h = Math.round(6 + Math.sin(x * 0.05) * 3 + Math.sin(x * 0.13 + 2) * 2);
    for (let y = SAND - h; y < SAND + 2; y++) px(x, y, (BAYER[y & 3][x & 3] < 8) ? '#123d68' : '#134270');
  }

  // sand
  const sand = ['#f1dca4', '#e3c98d', '#d4b779', '#c2a265', '#ad8d55'];
  for (let x = 0; x < W; x++) {
    sandTop[x] = Math.round(SAND + Math.sin(x * 0.07) * 2 + Math.sin(x * 0.19 + 1) * 1.2);
    for (let y = sandTop[x]; y < H; y++) {
      const d = y - sandTop[x];
      let k = Math.min(sand.length - 1, Math.floor(d / 4.5) + 1);
      if (d === 0) k = 0;
      const r = rnd();
      if (r < 0.12) k = Math.max(0, k - 1);
      else if (r > 0.9) k = Math.min(sand.length - 1, k + 1);
      px(x, y, sand[k]);
    }
  }
  // pebbles
  const peb = ['#8c7a6b', '#a3958a', '#6f6258', '#c7b7a3', '#9b6b4f'];
  for (let i = 0; i < 70; i++) {
    const x = Math.floor(rnd() * W);
    const y = sandTop[x] + 1 + Math.floor(rnd() * (H - sandTop[x] - 2));
    px(x, y, peb[Math.floor(rnd() * peb.length)]);
    if (rnd() < 0.4) px(x + 1, y, peb[Math.floor(rnd() * peb.length)]);
  }

  // rocks, shaded from the top-left
  function rock(cx, rx, ry, pal) {
    const cy = sandTop[cx] + 2;
    for (let y = -ry; y <= 1; y++) for (let x = -rx; x <= rx; x++) {
      const e = (x * x) / (rx * rx) + (y * y) / (ry * ry);
      if (e > 1) continue;
      const lit = (-x / rx - y / ry) * 0.6 + (1 - e) * 0.5 + (rnd() - 0.5) * 0.25;
      let k = lit > 0.65 ? 0 : lit > 0.3 ? 1 : lit > -0.1 ? 2 : 3;
      if (e > 0.82) k = 3;
      px(cx + x, cy + y, pal[k]);
    }
  }
  rock(28, 13, 9, ['#a8a2b4', '#837d93', '#625d74', '#433f55']);
  rock(41, 7, 5, ['#9a9aa8', '#76768a', '#56566c', '#3b3b50']);
  rock(150, 10, 12, ['#b3a08e', '#8e7b6b', '#6b5a4e', '#4a3d36']);
  rock(163, 6, 4, ['#a8a2b4', '#837d93', '#625d74', '#433f55']);
  rock(100, 5, 3, ['#9a9aa8', '#76768a', '#56566c', '#3b3b50']);

  // a few gold coins spilled in front of the treasure chest
  for (const [x, c] of [[170, '#e8c547'], [171, '#fff2a0'], [168, '#e8c547'], [186, '#e8c547'], [174, '#c9a032']]) {
    px(x, sandTop[x] + 1, c);
  }
})();

// treasure chest in the bottom-right corner; drawn every frame because the lid opens
const CHEST = { x: 172, w: 14, open: 0, target: 0, timer: 3, bubbleT: 0 };
CHEST.bottom = Math.min(...sandTop.slice(CHEST.x, CHEST.x + CHEST.w)) + 2;

// ---------- plants ----------
const plants = [];
function addKelp(x, h, col, front) {
  plants.push({ type: 'kelp', x, h, col, front, phase: rnd() * 6, amp: 2 + rnd() * 2.5 });
}
function addGrass(x, n, col, front) {
  const blades = [];
  for (let i = 0; i < n; i++) blades.push({ dx: i * 2 - n, h: 5 + Math.floor(rnd() * 9), phase: rnd() * 6 });
  plants.push({ type: 'grass', x, blades, col, front });
}
const GREEN = ['#2f8f3a', '#45b04a', '#7ad65a'];
const DARKGREEN = ['#1f6b3a', '#2d8a46', '#4fb35a'];
const RED = ['#9a2f3f', '#c4445a', '#e87a86'];
addKelp(10, 58, DARKGREEN, false);
addKelp(15, 44, DARKGREEN, false);
addKelp(62, 50, DARKGREEN, false);
addKelp(135, 64, DARKGREEN, false);
addKelp(190, 52, DARKGREEN, false);
addKelp(20, 38, GREEN, true);
addKelp(70, 30, GREEN, true);
addKelp(166, 36, GREEN, true);
addKelp(88, 26, RED, false);
addKelp(92, 20, RED, true);
addGrass(50, 5, GREEN, true);
addGrass(108, 4, GREEN, true);
addGrass(122, 3, GREEN, true);
addGrass(140, 6, GREEN, true);
addGrass(78, 4, DARKGREEN, false);

function drawPlant(p, t) {
  if (p.type === 'kelp') {
    const base = sandTop[p.x] + 1;
    for (let i = 0; i < p.h; i++) {
      const k = i / p.h;
      const sway = Math.sin(t * 1.1 + p.phase - i * 0.11) * Math.pow(k, 1.3) * p.amp;
      const x = Math.round(p.x + sway), y = base - i;
      ctx.fillStyle = (i % 6 < 3) ? p.col[0] : p.col[1];
      ctx.fillRect(x, y, 2, 1);
      ctx.fillStyle = p.col[2];
      ctx.fillRect(x, y, 1, 1);
      if (i % 7 === 4 && i < p.h - 3) {
        const side = (Math.floor(i / 7) % 2) ? 2 : -2;
        ctx.fillStyle = p.col[1];
        ctx.fillRect(x + (side > 0 ? 2 : -2), y, 2, 1);
        ctx.fillRect(x + (side > 0 ? 3 : -2), y - 1, 1, 1);
      }
    }
  } else {
    for (const b of p.blades) {
      const bx = p.x + b.dx, base = sandTop[Math.max(0, Math.min(W - 1, bx))] + 1;
      for (let i = 0; i < b.h; i++) {
        const sway = Math.sin(t * 1.6 + b.phase) * (i / b.h) * (i / b.h) * 2;
        ctx.fillStyle = i < 2 ? p.col[0] : i > b.h - 3 ? p.col[2] : p.col[1];
        ctx.fillRect(Math.round(bx + sway), base - i, 1, 1);
      }
    }
  }
}

// ---------- fish ----------
// sprites face right; '.' is transparent
const SPECIES = [
  {
    name: 'clown', speed: 14, tail: 't', tailW: 2,
    pal: { o: '#f47a20', w: '#fbf6ee', k: '#1a1418', t: '#e0601a', f: '#1a1418' },
    rows: [
      '....ff...',
      't.owoow..',
      'ttowoowko',
      't.owoowo.',
      '....ff...',
    ],
  },
  {
    name: 'puffer', speed: 8, tail: 't', tailW: 2,
    pal: { y: '#d9b44a', s: '#7a5a22', l: '#f4ead0', o: '#9a7a30', k: '#111', w: '#fff', t: '#c9a03c', f: '#c9a03c', p: '#f4ead0' },
    rows: [
      '...ysyys...',
      't.yyyyyyyy.',
      'ttysyyyywk.',
      'ttyyyysyyyy',
      'tt.lllllllo',
      't..lllllll.',
      '....f.f....',
    ],
  },
  // the eel has no sprite; it's drawn segment by segment along its own trail
  { name: 'eel', speed: 12, w: 5, h: 5, len: 30 },
  {
    name: 'tetra', speed: 22, tail: 't', tailW: 2,
    pal: { s: '#9fb7c8', b: '#29c6ff', r: '#e2324a', k: '#111', t: '#c9d8e4' },
    rows: [
      '...sss...',
      't.ssssk..',
      'ttbbbbbbb',
      't.rrrrrr.',
      '....r....',
    ],
  },
  {
    name: 'angel', speed: 9, tail: 't', tailW: 2,
    pal: { f: '#e8e2b0', y: '#f2e98a', d: '#3a3324', k: '#111', t: '#e8e2b0' },
    rows: [
      '....f.....',
      '...fd.....',
      '..fydy....',
      't.yydyyy..',
      'ttyydyyky.',
      'tyyydyyyyy',
      'ttyydyyyy.',
      't.yydyyy..',
      '..fydy....',
      '...fd.....',
      '....f.....',
    ],
  },
  {
    name: 'tang', speed: 16, tail: 'y', tailW: 3,
    pal: { b: '#2f5fe8', d: '#101a4a', l: '#6f9bff', k: '#fff', y: '#ffd630' },
    rows: [
      '....bbbb....',
      'y..bbbbbbb..',
      'yy.bdddddbk.',
      'yyybbbbbbbbb',
      'yy.bbllllbb.',
      'y...bbbbbb..',
      '.....b......',
    ],
  },
  {
    name: 'gold', speed: 11, tail: 't', tailW: 4,
    pal: { o: '#ff9a1f', l: '#ffd27a', k: '#1a1010', t: '#ffb84a', f: '#ffb84a' },
    rows: [
      '......ff....',
      'tt...ooooo..',
      'ttt.ooooooko',
      '.tttoooooooo',
      'ttt.ooolllo.',
      'tt...oolll..',
      '......f.....',
    ],
  },
];

function buildSprites(sp) {
  const h = sp.rows.length, w = Math.max(...sp.rows.map(r => r.length)), mid = (h - 1) / 2;
  sp.w = w; sp.h = h;
  sp.img = [];
  for (let fr = 0; fr < 2; fr++) {
    sp.img[fr] = [];
    for (const flip of [0, 1]) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      for (let y = 0; y < h; y++) for (let x = 0; x < sp.rows[y].length; x++) {
        const ch = sp.rows[y][x];
        if (ch === '.') continue;
        let yy = y;
        // second frame: pinch the tail toward the middle so it looks like it flaps
        if (fr === 1 && ch === sp.tail && x < sp.tailW) yy = y < mid ? y + 1 : y > mid ? y - 1 : y;
        g.fillStyle = sp.pal[ch];
        g.fillRect(flip ? w - 1 - x : x, yy, 1, 1);
      }
      sp.img[fr][flip] = c;
    }
  }
}
for (const sp of SPECIES) if (sp.rows) buildSprites(sp);

// round, spiky sprite for the inflated pufferfish (r = body radius)
function makePuff(sp, r) {
  const size = Math.ceil(r) * 2 + 5, c0 = (size - 1) / 2, pal = sp.pal;
  const imgs = [];
  for (const flip of [0, 1]) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const put = (x, y, col) => { g.fillStyle = col; g.fillRect(flip ? size - 1 - x : x, y, 1, 1); };
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
      if (Math.cos(a) < -0.9) continue; // leave room for the tail
      put(Math.round(c0 + Math.cos(a) * (r + 1)), Math.round(c0 + Math.sin(a) * (r + 1)), pal.p);
    }
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = x - c0, dy = y - c0, d = Math.hypot(dx, dy);
      if (d > r) continue;
      let col = dy > r * 0.15 ? pal.l : ((x * 7 + y * 13) % 5 === 0 ? pal.s : pal.y);
      if (d > r - 0.8) col = pal.o;
      put(x, y, col);
    }
    const ex = Math.round(c0 + r * 0.45), ey = Math.round(c0 - r * 0.3);
    put(ex, ey, pal.w); put(ex + 1, ey, pal.k);
    put(Math.round(c0 + r), c0 + 1, pal.k);
    for (let dy = -1; dy <= 1; dy++) put(0, c0 + dy, pal.t);
    put(1, c0, pal.t);
    imgs[flip] = c;
  }
  return imgs;
}
const PUFFER = SPECIES.find(s => s.name === 'puffer');
PUFFER.mid = makePuff(PUFFER, 4.5);
PUFFER.full = makePuff(PUFFER, 6.5);

const fish = [];
function spawnFish(sp) {
  const f = {
    sp, x: rand(20, W - 20), y: rand(SURF + 8, SAND - 20), vx: 0, vy: 0, w: sp.w, h: sp.h,
    dir: Math.random() < 0.5 ? 1 : -1, phase: rand(0, 6), speed: sp.speed * rand(0.85, 1.15),
    tx: 0, ty: 0, retarget: 0, bubbleT: rand(3, 10),
  };
  if (sp.name === 'puffer') { f.puff = 0; f.puffT = 0; }
  if (sp.name === 'eel') {
    f.wig = 0;
    f.trail = [];
    for (let i = 0; i < sp.len; i++) f.trail.push({ x: f.x - f.dir * i, y: f.y });
  }
  pickTarget(f);
  fish.push(f);
}
function pickTarget(f) {
  f.tx = rand(10, W - 10);
  f.ty = Math.max(SURF + 8, Math.min(SAND - 6 - f.h / 2, f.y + rand(-25, 25)));
  f.retarget = rand(3, 8);
}
const counts = { clown: 3, puffer: 1, eel: 1, tetra: 6, angel: 2, tang: 2, gold: 2 };
for (const sp of SPECIES) for (let i = 0; i < counts[sp.name]; i++) spawnFish(sp);

// ---------- food & bubbles ----------
const food = [];
const bubbles = [];
const pops = [];

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  // clicking the pufferfish scares it into puffing up instead of dropping food
  for (const f of fish) {
    if (f.sp !== PUFFER || Math.abs(x - f.x) > f.w / 2 + 2 || Math.abs(y - f.y) > f.h / 2 + 2) continue;
    if (f.puffT <= 0) for (let i = 0; i < 4; i++) addBubble(f.x + rand(-3, 3), f.y + rand(-3, 3), Math.random() < 0.5);
    f.puffT = 3.5;
    return;
  }
  for (let i = 0; i < 5; i++) {
    food.push({ x: x + rand(-4, 4), y: Math.max(SURF + 2, Math.min(y, SAND - 4) + rand(-2, 2)), vy: rand(5, 9), phase: rand(0, 6), life: 14 });
  }
});

// feed button: a pinch of flakes lands on the surface, floats a moment, then flutters down
const FLAKE_COLORS = ['#e85a3a', '#f2a33a', '#f5d04a', '#7cc35a'];
document.getElementById('feed').addEventListener('click', () => {
  const x0 = rand(30, W - 30);
  for (let i = 0; i < 14; i++) {
    food.push({
      flake: true, x: x0 + rand(-14, 14), y: SURF + 1, vy: rand(3, 5), phase: rand(0, 6), life: 25,
      float: rand(0.3, 1.5), col: FLAKE_COLORS[Math.floor(Math.random() * FLAKE_COLORS.length)], wide: Math.random() < 0.5,
    });
  }
});

function addBubble(x, y, big) {
  bubbles.push({ x, y, x0: x, big, vy: rand(10, 18) * (big ? 1.2 : 1), phase: rand(0, 6) });
}

// ---------- loop ----------
let last = performance.now(), t = 0;
let dayPhase = 0, night = 0; // dayPhase 0..1 through the cycle; night 0 = full day, 1 = full night

function update(dt) {
  t += dt;
  dayPhase = (t / DAY_LENGTH) % 1;
  // day at phase 0, night centred on 0.5, ~14s of dusk and dawn in between
  night = Math.max(0, Math.min(1, 0.5 - Math.cos(dayPhase * Math.PI * 2) * 1.4));

  // treasure chest: a thin trickle through the lid, then every few seconds it pops open and burps a burst
  const C = CHEST;
  C.timer -= dt;
  if (C.timer <= 0) {
    C.target = 1 - C.target;
    C.timer = C.target ? 1.6 : rand(5, 9);
  }
  C.open += Math.sign(C.target - C.open) * Math.min(Math.abs(C.target - C.open), dt * 4);
  C.bubbleT -= dt;
  if (C.bubbleT <= 0) {
    const seam = C.bottom - 7 - Math.round(C.open * 3);
    addBubble(C.x + rand(2, C.w - 2), seam, C.open > 0.6 && Math.random() < 0.6);
    C.bubbleT = C.open > 0.6 ? rand(0.03, 0.09) : rand(0.4, 1.2);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy * dt;
    b.x = b.x0 + Math.sin(t * 4 + b.phase) * 1.2;
    if (b.y < SURF + 1) { pops.push({ x: b.x, y: SURF, life: 0.25 }); bubbles.splice(i, 1); }
  }
  for (let i = pops.length - 1; i >= 0; i--) if ((pops[i].life -= dt) <= 0) pops.splice(i, 1);

  for (let i = food.length - 1; i >= 0; i--) {
    const p = food[i];
    const floor = sandTop[Math.max(0, Math.min(W - 1, Math.round(p.x)))] - 1;
    if (p.float > 0) {
      p.float -= dt;
      p.x += Math.sin(t + p.phase) * 1.5 * dt;
    } else if (p.y < floor) {
      p.y = Math.min(floor, p.y + p.vy * dt);
      p.x += Math.sin(t * (p.flake ? 2 : 3) + p.phase) * (p.flake ? 7 : 3) * dt;
    }
    p.x = Math.max(1, Math.min(W - 2, p.x));
    if ((p.life -= dt) <= 0) food.splice(i, 1);
  }

  for (const f of fish) {
    // everyone gets sleepy at night
    let speed = f.speed * (1 - 0.6 * night), chasing = null;
    if (f.sp === PUFFER) {
      if (f.puffT > 0) { f.puffT -= dt; f.puff = Math.min(1, f.puff + dt * 5); }
      else f.puff = Math.max(0, f.puff - dt * 0.8);
      const img = pufferImg(f, 0);
      f.w = img.width; f.h = img.height;
      speed *= 1 - 0.8 * f.puff;
    }
    // look for the nearest food: pellets only get noticed up close, but the whole tank
    // comes for flakes (a puffed-up puffer is too busy being round)
    let best = Infinity;
    if (!(f.puff > 0)) for (const p of food) {
      const d = (p.x - f.x) ** 2 + (p.y - f.y) ** 2;
      if (d < best && (p.flake || d < 70 * 70)) { best = d; chasing = p; }
    }
    if (chasing) {
      f.tx = chasing.x; f.ty = chasing.y; speed *= 1.8;
      const mouthX = f.x + f.dir * f.w / 2;
      if (Math.abs(chasing.x - mouthX) < 3 && Math.abs(chasing.y - f.y) < 3) {
        food.splice(food.indexOf(chasing), 1);
        addBubble(mouthX, f.y - 1, false);
      }
    } else {
      f.retarget -= dt;
      if (f.retarget <= 0 || Math.hypot(f.tx - f.x, f.ty - f.y) < 4) pickTarget(f);
    }
    const dx = f.tx - f.x, dy = (f.ty - f.y) * (chasing ? 1 : 0.6);
    const d = Math.hypot(dx, dy) || 1;
    const ease = Math.min(1, dt * (chasing ? 3 : 1.2));
    f.vx += (dx / d * speed - f.vx) * ease;
    f.vy += (dy / d * speed * 0.6 - f.vy) * ease;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.x = Math.max(f.w / 2 + 1, Math.min(W - f.w / 2 - 1, f.x));
    f.y = Math.max(SURF + f.h / 2 + 2, Math.min(SAND - 3 - f.h / 2, f.y));
    if (f.vx > 1.5) f.dir = 1; else if (f.vx < -1.5) f.dir = -1;

    if (f.trail) {
      // lay down a new trail point for every pixel the eel's head travels
      f.wig += dt * (4 + Math.hypot(f.vx, f.vy) * 0.4);
      let h = f.trail[0], d = Math.hypot(f.x - h.x, f.y - h.y);
      while (d >= 1) {
        h = { x: h.x + (f.x - h.x) / d, y: h.y + (f.y - h.y) / d };
        f.trail.unshift(h);
        d -= 1;
      }
      f.trail.length = f.sp.len;
    }

    f.bubbleT -= dt;
    if (f.bubbleT <= 0) {
      addBubble(f.x + f.dir * f.w / 2, f.y - 1, false);
      f.bubbleT = rand(4, 14);
    }
  }
}

// ---------- sky ----------
function hexMix(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const STARS = [];
for (let i = 0; i < 26; i++) STARS.push({ x: Math.floor(rnd() * W), y: Math.floor(rnd() * (SURF - 2)), tw: rnd() * 6 });
const MOON = ['.mmm.', 'mmcmm', 'mmmmc', 'mcmmm', '.mmm.'];

// the moon crosses the sky during the night half of the cycle
function moonPos() {
  const mp = (dayPhase - 0.25) / 0.5;
  return { x: -4 + mp * (W + 8), y: 8 - Math.sin(Math.PI * Math.max(0, Math.min(1, mp))) * 6, up: mp > 0 && mp < 1 };
}

function drawSky() {
  for (let y = 0; y < SURF; y++) {
    const k = y / (SURF - 1);
    ctx.fillStyle = hexMix(hexMix('#8fd0f2', '#cdeefc', k), hexMix('#050a1e', '#16224c', k), night);
    ctx.fillRect(0, y, W, 1);
  }
  if (night <= 0) return;
  ctx.fillStyle = '#ffffff';
  for (const s of STARS) {
    ctx.globalAlpha = night * (0.5 + 0.5 * Math.sin(t * 2 + s.tw));
    ctx.fillRect(s.x, s.y, 1, 1);
  }
  const m = moonPos();
  if (m.up) {
    ctx.globalAlpha = night;
    for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
      const c = MOON[y][x];
      if (c === '.') continue;
      ctx.fillStyle = c === 'c' ? '#cfcab0' : '#f4f1d6';
      ctx.fillRect(Math.round(m.x) - 2 + x, Math.round(m.y) - 2 + y, 1, 1);
    }
  }
  ctx.globalAlpha = 1;
}

function draw() {
  drawSky();
  ctx.drawImage(bg, 0, 0);

  // light rays (gone at night)
  ctx.fillStyle = '#ffffff';
  for (let r = 0; r < 5; r++) {
    const x0 = 20 + r * 42 + Math.sin(t * 0.3 + r * 1.7) * 8;
    const w = 6 + (r % 3) * 3;
    ctx.globalAlpha = (0.05 + Math.sin(t * 0.7 + r) * 0.02) * (1 - night);
    for (let y = SURF; y < SAND; y += 2) {
      ctx.fillRect(Math.round(x0 - (y - SURF) * 0.35), y, w, 2);
    }
  }
  ctx.globalAlpha = 1;

  // caustic glints on the sand
  ctx.fillStyle = '#fff6cf';
  ctx.globalAlpha = 1 - night;
  for (let x = 0; x < W; x++) {
    if (Math.sin(x * 0.45 + t * 1.3) * Math.sin(x * 0.11 - t * 0.8) > 0.55) ctx.fillRect(x, sandTop[x], 1, 1);
  }
  ctx.globalAlpha = 1;

  // surface
  ctx.fillStyle = '#9fe0f5';
  ctx.fillRect(0, SURF, W, 1);
  ctx.fillStyle = '#d8f6ff';
  for (let x = 0; x < W; x++) {
    if (Math.sin(x * 0.35 + t * 2.2) + Math.sin(x * 0.12 - t * 1.4) > 1.2) ctx.fillRect(x, SURF + 1, 1, 1);
  }

  for (const p of plants) if (!p.front) drawPlant(p, t);
  drawChest();

  // food
  for (const p of food) {
    ctx.globalAlpha = Math.min(1, p.life / 2);
    if (p.flake) {
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.wide ? 2 : 1, 1);
      continue;
    }
    ctx.fillStyle = '#c0672a';
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    ctx.fillStyle = '#e8a050';
    ctx.fillRect(Math.round(p.x), Math.round(p.y) - 1, 1, 1);
  }
  ctx.globalAlpha = 1;

  // fish
  for (const f of fish) {
    if (f.trail) { drawEel(f); continue; }
    const frame = Math.floor(t * (Math.hypot(f.vx, f.vy) * 0.35 + 2) + f.phase) % 2;
    const img = f.sp === PUFFER ? pufferImg(f, frame) : f.sp.img[frame][f.dir > 0 ? 0 : 1];
    const bob = Math.round(Math.sin(t * 2 + f.phase) * (f.puff > 0 ? 1.5 : 0.6));
    ctx.drawImage(img, Math.round(f.x - img.width / 2), Math.round(f.y - img.height / 2) + bob);
  }

  // bubbles
  for (const b of bubbles) {
    const x = Math.round(b.x), y = Math.round(b.y);
    if (b.big) {
      ctx.fillStyle = '#bfefff';
      ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x, y + 1, 1, 1);
      ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 1, y - 1, 1, 1);
    } else {
      ctx.fillStyle = '#d6f5ff';
      ctx.fillRect(x, y, 1, 1);
    }
  }
  ctx.fillStyle = '#ffffff';
  for (const p of pops) {
    const x = Math.round(p.x);
    ctx.fillRect(x - 1, p.y, 1, 1); ctx.fillRect(x + 1, p.y, 1, 1);
  }

  for (const p of plants) if (p.front) drawPlant(p, t);

  // night: darken the water, then let the moon glint on the surface
  if (night > 0) {
    ctx.fillStyle = '#020a24';
    ctx.globalAlpha = 0.62 * night;
    ctx.fillRect(0, SURF, W, H - SURF);
    const m = moonPos();
    if (m.up) {
      ctx.fillStyle = '#f4f1d6';
      for (let x = Math.round(m.x) - 7; x <= Math.round(m.x) + 7; x++) {
        for (let y = 0; y < 3; y++) {
          if (Math.sin(x * 0.9 + y * 2 + t * 2.5) > 0.6 + y * 0.12) {
            ctx.globalAlpha = night * (0.8 - y * 0.25);
            ctx.fillRect(x, SURF + y, 1, 1);
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }
}

function pufferImg(f, frame) {
  const flip = f.dir > 0 ? 0 : 1;
  if (f.puff < 0.3) return PUFFER.img[frame][flip];
  return f.puff < 0.7 ? PUFFER.mid[flip] : PUFFER.full[flip];
}

function drawEel(f) {
  const tr = f.trail, L = tr.length;
  let hx = 0, hy = 0, htx = 1, hty = 0;
  for (let i = L - 1; i >= 0; i--) {
    const a = tr[Math.max(0, i - 1)], b = tr[Math.min(L - 1, i + 1)];
    let tx = a.x - b.x, ty = a.y - b.y;
    const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    // side-to-side wave travelling down the body; the head stays steady
    const wig = Math.sin(f.wig - i * 0.42) * 1.6 * Math.min(1, i / 5);
    const x = tr[i].x - ty * wig, y = tr[i].y + tx * wig;
    const th = i < 4 ? 3 : Math.max(1, Math.round(3 - (i - 4) / (L - 4) * 2.4));
    const x0 = Math.round(x) - (th >> 1), y0 = Math.round(y) - (th >> 1);
    if (th === 1) {
      ctx.fillStyle = '#2f6be0'; ctx.fillRect(x0, y0, 1, 1);
    } else {
      ctx.fillStyle = '#1b3f9a'; ctx.fillRect(x0, y0, th, 1);
      ctx.fillStyle = '#2f6be0'; ctx.fillRect(x0, y0 + 1, th, th - 2);
      ctx.fillStyle = '#7fb0ff'; ctx.fillRect(x0, y0 + th - 1, th, 1);
    }
    if (i > 5 && i < L - 4 && i % 2 === 0) {
      ctx.fillStyle = '#4f86ff'; ctx.fillRect(x0, y0 - 1, 1, 1);
    }
    if (i === 0) { hx = x; hy = y; htx = tx; hty = ty; }
  }
  ctx.fillStyle = '#ffe14a';
  ctx.fillRect(Math.round(hx + htx * 0.6), Math.round(hy) - 1, 1, 1);
  ctx.fillStyle = '#0d1a3a';
  ctx.fillRect(Math.round(hx + htx * 1.6), Math.round(hy + 0.5), 1, 1);
}

function drawChest() {
  const { x, w, bottom } = CHEST, top = bottom - 7, lift = Math.round(CHEST.open * 3), mid = x + (w >> 1);
  // body
  ctx.fillStyle = '#4a2a10'; ctx.fillRect(x, top, w, 7);
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(x + 1, top + 1, w - 2, 5);
  ctx.fillStyle = '#6a3e1a'; ctx.fillRect(x + 1, top + 3, w - 2, 1);
  ctx.fillStyle = '#e8c547';
  ctx.fillRect(x + 2, top, 1, 7); ctx.fillRect(x + w - 3, top, 1, 7);
  ctx.fillRect(mid - 1, top, 2, 3);
  ctx.fillStyle = '#2a1606'; ctx.fillRect(mid - 1, top + 1, 1, 1);
  // gold glinting inside when the lid is up
  if (lift > 0) {
    ctx.fillStyle = '#2a1606'; ctx.fillRect(x + 1, top - lift, w - 2, lift);
    for (let i = 1; i < w - 1; i++) {
      ctx.fillStyle = (i + Math.floor(t * 6)) % 5 === 0 ? '#fff6c0' : i % 2 ? '#ffd84a' : '#c9a032';
      ctx.fillRect(x + i, top - 1, 1, 1);
    }
  }
  // lid
  const ly = top - 4 - lift;
  ctx.fillStyle = '#4a2a10'; ctx.fillRect(x + 1, ly, w - 2, 1); ctx.fillRect(x, ly + 1, w, 3);
  ctx.fillStyle = '#93602f'; ctx.fillRect(x + 2, ly + 1, w - 4, 1);
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(x + 1, ly + 2, w - 2, 1);
  ctx.fillStyle = '#e8c547';
  ctx.fillRect(x + 2, ly, 1, 4); ctx.fillRect(x + w - 3, ly, 1, 4);
  ctx.fillRect(mid - 1, ly + 3, 2, 1);
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
