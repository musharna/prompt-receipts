<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; background: #10131c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; font: 12px monospace; color: #6b7590; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 0 6px #2a2f3d, 0 0 0 10px #1b1f29; cursor: pointer; }
  p { margin: 14px 0 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p>click the water to drop food</p>
<script>
const W = 240, H = 135;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function fit() {
  const s = Math.max(1, Math.floor(Math.min((innerWidth - 40) / W, (innerHeight - 60) / H)));
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---------- helpers ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rand = (a, b) => a + Math.random() * (b - a);
const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); };

// ---------- static background (water, sand, rocks) ----------
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
const b = bg.getContext('2d');

const waterBands = ['#1d6f9e', '#1a6592', '#175b86', '#14517a', '#12486e', '#0f3f62', '#0d3757'];
for (let y = 0; y < H; y++) {
  const t = y / H * (waterBands.length - 1);
  let i = Math.floor(t);
  // ordered dither between bands
  const f = t - i;
  for (let x = 0; x < W; x++) {
    const bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]][y & 3][x & 3] / 16;
    b.fillStyle = waterBands[Math.min(waterBands.length - 1, i + (f > bayer ? 1 : 0))];
    b.fillRect(x, y, 1, 1);
  }
}
// surface line
b.fillStyle = '#5fb7d9'; b.fillRect(0, 6, W, 1);
b.fillStyle = '#2f8ab8'; b.fillRect(0, 7, W, 1);
b.fillStyle = '#0b1622'; b.fillRect(0, 0, W, 6);

// sand height map
const sandTop = new Array(W);
for (let x = 0; x < W; x++) {
  sandTop[x] = Math.round(112 + Math.sin(x * 0.035) * 4 + Math.sin(x * 0.11 + 1) * 1.5);
}
const sandCols = ['#e8cf8f', '#d9bc78', '#c9a865', '#b59354', '#9c7c45'];
for (let x = 0; x < W; x++) {
  for (let y = sandTop[x]; y < H; y++) {
    const d = y - sandTop[x];
    let ci = d === 0 ? 0 : Math.min(4, 1 + Math.floor(d / 6));
    const r = rnd();
    if (r < 0.12) ci = Math.max(0, ci - 1);
    else if (r > 0.9) ci = Math.min(4, ci + 1);
    b.fillStyle = sandCols[ci];
    b.fillRect(x, y, 1, 1);
  }
}
// pebbles
const pebbleCols = ['#8a8f99', '#a67a5b', '#6f7d6a', '#c4c0b6'];
for (let i = 0; i < 40; i++) {
  const x = Math.floor(rnd() * W), y = sandTop[x] + 3 + Math.floor(rnd() * (H - sandTop[x] - 4));
  b.fillStyle = pebbleCols[Math.floor(rnd() * 4)];
  b.fillRect(x, y, rnd() < 0.5 ? 2 : 1, 1);
}

// rocks
function rock(cx, w, h, base, light, dark) {
  const y0 = sandTop[cx];
  for (let dx = -w; dx <= w; dx++) {
    const hh = Math.floor(h * Math.sqrt(1 - (dx / (w + 0.5)) ** 2) + (rnd() < 0.3 ? 1 : 0));
    for (let dy = 0; dy < hh; dy++) {
      const x = cx + dx, y = y0 + 2 - dy;
      let c = base;
      if (dy >= hh - 2 && dx < w * 0.4) c = light;
      else if (dx > w * 0.5 || dy < 2) c = dark;
      if (rnd() < 0.08) c = dark;
      b.fillStyle = c; b.fillRect(x, y, 1, 1);
    }
  }
}
rock(52, 14, 15, '#6b6f7a', '#8f94a0', '#4a4d57');
rock(68, 8, 9, '#5d616c', '#7f8490', '#41444d');
rock(188, 11, 12, '#7a6a5c', '#9b8a79', '#55493f');
rock(200, 6, 6, '#6b6f7a', '#8f94a0', '#4a4d57');

// treasure chest-ish ornament: a little castle
(function castle() {
  const x0 = 120, y0 = sandTop[126] + 2;
  const stone = '#9aa0ab', sd = '#6c717c', sl = '#c2c7cf';
  for (let y = 0; y < 22; y++) for (let x = 0; x < 14; x++) {
    let c = stone;
    if (x === 0 || x === 13) c = sd;
    if (x < 3) c = sl;
    if ((y % 4 === 0 && x % 2) || (y % 4 === 2 && x % 4 === 1)) c = sd;
    b.fillStyle = c; b.fillRect(x0 + x, y0 - y, 1, 1);
  }
  for (let x = 0; x < 14; x += 4) { b.fillStyle = stone; b.fillRect(x0 + x, y0 - 25, 2, 3); }
  b.fillStyle = '#1b1e26';
  b.fillRect(x0 + 5, y0 - 6, 4, 7); b.fillRect(x0 + 6, y0 - 7, 2, 1);
  b.fillRect(x0 + 6, y0 - 16, 2, 3);
})();

// ---------- plants ----------
const plants = [];
function addKelp(x, len, col, dark) {
  plants.push({ type: 'kelp', x, y: sandTop[x] + 1, len, col, dark, ph: rnd() * 6 });
}
function addGrass(x, n, col) {
  for (let i = 0; i < n; i++)
    plants.push({ type: 'grass', x: x + i * 2 - n, y: sandTop[Math.min(W - 1, Math.max(0, x))] + 1,
      len: 6 + Math.floor(rnd() * 10), col, ph: rnd() * 6 });
}
[[14, 70], [22, 55], [30, 80], [96, 60], [104, 45], [160, 75], [168, 58], [222, 72], [230, 50]]
  .forEach(([x, l], i) => addKelp(x, l, i % 3 === 1 ? '#5aa83a' : '#3f8f3a', '#2a6630'));
addGrass(80, 6, '#6cc04a');
addGrass(145, 5, '#7fd05a');
addGrass(210, 4, '#4fb36a');
addGrass(40, 4, '#c25a6a'); // red ludwigia

function drawPlant(p, t) {
  if (p.type === 'kelp') {
    let x = p.x;
    for (let i = 0; i < p.len; i++) {
      const k = i / p.len;
      x = p.x + Math.sin(t * 1.2 + p.ph + i * 0.12) * k * 6;
      const y = p.y - i;
      px(x, y, p.col);
      px(x + 1, y, p.dark);
      if (i % 7 === 3 && i > 4) { // leaves
        const side = (i % 14 === 3) ? -1 : 1;
        for (let j = 1; j <= 4; j++) px(x + (side > 0 ? 1 : 0) + side * j, y - (j >> 1), j < 3 ? p.col : '#6fc24a');
      }
    }
  } else {
    for (let i = 0; i < p.len; i++) {
      const k = i / p.len;
      const x = p.x + Math.sin(t * 1.6 + p.ph) * k * k * 3;
      px(x, p.y - i, p.col);
    }
  }
}

// ---------- fish ----------
// sprites face right. letters map to palette keys; '.' is transparent
const SPRITES = {
  clown: [
    "....dd.....",
    "...dddd....",
    "d.owooowoo.",
    "ddowooowoko",
    "d.owooowoo.",
    "....dd.....",
  ],
  tetra: [
    "...aaaa..",
    "a.aaaaaa.",
    "aabbbbbbk",
    "a.rrrrrr.",
    "...rrr...",
  ],
  angel: [
    "....s.....",
    "....ss....",
    "...sss....",
    "s.sysysss.",
    "sssysysssk",
    "s.sysysss.",
    "...sss....",
    "....ss....",
    "....s.....",
  ],
  guppy: [
    "tt.......",
    "ttt.ggg..",
    "tttggggkg",
    "ttt.ggg..",
    "tt.......",
  ],
};
const KINDS = [
  { s: 'clown', pal: { o: '#f07a2a', w: '#fff4e6', d: '#1c1c1c', k: '#111' }, speed: 0.35, n: 3 },
  { s: 'tetra', pal: { a: '#9bb7c9', b: '#39e1ff', r: '#e8303a', k: '#111' }, speed: 0.5, n: 6 },
  { s: 'angel', pal: { s: '#e9e4c8', y: '#3a3a3a', k: '#111' }, speed: 0.25, n: 2 },
  { s: 'guppy', pal: { t: '#d94fd0', g: '#ffd95a', k: '#111' }, speed: 0.45, n: 3 },
  { s: 'guppy', pal: { t: '#4f8fff', g: '#c9f0ff', k: '#111' }, speed: 0.45, n: 2 },
];

const fish = [];
for (const k of KINDS) for (let i = 0; i < k.n; i++) {
  const spr = SPRITES[k.s];
  fish.push({
    spr, pal: k.pal, speed: k.speed * rand(0.8, 1.2),
    w: spr[0].length, h: spr.length,
    x: rand(20, W - 20), y: rand(20, 95),
    vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1,
    tx: 0, ty: 0, wait: 0, ph: rand(0, 6),
  });
}
function newTarget(f) { f.tx = rand(10, W - 10 - f.w); f.ty = rand(14, 100 - f.h); }
fish.forEach(newTarget);

function drawFish(f, t) {
  const tailWag = Math.sin(t * 8 + f.ph) > 0 ? 1 : 0;
  const ox = Math.round(f.x), oy = Math.round(f.y + Math.sin(t * 2 + f.ph) * 0.6);
  for (let r = 0; r < f.h; r++) {
    const row = f.spr[r];
    for (let c = 0; c < f.w; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      // wiggle the back third of the fish for a swimming feel
      const back = c < f.w / 3;
      const dy = back && tailWag && (r < f.h / 2) ? 1 : 0;
      const x = f.dir > 0 ? ox + c : ox + (f.w - 1 - c);
      px(x, oy + r + dy, f.pal[ch]);
    }
  }
}

// ---------- bubbles & food ----------
const bubbles = [];
const food = [];
function bubble(x, y) { bubbles.push({ x, y, ph: rand(0, 6), big: Math.random() < 0.25 }); }

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  for (let i = 0; i < 5; i++) food.push({ x: x + rand(-6, 6), y: 8 + rand(0, 3), vy: rand(0.12, 0.2) });
});

// ---------- update ----------
function update(t) {
  for (const f of fish) {
    // pick nearest food if any
    let goal = null, best = 1e9;
    for (const p of food) {
      const d = (p.x - f.x - f.w / 2) ** 2 + (p.y - f.y - f.h / 2) ** 2;
      if (d < best) { best = d; goal = p; }
    }
    let gx, gy, sp = f.speed;
    if (goal) { gx = goal.x - f.w / 2; gy = goal.y - f.h / 2; sp *= 2.2; }
    else {
      if (f.wait > 0) { f.wait--; gx = f.x; gy = f.y; }
      else { gx = f.tx; gy = f.ty; }
    }
    const dx = gx - f.x, dy = gy - f.y, d = Math.hypot(dx, dy);
    if (d > 1) {
      f.vx += (dx / d * sp - f.vx) * 0.04;
      f.vy += (dy / d * sp * 0.6 - f.vy) * 0.04;
    } else {
      f.vx *= 0.9; f.vy *= 0.9;
      if (!goal && f.wait <= 0) { f.wait = Math.random() < 0.4 ? Math.floor(rand(30, 150)) : 0; newTarget(f); }
    }
    f.x += f.vx; f.y += f.vy;
    f.y = Math.max(9, Math.min(sandTop[Math.max(0, Math.min(W - 1, Math.round(f.x)))] - f.h - 2, f.y));
    if (f.vx > 0.05) f.dir = 1; else if (f.vx < -0.05) f.dir = -1;
    if (Math.random() < 0.002) bubble(f.x + (f.dir > 0 ? f.w : 0), f.y + 2);
    // eat
    if (goal && best < 9) food.splice(food.indexOf(goal), 1);
  }

  // bubbler behind the castle
  if (Math.random() < 0.12) bubble(133 + rand(-1, 1), sandTop[133] - 22);
  if (Math.random() < 0.05) bubble(58 + rand(-2, 2), sandTop[58] - 10);

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const bb = bubbles[i];
    bb.y -= bb.big ? 0.55 : 0.4;
    bb.x += Math.sin(bb.y * 0.25 + bb.ph) * 0.15;
    if (bb.y < 8) bubbles.splice(i, 1);
  }
  for (let i = food.length - 1; i >= 0; i--) {
    const p = food[i];
    p.x += Math.sin(t * 2 + i) * 0.05;
    const floor = sandTop[Math.max(0, Math.min(W - 1, Math.round(p.x)))];
    if (p.y < floor) p.y += p.vy; else { p.rest = (p.rest || 0) + 1; if (p.rest > 600) food.splice(i, 1); }
  }
}

// ---------- draw ----------
function draw(t) {
  ctx.drawImage(bg, 0, 0);

  // light rays
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = '#d8f6ff';
  for (let i = 0; i < 6; i++) {
    const base = ((i * 47 + t * 3) % (W + 80)) - 40;
    const w = 6 + (i % 3) * 4;
    for (let y = 7; y < 112; y++) ctx.fillRect(Math.round(base + y * 0.35), y, w, 1);
  }
  ctx.globalAlpha = 1;

  // surface shimmer
  for (let x = 0; x < W; x++) if (Math.sin(x * 0.3 + t * 2) + Math.sin(x * 0.13 - t * 1.3) > 1.3) px(x, 6, '#bfeeff');

  plants.filter(p => p.type === 'kelp' && p.x % 2 === 0).forEach(p => drawPlant(p, t));
  for (const p of food) { px(p.x, p.y, '#8a4a22'); px(p.x + 1, p.y, '#b5652e'); }
  fish.forEach(f => drawFish(f, t));
  plants.filter(p => !(p.type === 'kelp' && p.x % 2 === 0)).forEach(p => drawPlant(p, t));

  for (const bb of bubbles) {
    if (bb.big) {
      px(bb.x, bb.y - 1, '#a9e4ff'); px(bb.x - 1, bb.y, '#a9e4ff');
      px(bb.x + 1, bb.y, '#a9e4ff'); px(bb.x, bb.y + 1, '#a9e4ff');
      px(bb.x - 1, bb.y - 1, '#ffffff');
    } else px(bb.x, bb.y, '#cdf1ff');
  }

  // glass glare
  ctx.globalAlpha = 0.06; ctx.fillStyle = '#fff';
  ctx.fillRect(6, 10, 2, H - 20); ctx.fillRect(10, 10, 1, H - 20);
  ctx.globalAlpha = 1;
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  const t = now / 1000;
  while (acc >= 1000 / 60) { update(t); acc -= 1000 / 60; }
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
