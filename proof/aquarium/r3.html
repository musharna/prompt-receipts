<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
  #bar { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
  #hint { color: #4f5f80; font: 12px monospace; user-select: none; }
  #feed {
    font: bold 13px monospace; color: #2a1606; background: #e8b730; border: none; padding: 6px 14px; cursor: pointer;
    box-shadow: inset -2px -2px 0 #9c7414, inset 2px 2px 0 #ffe36b, 0 0 0 2px #2a1606;
  }
  #feed:active { box-shadow: inset 2px 2px 0 #9c7414, 0 0 0 2px #2a1606; transform: translateY(1px); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="feed">FEED</button>
  <div id="hint">click the water to drop food · click the pufferfish to make it puff</div>
</div>
<script>
const W = 240, H = 135;      // logical pixel resolution
const SURF = 22;             // water surface row (sky above it)
const BASE = 129;            // top of the wooden stand
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, (innerHeight - 50) / H)));
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---------- helpers ----------
let seed = 20261013;
function rng() { // mulberry32, seeded so the scenery is stable
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const dith = (x, y) => (BAYER[y & 3][x & 3] + 0.5) / 16 - 0.5;

function spriteCanvas(rows, pal) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => {
    if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c;
}

// ---------- sand profile ----------
const sandY = [];
for (let x = 0; x < W; x++)
  sandY[x] = Math.round(110 + Math.sin(x * 0.045) * 2.5 + Math.sin(x * 0.13 + 1.3) * 1.2 + Math.sin(x * 0.31) * 0.5);
const sandTopAt = (x0, w) => { let m = 0; for (let x = x0; x < x0 + w; x++) m = Math.max(m, sandY[clamp(x, 0, W - 1)]); return m; };

// ---------- baked background ----------
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
const bctx = bg.getContext('2d');
const img = bctx.createImageData(W, H);
const D = img.data;
function put(x, y, c) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) * 4;
  D[i] = c[0]; D[i + 1] = c[1]; D[i + 2] = c[2]; D[i + 3] = 255;
}
function get(x, y) { const i = (y * W + x) * 4; return [D[i], D[i + 1], D[i + 2]]; }

const WATER = ['#63c8e2', '#4bb0d5', '#3898c6', '#2a80b2', '#20699b', '#185483', '#11416b', '#0c3154'].map(rgb);
const HAZE = rgb('#1b5a85');
const SAND = ['#e9c684', '#d8ad68', '#c49452', '#ab7c40'].map(rgb);
const SAND_TOP = rgb('#f7e0aa');
const SPECK = ['#fbeac3', '#9a6e36', '#b98c4c', '#e6d3b0'].map(rgb);

(function bake() {
  // water gradient with ordered dithering
  for (let y = SURF - 2; y < BASE; y++)
    for (let x = 0; x < W; x++) {
      const t = clamp((y - SURF) / (112 - SURF), 0, 1);
      put(x, y, WATER[clamp(Math.round(t * (WATER.length - 1) + dith(x, y)), 0, WATER.length - 1)]);
    }
  // distant hazy hills for depth
  for (let x = 0; x < W; x++) {
    const hy = Math.round(94 + Math.sin(x * 0.028 + 2) * 6 + Math.sin(x * 0.09) * 2);
    for (let y = hy; y < sandY[x]; y++)
      if (y > hy + 1 || (x + y) % 2 === 0) put(x, y, HAZE);
  }
  // sand
  for (let x = 0; x < W; x++)
    for (let y = sandY[x]; y < BASE; y++) {
      const d = y - sandY[x];
      let c = d === 0 ? SAND_TOP : SAND[clamp(Math.round(d / (BASE - 106) * 3.2 + dith(x, y)), 0, 3)];
      const r = rng();
      if (r < 0.07) c = SPECK[Math.floor(rng() * SPECK.length)];
      put(x, y, c);
    }
  // pink branching coral
  const CORAL = [rgb('#ff86ab'), rgb('#d9567f'), rgb('#ffc2d4')];
  function branch(x, y, len, ang, depth) {
    for (let i = 0; i < len; i++) {
      x += Math.cos(ang); y -= Math.sin(ang);
      const px = Math.round(x), py = Math.round(y);
      put(px, py, CORAL[0]); put(px + 1, py, CORAL[1]);
      ang += (rng() - 0.5) * 0.25;
    }
    put(Math.round(x), Math.round(y) - 1, CORAL[2]);
    if (depth > 0) {
      branch(x, y, len * 0.7, ang + 0.5 + rng() * 0.3, depth - 1);
      branch(x, y, len * 0.7, ang - 0.5 - rng() * 0.3, depth - 1);
    }
  }
  branch(118, sandY[118] + 1, 7, Math.PI / 2, 3);
  // rocks
  const GREY = ['#2f323b', '#4a4e59', '#666b78', '#868c99', '#a5abb6'].map(rgb);
  const BROWN = ['#2e241f', '#4d3d33', '#6b5646', '#8a735f', '#a8917b'].map(rgb);
  const MOSS = rgb('#4f8a3c');
  const rocks = [
    { x: 30, rx: 15, ry: 10, p: GREY }, { x: 50, rx: 8, ry: 6, p: GREY },
    { x: 98, rx: 7, ry: 5, p: BROWN }, { x: 186, rx: 13, ry: 9, p: BROWN },
    { x: 203, rx: 6, ry: 4, p: GREY }, { x: 212, rx: 4, ry: 3, p: GREY },
  ];
  for (const r of rocks) {
    const cy = sandY[r.x] + Math.round(r.ry * 0.3);
    for (let y = cy - r.ry; y <= cy + r.ry; y++)
      for (let x = r.x - r.rx; x <= r.x + r.rx; x++) {
        if (x < 0 || x >= W || y > sandY[x] + 1) continue;
        const nx = (x - r.x) / r.rx, ny = (y - cy) / r.ry, e = nx * nx + ny * ny;
        if (e > 1) continue;
        let c;
        if (e > 0.8) c = r.p[0];
        else {
          const v = -nx * 0.45 - ny * 0.75 + (rng() - 0.5) * 0.25;
          c = r.p[clamp(Math.round((v + 0.9) / 1.8 * 3 + 1 + dith(x, y)), 1, 4)];
          if (ny < -0.55 && rng() < 0.35) c = MOSS;
        }
        put(x, y, c);
      }
  }
  // moss balls
  const BALL = ['#2e6b2a', '#3f8a37', '#5fae4b'].map(rgb);
  for (const bx of [72, 140]) {
    const cy = sandY[bx] - 2;
    for (let y = -3; y <= 3; y++) for (let x = -3; x <= 3; x++) {
      const e = (x * x + y * y) / 10;
      if (e > 1) continue;
      put(bx + x, cy + y, BALL[clamp(Math.round(1 - (x + y) * 0.2 + dith(x, y) * 1.5), 0, 2)]);
    }
  }
  // starfish + shells
  const star = ['..o..', 'ooooo', '.ooo.', '.o.o.', 'o...o'];
  const STAR = rgb('#f2694a');
  star.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'o') put(80 + x, sandY[82] + y - 1, STAR); }));
  const SHELL = [rgb('#f6b5c4'), rgb('#d27b93')];
  for (const sx of [12, 128, 168, 226]) {
    const sy = sandY[sx] + 2;
    put(sx, sy, SHELL[0]); put(sx + 1, sy, SHELL[1]); put(sx + 2, sy, SHELL[0]);
    put(sx + 1, sy - 1, SHELL[0]);
  }
  bctx.putImageData(img, 0, 0);
})();

// ---------- plants ----------
const PLANT_PALS = [
  ['#2a7030', '#3d9a40', '#72c44e'],
  ['#1d5a38', '#2c7f50', '#5ab46c'],
  ['#842a38', '#b5424f', '#e2706b'],
  ['#4c6a1e', '#6e9028', '#a0c63e'],
];
const plants = [];
seed = 7;
for (let i = 0; i < 26; i++) {
  const x = Math.floor(4 + rng() * (W - 10));
  const type = rng() < 0.6 ? 'kelp' : 'grass';
  plants.push({
    x, type, base: sandY[x] + 1,
    h: type === 'kelp' ? Math.floor(22 + rng() * 60) : 0,
    pal: PLANT_PALS[Math.floor(rng() * PLANT_PALS.length)],
    phase: rng() * 6.28, amp: 1.5 + rng() * 2.5,
    front: rng() < 0.25,
    blades: Array.from({ length: 3 + Math.floor(rng() * 4) }, () => ({
      dx: Math.floor(rng() * 7) - 3, h: 5 + Math.floor(rng() * 10), lean: (rng() - 0.5) * 6,
    })),
  });
}
plants.sort((a, b) => b.h - a.h);

function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }

function drawPlant(p, t) {
  const [dk, md, lf] = p.pal;
  if (p.type === 'kelp') {
    for (let i = 0; i < p.h; i++) {
      const f = i / p.h;
      const sway = Math.sin(t * 1.1 + p.phase - i * 0.12) * p.amp * f * f * 1.8;
      const x = p.x + Math.round(sway), y = p.base - i;
      ctx.fillStyle = (i >> 1) % 2 ? dk : md;
      ctx.fillRect(x, y, f < 0.85 ? 2 : 1, 1);
      if (i > 3 && i % 4 === 0 && f < 0.95) {
        ctx.fillStyle = lf;
        if ((i >> 2) % 2) { ctx.fillRect(x - 2, y, 2, 1); ctx.fillRect(x - 3, y - 1, 1, 1); }
        else { ctx.fillRect(x + 2, y, 2, 1); ctx.fillRect(x + 4, y - 1, 1, 1); }
      }
    }
  } else {
    for (const b of p.blades)
      for (let i = 0; i < b.h; i++) {
        const f = i / b.h;
        const sway = Math.sin(t * 1.6 + p.phase + b.dx) * f * 1.5;
        px(p.x + b.dx + Math.round(b.lean * f * f + sway), p.base - i, i > b.h * 0.6 ? lf : md);
      }
  }
}

// ---------- treasure chest ----------
const CHEST_PAL = { k: '#2a1606', W: '#b07a40', w: '#8b5a2b', g: '#e8b730', G: '#9c7414', y: '#ffe36b', Y: '#fff7b0', o: '#ff4f5e' };
const LID = ['..kkkkkkkk..', '.kWWWWWWWWk.', 'kWwwwwwwwwWk', 'kggggggggggk'];
const BODY = ['kwwwwGgwwwwk', 'kwwwwGGwwwwk', 'kWwwwwwwwwWk', 'kggggggggggk', 'kwwwwwwwwwwk', 'kkkkkkkkkkkk'];
const chestClosed = spriteCanvas([...LID, ...BODY], CHEST_PAL);
const chestOpen = spriteCanvas([...LID, '.kyYyoyYyYk.', 'kyYyYyYyoyYk', ...BODY], CHEST_PAL);
const chest = { x: 3, timer: 5, open: false, bubbleT: 0 }; // tucked into the bottom-left corner
chest.bottom = sandTopAt(chest.x, 12) + 2;

// ---------- fish sprites ----------
function buildFish(s) {
  const L = s.L, Hh = s.H, T = s.T;
  const GW = T + L + 6, GH = Hh + 16, ox = T + 3, oy = 8;
  const cy = oy + Math.floor(Hh / 2);
  const grids = [];
  for (const wig of [-1, 0, 1]) {
    const g = Array.from({ length: GH }, () => Array(GW).fill(null));
    const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < GW && y < GH) g[y][x] = c; };
    // tail
    for (let d = 1; d <= T + 1; d++) {
      const sp = Math.round(d * s.spread);
      const off = Math.round(wig * (d / (T + 1)) * (s.tailWig || 1));
      for (let k = -sp; k <= sp; k++) {
        if (s.fork && d > T * 0.5 && Math.abs(k) < sp * 0.45) continue;
        set(ox + 1 - d, cy + k + off, Math.abs(k) === sp && d > 1 ? (s.tailEdge || s.dark) : (s.tail || s.body));
      }
    }
    // body
    const top = [], bot = [];
    for (let bx = 0; bx < L; bx++)
      for (let by = 0; by < Hh; by++) {
        let nx = (bx + 0.5 - L / 2) / (L / 2);
        const ny = (by + 0.5 - Hh / 2) / (Hh / 2);
        if (nx < 0) nx *= 1.12;
        if (nx * nx + ny * ny > 1.05) continue;
        let c = ny < -0.45 ? s.dark : ny > 0.45 ? s.belly : s.body;
        if (s.paint) c = s.paint(L - 1 - bx, by, L, Hh) || c;
        if (s.gill && bx === L - 1 - Math.round(L * 0.35) && Math.abs(ny) < 0.55) c = s.dark;
        set(ox + bx, oy + by, c);
        if (top[bx] === undefined) top[bx] = by;
        bot[bx] = by;
      }
    // dorsal & anal fins
    const fin = (from, to, height, up) => {
      for (let bx = Math.round(L * from); bx <= Math.round(L * to); bx++) {
        if (top[bx] === undefined) continue;
        const q = (bx - L * from) / (L * (to - from)); // 0 at rear, 1 at front
        const hgt = Math.max(1, Math.round(height * (0.35 + 0.65 * Math.sin(q * Math.PI * 0.85))));
        for (let i = 1; i <= hgt; i++)
          set(ox + bx, up ? oy + top[bx] - i : oy + bot[bx] + i, i === hgt ? (s.finEdge || s.fin) : s.fin);
      }
    };
    fin(0.2, 0.7, s.finH, true);
    fin(0.2, 0.55, s.analH || 1, false);
    // eye
    const ex = ox + L - 1 - Math.max(1, Math.round(L * 0.18)), ey = oy + Math.floor(Hh * 0.38);
    set(ex, ey, '#0d1018');
    if (Hh >= 7) set(ex - 1, ey, '#eaf6ff');
    // outline
    if (s.outline) {
      const copy = g.map(r => r.slice());
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
        if (copy[y][x]) continue;
        if ((copy[y - 1] && copy[y - 1][x]) || (copy[y + 1] && copy[y + 1][x]) || copy[y][x - 1] || copy[y][x + 1])
          g[y][x] = s.outline;
      }
    }
    grids.push(g);
  }
  return gridsToSprites(grids);
}

// Crop frames to a shared bounding box (so they don't jitter) and make right/left-facing canvases.
function gridsToSprites(grids) {
  const GH = grids[0].length, GW = grids[0][0].length;
  let x0 = GW, y0 = GH, x1 = 0, y1 = 0;
  for (const g of grids) for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++)
    if (g[y][x]) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  const right = [], left = [];
  for (const g of grids) {
    for (const flip of [false, true]) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cc = c.getContext('2d');
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
        if (g[y][x]) { cc.fillStyle = g[y][x]; cc.fillRect(flip ? x1 - x : x - x0, y - y0, 1, 1); }
      (flip ? left : right).push(c);
    }
  }
  return { w, h, right, left };
}

// Inflated pufferfish: a spiky ball of radius R, facing right.
function buildPuffed(R) {
  const S = 2 * R + 9, c = Math.floor(S / 2);
  const g = Array.from({ length: S }, () => Array(S).fill(null));
  const set = (x, y, col) => { if (x >= 0 && y >= 0 && x < S && y < S) g[y][x] = col; };
  const P = SPECIES.puffer;
  // tail
  for (let k = -1; k <= 1; k++) { set(c - R - 1, c + k, P.tail); set(c - R - 2, c + k * 2, P.tail); set(c - R - 2, c + k, P.tail); }
  for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) {
    if (x * x + y * y > R * R + R * 0.8) continue;
    const ny = y / R;
    let col = ny > 0.3 ? P.belly : ny < -0.5 ? P.dark : P.body;
    if (ny < 0.3 && ((x + 40) * 7 + (y + 40) * 13) % 9 === 0) col = P.spot;
    set(c + x, c + y, col);
  }
  // spikes poking out all around
  for (let a = 0; a < 14; a++) {
    const ang = a / 14 * Math.PI * 2 + 0.2;
    set(Math.round(c + Math.cos(ang) * (R + 1.5)), Math.round(c + Math.sin(ang) * (R + 1.5)), P.spike);
  }
  // outline (skipping spikes so they stay visible)
  const copy = g.map(r => r.slice());
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (copy[y][x]) continue;
    const n = [copy[y - 1] && copy[y - 1][x], copy[y + 1] && copy[y + 1][x], copy[y][x - 1], copy[y][x + 1]];
    if (n.some(v => v && v !== P.spike)) g[y][x] = P.outline;
  }
  const ex = c + Math.round(R * 0.45), ey = c - Math.round(R * 0.35);
  set(ex, ey, '#0d1018'); set(ex - 1, ey, '#eaf6ff');
  set(c + R, c + 1, P.outline); // little "o" mouth
  return gridsToSprites([g]);
}

const SPECIES = {
  clown: {
    L: 11, H: 7, T: 3, spread: 0.8, body: '#f57a1a', dark: '#d65a0a', belly: '#ffa244', fin: '#f57a1a',
    finEdge: '#1b1b1b', tailEdge: '#1b1b1b', outline: '#2a1205', finH: 2, speed: 13,
    paint: f => (f === 3 || f === 4 || f === 7) ? '#fbfbfb' : (f === 5 || f === 8) ? '#1b1b1b' : null,
  },
  tang: {
    L: 13, H: 9, T: 4, spread: 0.9, body: '#2f62e3', dark: '#1d3f9e', belly: '#5585f5', tail: '#ffd21f',
    tailEdge: '#d9a700', fin: '#1d3f9e', finEdge: '#0b1a4a', outline: '#0b1a4a', finH: 2, analH: 2, speed: 17, gill: true,
    paint: (f, by, L, H) => {
      const r = Math.floor(H * 0.3);
      if (by === r && f >= 3 && f <= L - 2) return '#0c1640';
      if (by === r + 1 && f >= 5 && f <= L - 4) return '#0c1640';
      if (f >= L - 4 && f <= L - 3 && by > r && by <= r + 3) return '#0c1640';
      return null;
    },
  },
  yellow: {
    L: 10, H: 10, T: 3, spread: 0.7, body: '#ffd52a', dark: '#e3b100', belly: '#fff07a', fin: '#ffd52a',
    finEdge: '#e3b100', outline: '#5a4200', finH: 3, analH: 3, speed: 11, gill: true,
  },
  angel: {
    L: 8, H: 8, T: 3, spread: 0.7, body: '#e2e8ec', dark: '#bcc6cd', belly: '#f5f8fa', fin: '#cfd8de',
    finEdge: '#2a2e35', outline: '#39404a', finH: 5, analH: 5, speed: 9,
    paint: f => (f === 2 || f === 5) ? '#2a2e35' : null,
  },
  gold: {
    L: 9, H: 6, T: 5, spread: 0.8, fork: true, tailWig: 2, body: '#ff8a1f', dark: '#e0620a', belly: '#ffc070',
    tail: '#ffaa50', tailEdge: '#ff8a1f', fin: '#ffaa50', outline: '#5a2000', finH: 2, speed: 11,
  },
  clownSmall: {
    L: 8, H: 5, T: 2, spread: 0.8, body: '#ff7a14', dark: '#d9580a', belly: '#ffa244', fin: '#ff7a14',
    finEdge: '#1b1b1b', tailEdge: '#1b1b1b', outline: '#2a1205', finH: 1, speed: 15,
    paint: f => (f === 2 || f === 5) ? '#fbfbfb' : (f === 3 || f === 6) ? '#1b1b1b' : null,
  },
  puffer: {
    L: 10, H: 8, T: 2, spread: 0.7, body: '#d9c27a', dark: '#a88f4a', belly: '#f5ecd0', tail: '#c4ab60',
    fin: '#c4ab60', spot: '#6e5626', spike: '#8a7440', outline: '#4a3a1a', finH: 1, speed: 7,
    paint: (f, by, L, H) => by < H * 0.6 && (f * 5 + by * 3) % 7 === 0 && f > 2 ? '#6e5626' : null,
  },
  tetra: {
    L: 7, H: 3, T: 2, spread: 0.6, body: '#c9d6e3', dark: '#8fa1b3', belly: '#e5eef6', tail: '#b9c6d3', fin: '#b9c6d3',
    finH: 1, speed: 20,
    paint: (f, by, L) => by === 1 && f >= 1 && f <= L - 2 ? '#2ee6ff' : (by === 2 && f >= 3) ? '#ff3344' : null,
  },
};
const SPRITES = {};
for (const k in SPECIES) SPRITES[k] = buildFish(SPECIES[k]);
const PUFF_MID = buildPuffed(5), PUFF_FULL = buildPuffed(8);

// ---------- fish behaviour ----------
const fishes = [], bubbles = [], food = [];
const school = { tx: 120, ty: 50, timer: 0 };

class Fish {
  constructor(kind, inSchool) {
    this.s = SPECIES[kind]; this.spr = SPRITES[kind];
    this.w = this.spr.w; this.h = this.spr.h;
    this.x = rand(10, W - 10 - this.w); this.y = rand(SURF + 8, this.yMax());
    this.vx = 0; this.vy = 0; this.dir = Math.random() < 0.5 ? 1 : -1;
    this.anim = Math.random() * 4; this.phase = Math.random() * 10; this.pause = 0;
    this.school = inSchool;
    if (inSchool) { this.ox = rand(-12, 12); this.oy = rand(-6, 6); }
    this.newTarget();
  }
  yMax() { return 106 - this.h; }
  newTarget() {
    this.tx = rand(4, W - 4 - this.w);
    this.ty = rand(SURF + 4, this.yMax());
    this.spd = this.s.speed * rand(0.6, 1.3);
  }
  mouth() { return [this.dir > 0 ? this.x + this.w - 1 : this.x, this.y + this.h / 2]; }
  update(dt, t) {
    let tx = this.tx, ty = this.ty, spd = this.spd;
    // hunt nearest food pellet
    let best = null, bd = 1e9;
    const [mx, my] = this.mouth();
    for (const f of food) { const d = Math.hypot(f.x - mx, f.y - my); if (d < bd) { bd = d; best = f; } }
    if (best) {
      const facingRight = best.x > this.x + this.w / 2;
      tx = best.x - (facingRight ? this.w - 1 : 0); ty = best.y - this.h / 2;
      spd = this.s.speed * 1.9;
      if (bd < 2.5) {
        food.splice(food.indexOf(best), 1);
        bubbles.push(newBubble(mx, my - 1, 1));
      }
      this.pause = 0;
    } else if (this.school) {
      tx = school.tx + this.ox; ty = school.ty + this.oy; spd = this.s.speed;
    } else if (this.pause > 0) {
      this.pause -= dt; spd = 0;
    }
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy);
    if (!best && !this.school && d < 3 && this.pause <= 0) {
      if (Math.random() < 0.4) this.pause = rand(1, 3.5);
      this.newTarget();
    }
    spd *= pace;
    const k = d > 0 ? spd * Math.min(1, d / 12) / d : 0;
    const ease = Math.min(1, dt * (best ? 3 : 1.3));
    this.vx += (dx * k - this.vx) * ease;
    this.vy += (dy * k * 0.7 - this.vy) * ease;
    this.x = clamp(this.x + this.vx * dt, 2, W - 2 - this.w);
    this.y = clamp(this.y + this.vy * dt, SURF + 3, this.yMax());
    if (this.vx > 1.2) this.dir = 1; else if (this.vx < -1.2) this.dir = -1;
    this.anim += dt * (2 * pace + Math.hypot(this.vx, this.vy) * 0.35);
    if (Math.random() < dt * 0.03) bubbles.push(newBubble(this.mouth()[0], this.y, 1));
  }
  draw(t) {
    const seq = [0, 1, 2, 1];
    const f = seq[Math.floor(this.anim) % 4];
    const img = (this.dir > 0 ? this.spr.right : this.spr.left)[f];
    ctx.drawImage(img, Math.round(this.x), Math.round(this.y + Math.sin(t * 2 + this.phase) * 0.6));
  }
}

// Pufferfish: swims like a normal fish, but inflates into a spiky ball when clicked.
class Puffer extends Fish {
  constructor() { super('puffer', false); this.state = 'normal'; this.st = 0; }
  center() { return [this.x + this.w / 2, this.y + this.h / 2]; }
  hit(x, y) {
    const [cx, cy] = this.center();
    return Math.hypot(x - cx, y - cy) < (this.state === 'normal' ? 7 : 11);
  }
  puff() {
    if (this.state === 'normal' || this.state === 'deflate') { this.state = 'inflate'; this.st = 0.15; }
    else if (this.state === 'full') this.st = 4;
  }
  update(dt, t) {
    if (this.state === 'normal') return super.update(dt, t);
    // while puffed: coast to a stop and float up a little
    const damp = Math.pow(0.15, dt);
    this.vx *= damp; this.vy = this.vy * damp - 2 * dt;
    this.x = clamp(this.x + this.vx * dt, 6, W - 6 - this.w);
    this.y = clamp(this.y + this.vy * dt, SURF + 8, this.yMax());
    this.st -= dt;
    if (this.st <= 0) {
      if (this.state === 'inflate') { this.state = 'full'; this.st = 4; }
      else if (this.state === 'full') { this.state = 'deflate'; this.st = 0.2; }
      else { this.state = 'normal'; this.vy = 0; this.newTarget(); }
    }
  }
  draw(t) {
    if (this.state === 'normal') return super.draw(t);
    const spr = this.state === 'full' ? PUFF_FULL : PUFF_MID;
    const [cx, cy] = this.center();
    const x = clamp(Math.round(cx - spr.w / 2), 1, W - 1 - spr.w);
    const y = clamp(Math.round(cy - spr.h / 2 + Math.sin(t * 1.5 + this.phase)), SURF + 2, 108 - spr.h);
    ctx.drawImage((this.dir > 0 ? spr.right : spr.left)[0], x, y);
  }
}

// Eel: a long body that follows the trail of its head, with a travelling side-to-side wave.
const EEL = { dark: '#16307a', mid: '#2f62e3', belly: '#8ab4ff', fin: '#1f45a8', eye: '#ffe066', mouth: '#0b1640' };
class Eel {
  constructor() {
    this.N = 38;
    this.x = rand(60, 180); this.y = rand(70, 100);
    this.vx = 0; this.vy = 0; this.wig = 0;
    this.trail = Array.from({ length: this.N }, (_, i) => ({ x: this.x - i, y: this.y }));
    this.newTarget();
  }
  newTarget() { this.tx = rand(8, W - 12); this.ty = rand(55, 103); this.spd = rand(9, 16); }
  update(dt) {
    const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy);
    if (d < 4) this.newTarget();
    const k = d > 0 ? this.spd * pace / d : 0, ease = Math.min(1, dt * 0.8);
    this.vx += (dx * k - this.vx) * ease;
    this.vy += (dy * k * 0.5 - this.vy) * ease;
    this.x = clamp(this.x + this.vx * dt, 4, W - 5);
    this.y = clamp(this.y + this.vy * dt, SURF + 8, 104);
    // extend the trail one pixel at a time behind the head
    const tr = this.trail;
    for (;;) {
      const h = tr[0], ex = this.x - h.x, ey = this.y - h.y, el = Math.hypot(ex, ey);
      if (el < 1) break;
      tr.unshift({ x: h.x + ex / el, y: h.y + ey / el });
    }
    tr.length = this.N;
    this.wig += dt * (3 * pace + Math.hypot(this.vx, this.vy) * 0.4);
  }
  draw() {
    const tr = this.trail, N = tr.length;
    for (let i = N - 1; i >= 1; i--) {
      const p = tr[i], a = tr[i - 1], b = tr[Math.min(N - 1, i + 1)];
      let nx = b.y - a.y, ny = a.x - b.x;
      const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      const off = Math.sin(this.wig - i * 0.35) * Math.min(1, i / 8) * 2.2;
      const x = Math.round(p.x + nx * off), y = Math.round(p.y + ny * off);
      if (i < N * 0.55) {
        px(x, y - 1, EEL.dark); px(x, y, EEL.mid); px(x, y + 1, EEL.belly);
        if (i > 4) px(x, y - 2, EEL.fin);
      } else if (i < N * 0.85) {
        px(x, y - 1, EEL.dark); px(x, y, EEL.mid);
        if (i < N - 3) px(x, y - 2, EEL.fin);
      } else px(x, y, EEL.dark);
    }
    // head
    const f = tr[0].x >= tr[4].x ? 1 : -1;
    const hx = Math.round(tr[0].x), hy = Math.round(tr[0].y);
    for (let k = 0; k < 4; k++) {
      const x = hx + f * k;
      if (k < 3) px(x, hy - 1, EEL.dark);
      px(x, hy, EEL.mid); px(x, hy + 1, EEL.belly);
    }
    px(hx + f * 2, hy - 1, EEL.eye);
    px(hx + f * 2, hy + 1, EEL.mouth); px(hx + f * 3, hy + 1, EEL.mouth);
  }
}

for (const k of ['clown', 'clown', 'clownSmall', 'clownSmall', 'clownSmall', 'tang', 'yellow', 'angel', 'angel', 'gold', 'gold'])
  fishes.push(new Fish(k, false));
for (let i = 0; i < 8; i++) fishes.push(new Fish('tetra', true));
const puffers = [new Puffer()];
fishes.push(...puffers);
const eels = [new Eel()];

// ---------- bubbles ----------
function newBubble(x, y, r) { return { x0: x, x, y, r, vy: rand(10, 18) + r * 2, ph: Math.random() * 6 }; }
const BUBBLER_X = 212;
let bubblerT = 0;
const BUB = '#c6ecff', BUB_HI = '#ffffff';
function drawBubble(b) {
  const x = Math.round(b.x), y = Math.round(b.y);
  if (b.r === 1) { ctx.globalAlpha = 0.85; px(x, y, BUB); }
  else if (b.r === 2) {
    ctx.globalAlpha = 0.8;
    px(x + 1, y, BUB); px(x, y + 1, BUB); px(x + 2, y + 1, BUB); px(x + 1, y + 2, BUB);
  } else {
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = BUB;
    ctx.fillRect(x + 1, y, 2, 1); ctx.fillRect(x + 1, y + 3, 2, 1);
    ctx.fillRect(x, y + 1, 1, 2); ctx.fillRect(x + 3, y + 1, 1, 2);
    px(x + 1, y + 1, BUB_HI);
  }
  ctx.globalAlpha = 1;
}

// ---------- food ----------
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  const pf = puffers.find(p => p.hit(x, y));
  if (pf) { pf.puff(); return; }
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++)
    food.push({ x: clamp(x + rand(-4, 4), 2, W - 3), y: SURF + 1 + Math.random() * 2, vy: rand(5, 9), ph: Math.random() * 6, life: 12, settled: false });
});

const FLAKE_COLORS = ['#e8433a', '#f08a24', '#f2c443', '#6cbf4a'];
let flakesToDrop = 0, flakeT = 0, flakeX = 0;
document.getElementById('feed').addEventListener('click', () => {
  flakesToDrop += 16;
  flakeX = rand(40, W - 40);
});

// ---------- day / night ----------
const DAY_LEN = 60; // seconds for a full cycle, starting at midday
let night = 0, pace = 1;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
function nightAmount(t) { return smooth(0.62, 0.3, 0.5 + 0.5 * Math.cos(t / DAY_LEN * Math.PI * 2)); }
function mix(a, b, k) {
  const A = rgb(a), B = rgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
const MOON = spriteCanvas([
  '..mmmmm..',
  '.mmmmmmm.',
  'mmmcmmmsm',
  'mmccmmmsm',
  'mmmmmmmss',
  'mmmmmcmss',
  'mmsmmmsss',
  '.mmmmsss.',
  '..mssss..',
], { m: '#f4f1d8', c: '#cfc9a4', s: '#d9d3b0' });
seed = 99;
const stars = Array.from({ length: 30 }, () => ({ x: Math.floor(2 + rng() * (W - 4)), y: Math.floor(5 + rng() * (SURF - 9)), ph: rng() * 6 }));

// ---------- light rays ----------
const rays = [{ x: 30, w: 6, ph: 0 }, { x: 85, w: 4, ph: 2 }, { x: 140, w: 7, ph: 4 }, { x: 195, w: 3, ph: 1 }];

// ---------- main loop ----------
let last = performance.now(), T0 = last;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = (now - T0) / 1000;

  // --- update ---
  night = nightAmount(t);
  pace = 1 - 0.65 * night;
  school.timer -= dt * pace;
  if (school.timer <= 0) { school.tx = rand(20, W - 40); school.ty = rand(SURF + 12, 90); school.timer = rand(3, 7); }
  for (const f of fishes) f.update(dt, t);
  for (const e of eels) e.update(dt);

  bubblerT -= dt;
  if (bubblerT <= 0) {
    bubbles.push(newBubble(BUBBLER_X + rand(-1, 1), sandY[BUBBLER_X] - 4, Math.random() < 0.3 ? 3 : Math.random() < 0.6 ? 2 : 1));
    bubblerT = rand(0.12, 0.4);
  }
  // a steady trickle of bubbles escapes from under the chest lid
  chest.bubbleT -= dt;
  if (chest.bubbleT <= 0) {
    bubbles.push(newBubble(chest.x + 2 + Math.random() * 8, chest.bottom - 10, Math.random() < 0.25 ? 2 : 1));
    chest.bubbleT = rand(0.2, 0.6);
  }
  chest.timer -= dt;
  if (chest.timer <= 0) {
    chest.open = !chest.open;
    chest.timer = chest.open ? 2.2 : rand(6, 11);
    if (chest.open) for (let i = 0; i < 10; i++)
      bubbles.push(Object.assign(newBubble(chest.x + 2 + Math.random() * 8, chest.bottom - 12 + Math.random() * 3, 1 + Math.floor(Math.random() * 3)), { vy: rand(14, 28) }));
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy * dt;
    b.x = b.x0 + Math.sin(t * 3 + b.ph) * 0.8;
    if (b.y < SURF + 1) bubbles.splice(i, 1);
  }
  if (flakesToDrop > 0 && (flakeT -= dt) <= 0) {
    food.push({
      flake: true, color: FLAKE_COLORS[Math.floor(Math.random() * FLAKE_COLORS.length)],
      x: clamp(flakeX + rand(-22, 22), 2, W - 3), y: SURF + 1, vy: rand(3, 6), ph: Math.random() * 6, life: 12, settled: false,
    });
    flakesToDrop--; flakeT = 0.04;
  }
  for (let i = food.length - 1; i >= 0; i--) {
    const f = food[i];
    if (!f.settled) {
      f.y += f.vy * dt;
      f.x = clamp(f.x + Math.sin(t * (f.flake ? 2.5 : 2) + f.ph) * dt * (f.flake ? 6 : 2), 1, W - 3);
      if (f.y >= sandY[clamp(Math.round(f.x), 0, W - 1)] - 1) f.settled = true;
    } else if ((f.life -= dt) <= 0) food.splice(i, 1);
  }

  // --- draw ---
  ctx.drawImage(bg, 0, 0);

  // light rays
  for (const r of rays) {
    const a = (0.06 + 0.04 * Math.sin(t * 0.7 + r.ph)) * (1 - night);
    ctx.fillStyle = '#e8fbff';
    for (let y = SURF; y < 108; y += 1) {
      const fade = 1 - (y - SURF) / 100;
      ctx.globalAlpha = Math.round(a * fade * 40) / 40;
      ctx.fillRect(Math.round(r.x + (y - SURF) * 0.35 + Math.sin(t * 0.25 + r.ph) * 8), y, r.w, 1);
    }
  }
  ctx.globalAlpha = 1;

  // caustic sparkles on the sand
  for (let x = 0; x < W; x++)
    if (night < 0.6 && Math.sin(x * 0.31 + t * 1.8) * Math.sin(x * 0.11 - t * 1.2) > 0.62) px(x, sandY[x], '#fff6d6');

  for (const p of plants) if (!p.front) drawPlant(p, t);
  ctx.drawImage(chest.open ? chestOpen : chestClosed, chest.x, chest.bottom - (chest.open ? 12 : 10));

  for (const f of food) {
    const fx = Math.round(f.x), fy = Math.round(f.y);
    const blink = f.settled && f.life < 3 && Math.floor(t * 6) % 2;
    if (!f.flake) px(fx, fy, blink ? '#6b3a20' : '#a8582c');
    else if (!blink) {
      ctx.fillStyle = f.color; // flakes flutter between edge-on and flat
      if (f.settled || Math.sin(t * 5 + f.ph) > 0) ctx.fillRect(fx, fy, 2, 1); else ctx.fillRect(fx, fy, 1, 1);
    }
  }
  for (const e of eels) e.draw();
  for (const f of fishes) f.draw(t);
  for (const b of bubbles) drawBubble(b);
  for (const p of plants) if (p.front) drawPlant(p, t);

  // night: tint the whole tank dark blue
  if (night > 0) {
    ctx.globalAlpha = night * 0.62; ctx.fillStyle = '#020b33';
    ctx.fillRect(0, SURF - 2, W, BASE - SURF + 2);
    ctx.globalAlpha = 1;
  }

  // sky above the water: blue by day, orange at dusk, starry at night
  const dusk = 4 * night * (1 - night);
  const waveY = x => SURF + Math.round(Math.sin(x * 0.12 + t * 1.6) * 0.7 + Math.sin(x * 0.05 - t) * 0.5);
  ctx.fillStyle = mix(mix('#8cc8e6', '#070d22', night), '#e0865a', dusk * 0.55);
  for (let x = 0; x < W; x++) ctx.fillRect(x, 4, 1, waveY(x) - 4);
  for (const s of stars) {
    ctx.globalAlpha = night * (0.55 + 0.45 * Math.sin(t * 2 + s.ph));
    px(s.x, s.y, '#fffbe0');
  }
  // the moon arcs across the sky through the night
  const cyc = (t / DAY_LEN) % 1, mp = (cyc - 0.2) / 0.6;
  if (night > 0 && mp > 0 && mp < 1) {
    const mx = Math.round(-10 + mp * (W + 20)), my = Math.round(SURF - 9 - Math.sin(mp * Math.PI) * 7);
    ctx.save();
    ctx.beginPath(); ctx.rect(1, 4, W - 2, SURF - 5); ctx.clip();
    ctx.globalAlpha = night * 0.15; ctx.fillStyle = '#f4f1d8';
    ctx.fillRect(mx - 2, my - 1, 13, 11); ctx.fillRect(mx - 1, my - 2, 11, 13);
    ctx.globalAlpha = night;
    ctx.drawImage(MOON, mx, my);
    ctx.restore();
    // shimmering reflection just under the surface
    ctx.fillStyle = '#f4f1d8';
    for (let i = 0; i < 6; i++) {
      ctx.globalAlpha = night * (0.45 - i * 0.06);
      const w = 7 - i, wob = Math.round(Math.sin(t * 3 + i * 1.7) * 1.5);
      ctx.fillRect(mx + 4 - (w >> 1) + wob, SURF + 2 + i * 2, w, 1);
    }
  }
  ctx.globalAlpha = 1;

  // water surface line
  const surfCol = mix('#bff0ff', '#5a78a8', night), glintCol = mix('#8fdcf0', '#3f5f90', night);
  for (let x = 0; x < W; x++) {
    const wy = waveY(x);
    px(x, wy, surfCol);
    if ((x + Math.floor(t * 6)) % 9 === 0) px(x, wy + 1, glintCol);
  }

  // tank frame
  ctx.fillStyle = '#1c1e25'; ctx.fillRect(0, 0, W, 2);
  ctx.fillStyle = '#2d313b'; ctx.fillRect(0, 2, W, 1);
  ctx.fillStyle = '#454a57'; ctx.fillRect(0, 3, W, 1);
  ctx.fillStyle = '#2d313b'; ctx.fillRect(0, 0, 1, BASE); ctx.fillRect(W - 1, 0, 1, BASE);
  ctx.fillStyle = '#7a4f30'; ctx.fillRect(0, BASE, W, 1);
  ctx.fillStyle = '#5b3a24'; ctx.fillRect(0, BASE + 1, W, H - BASE - 2);
  ctx.fillStyle = '#3e2716'; ctx.fillRect(0, H - 1, W, 1);
  // glass glint
  ctx.globalAlpha = 0.12; ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 18; i++) { ctx.fillRect(6 + i, SURF + 6 + i * 2, 1, 2); ctx.fillRect(10 + i, SURF + 6 + i * 2, 1, 2); }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
