<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e17; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: monospace; color: #5d6a88;
  }
  #tank {
    padding: 8px; background: #262b38; border-radius: 3px;
    box-shadow: 0 0 0 3px #12151d, 0 24px 48px rgba(0,0,0,.6);
  }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
  #feed {
    margin-top: 14px; padding: 6px 18px; font: bold 14px monospace; letter-spacing: 2px;
    color: #fff4d0; background: #c8582c; border: 0; border-radius: 2px; cursor: pointer;
    box-shadow: 0 3px 0 #7a3014;
  }
  #feed:hover { background: #dc6a38; }
  #feed:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a3014; }
  p { margin: 12px 0 0; font-size: 13px; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="tank"><canvas id="c"></canvas></div>
<button id="feed">Feed</button>
<p>click the water to drop food · click the pufferfish · click the chest</p>
<script>
// ---------- setup ----------
const W = 200, H = 136, SURF = 24, SAND = 117;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);

const pack = (r, g, b) => (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;
const hex = h => { const n = parseInt(h.slice(1), 16); return pack(n >> 16, (n >> 8) & 255, n & 255); };
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const packA = c => pack(c[0], c[1], c[2]);

const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

// seeded RNG so the layout is the same every load
let seed = 1337;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + Math.random() * (b - a);

function px(x, y, c) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  buf[y * W + x] = c;
}

// ---------- terrain ----------
const sandTop = new Int16Array(W);
for (let x = 0; x < W; x++) {
  sandTop[x] = SAND + Math.round(
    Math.sin(x * 0.045) * 2.2 + Math.sin(x * 0.13 + 1.3) * 1.2
    - 5 * Math.exp(-(((x - 150) / 22) ** 2))
  );
}

// ---------- static background (plain + "lit" version for light rays) ----------
const bg = new Uint32Array(W * H), bgL = new Uint32Array(W * H);
const WATER_TOP = [78, 182, 210], WATER_BOT = [12, 42, 84], RAY = [210, 245, 255];
const LEVELS = 7;
function setBg(i, c, light = 0.16) { bg[i] = packA(c); bgL[i] = packA(mix(c, RAY, light)); }

for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  if (y < SURF) continue;                        // sky is drawn per frame
  if (y < sandTop[x]) {                   // water: banded with ordered dither
    const q = (y - SURF) / (SAND - SURF) * (LEVELS - 1);
    const lvl = Math.min(LEVELS - 1, Math.floor(q) + (q - Math.floor(q) > bayer(x, y) ? 1 : 0));
    setBg(i, mix(WATER_TOP, WATER_BOT, lvl / (LEVELS - 1)), 0.2);
  } else {                                       // sand
    const d = y - sandTop[x];
    const SANDC = [[238, 212, 150], [222, 190, 124], [204, 170, 106], [180, 148, 90], [156, 126, 78]];
    let c;
    if (d === 0) c = SANDC[0];
    else c = SANDC[Math.min(4, 1 + Math.floor(d / 6 + rnd() * 1.6))];
    const p = rnd();
    if (d > 0 && p < 0.025) c = [[120, 112, 104], [168, 96, 70], [90, 84, 96], [240, 236, 220]][Math.floor(rnd() * 4)];
    setBg(i, c, 0.12);
  }
}

function rock(cx, rx, ry, cols, s) {
  const by = sandTop[cx] + 2;
  for (let y = by - ry - 2; y <= by; y++) for (let x = cx - rx - 2; x <= cx + rx + 2; x++) {
    if (x < 0 || x >= W) continue;
    const dx = (x - cx) / rx, dy = (y - by) / ry;
    const a = Math.atan2(dy, dx);
    const r = 1 + 0.1 * Math.sin(a * 5 + s) + 0.06 * Math.sin(a * 11 + s * 2);
    if (dx * dx + dy * dy > r * r) continue;
    const n = -dx * 0.5 - dy * 0.9 + (rnd() - 0.5) * 0.35;
    setBg(y * W + x, cols[n > 0.75 ? 3 : n > 0.45 ? 2 : n > 0.15 ? 1 : 0], 0.12);
  }
}
const GREY = [[58, 62, 76], [88, 92, 108], [118, 122, 136], [150, 154, 166]];
const BROWN = [[74, 58, 52], [104, 82, 70], [134, 108, 90], [164, 138, 116]];
rock(42, 15, 11, GREY, 1);
rock(56, 8, 6, GREY, 4);
rock(150, 11, 8, BROWN, 2);
rock(108, 5, 4, GREY, 7);

// ---------- plants ----------
const G1 = [[22, 92, 48], [44, 140, 62], [112, 200, 92]].map(packA);
const G2 = [[18, 84, 74], [36, 126, 100], [96, 190, 150]].map(packA);
const G3 = [[70, 96, 30], [110, 142, 40], [178, 204, 80]].map(packA);
const RED = [[110, 30, 40], [168, 52, 58], [222, 110, 96]].map(packA);

const plants = [];
const kelp = (x, h, c, front) => plants.push({ type: 'kelp', x, h, c, front, ph: rnd() * 6, amp: 2 + rnd() * 2, spd: 0.8 + rnd() * 0.5 });
const grass = (x, n, c, front) => {
  const blades = [];
  for (let i = 0; i < n; i++) blades.push({ dx: Math.round((rnd() - 0.5) * n * 1.2), h: 4 + Math.floor(rnd() * 9), lean: (rnd() - 0.5) * 3 });
  plants.push({ type: 'grass', x, c, front, ph: rnd() * 6, blades });
};
const sword = (x, c, front) => {
  const leaves = [-1.0, -0.62, -0.28, 0.06, 0.4, 0.78].map(a => ({ a: a + (rnd() - 0.5) * 0.15, L: 13 + Math.floor(rnd() * 11) }));
  plants.push({ type: 'sword', x, c, front, ph: rnd() * 6, leaves });
};

kelp(8, 62, G1, false); kelp(14, 74, G2, false); kelp(21, 50, G1, false);
kelp(74, 44, G2, false); kelp(126, 66, G1, false); kelp(132, 52, G2, false);
kelp(172, 70, G1, false); kelp(197, 46, G2, false);
sword(90, G3, false); sword(160, G1, false);
kelp(4, 30, RED, true); kelp(118, 24, RED, true);
grass(30, 8, G3, true); grass(64, 6, G1, true); grass(100, 9, G2, true);
grass(140, 7, G3, true); grass(174, 6, G1, true);

function drawPlant(p, t) {
  if (p.type === 'kelp') {
    const base = sandTop[p.x];
    for (let i = 0; i < p.h; i++) {
      const k = i / p.h, y = base - i;
      const x = p.x + Math.round(Math.sin(t * p.spd + p.ph - i * 0.1) * p.amp * k * k);
      px(x, y, p.c[1]); px(x + 1, y, p.c[0]);
      if (i > 3 && i % 3 === 0) {
        const s = (i / 3) % 2 ? -1 : 2;
        px(x + s, y, p.c[2]);
        px(x + s + (s < 0 ? -1 : 1), y - 1, p.c[1]);
      }
      if (i === p.h - 1) px(x, y - 1, p.c[2]);
    }
  } else if (p.type === 'grass') {
    for (const b of p.blades) {
      const bx = Math.max(0, Math.min(W - 1, p.x + b.dx)), base = sandTop[bx];
      for (let i = 0; i < b.h; i++) {
        const k = i / b.h;
        const off = Math.round(b.lean * k * k + Math.sin(t * 1.5 + p.ph + b.dx) * k * 1.2);
        px(bx + off, base - i, i > b.h * 0.6 ? p.c[2] : i < 2 ? p.c[0] : p.c[1]);
      }
    }
  } else {
    const base = sandTop[p.x];
    for (const lf of p.leaves) {
      const sway = Math.sin(t * 0.9 + p.ph + lf.a * 2) * 0.12;
      let x = p.x + 0.5, y = base;
      for (let s = 0; s < lf.L; s++) {
        const f = s / lf.L;
        const ang = lf.a * (1 + f * 0.9) + sway * f;
        x += Math.sin(ang); y -= Math.cos(ang);
        const rx = Math.round(x), ry = Math.round(y);
        px(rx, ry, f < 0.15 ? p.c[0] : p.c[1]);
        if (f > 0.2 && f < 0.75) px(rx + (lf.a < 0 ? 1 : -1), ry, p.c[2]);
      }
    }
  }
}

// ---------- fish ----------
const SPECIES = {
  clown: { tail: 3, speed: 14, pal: { o: '#f2701d', d: '#b5420f', w: '#fbf6ee', k: '#16131a' }, rows: [
    "......dd....",
    "d...oowwow..",
    "dd.ooowwowko",
    "dddooowwowoo",
    "dd.ooowwowo.",
    "d...oowwow..",
    ".....dd.....",
  ]},
  miniclown: { tail: 2, speed: 17, pal: { o: '#ff7a1f', d: '#b5420f', w: '#fbf6ee', k: '#16131a' }, rows: [
    ".....dd..",
    "d.oowowko",
    "ddoowowoo",
    "d.oowowo.",
    "....dd...",
  ]},
  tetra: { tail: 2, speed: 18, pal: { s: '#c9d6e3', b: '#36d6ff', r: '#e8304a', k: '#111' }, rows: [
    "...sss...",
    "s.bbbbbks",
    "ssrrrrsss",
    "s..rrss..",
  ]},
  angel: { tail: 2, speed: 8, pal: { f: '#cfc6a0', y: '#ece7cc', h: '#2b2b36', k: '#111' }, rows: [
    "....ff.....",
    "...fyy.....",
    "..yyhyy....",
    "f.yyhyyhy..",
    "ffyyhyyhyk.",
    "ffyyhyyhyyy",
    "f.yyhyyhy..",
    "..yyhyy....",
    "...fyy.....",
    "....ff.....",
  ]},
  gold: { tail: 3, speed: 11, pal: { g: '#f59a2c', h: '#ffd27a', t: '#e0611b', k: '#1a1010' }, rows: [
    "....ggg...",
    "t..ghhggg.",
    "ttggggggkg",
    "ttgggggggg",
    "t..gggggg.",
    "....tt....",
  ]},
  tang: { tail: 3, speed: 16, pal: { b: '#2b62d9', n: '#0e1d4a', y: '#ffd23a', k: '#fff' }, rows: [
    "....bbbb....",
    "y..bnnbbbb..",
    "yybnbbnnbkb.",
    "yybbnbbbbbbb",
    "yybnnnbbbbb.",
    "y..bbbbbbb..",
    "....bbb.....",
  ]},
};
for (const s of Object.values(SPECIES)) {
  s.w = s.rows[0].length; s.h = s.rows.length;
  for (const k in s.pal) s.pal[k] = hex(s.pal[k]);
}

// pufferfish: sprites generated from an ellipse that inflates (f = 0 flat .. 1 fully puffed)
const PUFF_PAL = { y: '#e9c45a', s: '#7a5a2a', w: '#f6f0d8', k: '#111', t: '#c99a3a', p: '#8a6526' };
for (const k in PUFF_PAL) PUFF_PAL[k] = hex(PUFF_PAL[k]);
function makePuffer(f) {
  const rx = Math.round(4 + 2 * f), ry = Math.round(3 + 3 * f);
  const cx = rx + 2, cy = ry + 1, w = cx + rx + 2, h = 2 * ry + 3;
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const dx = c - cx, dy = r - cy;
    if ((dx / (rx + 0.4)) ** 2 + (dy / (ry + 0.4)) ** 2 > 1) continue;
    g[r][c] = dy > ry * 0.35 ? 'w' : ((c * 7 + r * 3) % 5 === 0 && dy > -ry * 0.8) ? 's' : 'y';
  }
  for (let d = -1; d <= 1; d++) g[cy + d][1] = 't';
  const fan = f > 0.5 ? 2 : 1;
  for (let d = -fan; d <= fan; d++) g[cy + d][0] = 't';
  g[cy - Math.round(ry * 0.35)][cx + Math.round(rx * 0.55)] = 'k';
  if (f > 0.5) for (const a of [-90, -45, 0, 45, 90, 135, -135]) {
    const ang = a * Math.PI / 180;
    const c = cx + Math.round(Math.cos(ang) * (rx + 1)), r = cy + Math.round(Math.sin(ang) * (ry + 1));
    if (r >= 0 && r < h && c >= 2 && c < w) g[r][c] = 'p';
  }
  return { tail: 2, speed: 11, pal: PUFF_PAL, rows: g.map(r => r.join('')), w, h };
}
const PUFF_FRAMES = [0, 0.33, 0.66, 1].map(makePuffer);

// eel: drawn procedurally as a travelling sine wave
const EEL = { len: 26, light: hex('#6fb6ff'), mid: hex('#2f6fe0'), belly: hex('#a8d4ff'),
  fin: hex('#1d47a8'), eye: hex('#ffe14a') };

const food = [];

function bounds(w, h, x) {
  const xi = Math.max(0, Math.min(W - 1, Math.round(x)));
  return { x0: w / 2 + 1, x1: W - w / 2 - 1, y0: SURF + h / 2 + 2, y1: sandTop[xi] - h / 2 - 2 };
}

function steer(o, tx, ty, sp, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  const want = d > 0.01 ? Math.min(sp, d * 1.2) : 0;
  const dvx = d > 0.01 ? dx / d * want : 0, dvy = d > 0.01 ? dy / d * want * 0.7 : 0;
  const k = Math.min(1, dt * 1.6);
  o.vx += (dvx - o.vx) * k; o.vy += (dvy - o.vy) * k;
  o.x += o.vx * dt; o.y += o.vy * dt;
  const b = bounds(o.w, o.h, o.x);
  o.x = Math.max(b.x0, Math.min(b.x1, o.x));
  o.y = Math.max(b.y0, Math.min(b.y1, o.y));
  return d;
}

function wanderTarget(o) {
  const b = bounds(o.w, o.h, 100);
  o.tx = rr(b.x0, b.x1);
  const bt = bounds(o.w, o.h, o.tx);
  o.ty = o.low ? rr(bt.y1 - 22, bt.y1) : Math.max(bt.y0, Math.min(bt.y1, o.y + rr(-28, 28)));
  o.timer = rr(4, 10); o.arrived = false;
}

// tetras follow a shared invisible leader
const school = { x: 100, y: 50, vx: 0, vy: 0, w: 24, h: 14, timer: 0 };
wanderTarget(school);

const fishes = [];
function addFish(name, n) {
  for (let i = 0; i < n; i++) {
    const S = SPECIES[name];
    const f = { S, w: S.w, h: S.h, x: rr(20, 180), y: rr(20, 80), vx: 0, vy: 0, dir: Math.random() < 0.5 ? 1 : -1,
      wag: rr(0, 6), z: Math.random(), timer: 0, school: name === 'tetra',
      ox: rr(-11, 11), oy: rr(-6, 6) };
    if (f.school) { f.x = school.x + f.ox; f.y = school.y + f.oy; }
    wanderTarget(f);
    fishes.push(f);
  }
}
addFish('clown', 2); addFish('miniclown', 3); addFish('tetra', 7); addFish('angel', 1); addFish('gold', 2); addFish('tang', 1);

const eel = { S: { speed: 9 }, eel: true, low: true, w: EEL.len, h: 6, x: 60, y: 85, vx: 0, vy: 0, dir: 1,
  wag: 0, z: 0.3, timer: 0 };
wanderTarget(eel);
fishes.push(eel);

const puffer = { S: PUFF_FRAMES[0], puffer: true, w: PUFF_FRAMES[0].w, h: PUFF_FRAMES[0].h, x: 120, y: 45,
  vx: 0, vy: 0, dir: -1, wag: 0, z: 0.6, timer: 0, puff: 0, puffTimer: 0 };
wanderTarget(puffer);
fishes.push(puffer);

fishes.sort((a, b) => a.z - b.z);

function updatePuff(f, dt) {
  f.puffTimer -= dt;
  const goal = f.puffTimer > 0 ? 1 : 0;
  f.puff += Math.sign(goal - f.puff) * Math.min(Math.abs(goal - f.puff), dt * (goal ? 5 : 1.2));
  const S = PUFF_FRAMES[Math.round(f.puff * 3)];
  f.S = S; f.w = S.w; f.h = S.h;
}

function updateFish(f, dt) {
  if (f.puffer) updatePuff(f, dt);
  const puffed = f.puffer && f.puff > 0.3;
  let tx, ty, sp = f.S.speed * (puffed ? 0.25 : 1) * activity(), target = null;
  const mouth = () => ({ x: f.x + f.dir * f.w / 2, y: f.y });
  let best = 1e9;
  if (!puffed) for (const p of food) {
    const d = Math.hypot(p.x - f.x, p.y - f.y);
    if (d < best) { best = d; target = p; }
  }
  if (target) {
    tx = target.x - f.dir * f.w * 0.4; ty = target.y; sp *= 1.9;
  } else if (f.school) {
    if (Math.random() < dt * 0.15) { f.ox = rr(-11, 11); f.oy = rr(-6, 6); }
    tx = school.x + f.ox; ty = school.y + f.oy;
  } else {
    f.timer -= dt;
    if (f.timer <= 0) wanderTarget(f);
    tx = f.tx; ty = f.ty;
  }
  const d = steer(f, tx, ty, sp, dt);
  if (!target && !f.school && d < 3 && !f.arrived) { f.arrived = true; f.timer = Math.min(f.timer, rr(0.5, 3)); }
  if (f.vx > 1.2) f.dir = 1; else if (f.vx < -1.2) f.dir = -1;
  f.wag += dt * (3 * activity() + Math.hypot(f.vx, f.vy) * 0.6);
  if (target) {
    const m = mouth();
    // vertical slack lets bottom-hugging fish reach flakes resting on the sand
    if (Math.abs(target.x - m.x) < 3 && Math.abs(target.y - m.y) < Math.max(3, f.h / 2 + 3))
      food.splice(food.indexOf(target), 1);
  }
}

function drawEel(f) {
  const L = EEL.len, hx = Math.round(f.x + f.dir * L / 2);
  for (let i = L - 1; i >= 0; i--) {             // tail first so the head sits on top
    const amp = 1.8 * Math.min(1, i / 5);
    const y = Math.round(f.y + Math.sin(f.wag * 1.3 - i * 0.45) * amp);
    const x = hx - f.dir * i;
    const th = i === 0 ? 2 : i >= L - 4 ? 1 : i >= L - 7 ? 2 : 3;
    if (th === 1) { px(x, y, EEL.mid); continue; }
    px(x, y - 1, EEL.light); px(x, y, EEL.mid);
    if (th === 3) px(x, y + 1, EEL.belly);
    if (i >= 6 && i < L - 3) px(x, y - 2, EEL.fin);
    if (i === 2) px(x, y - 1, EEL.eye);
  }
}

function drawFish(f) {
  if (f.eel) return drawEel(f);
  const S = f.S;
  const ox = Math.round(f.x - S.w / 2), oy = Math.round(f.y - S.h / 2 + Math.sin(f.wag * 0.4) * 0.6);
  const wag = Math.round(Math.sin(f.wag));
  for (let r = 0; r < S.h; r++) {
    const row = S.rows[r];
    for (let c = 0; c < S.w; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      const yy = oy + r + (c < S.tail - 1 ? wag : 0);
      const xx = f.dir > 0 ? ox + c : ox + (S.w - 1 - c);
      px(xx, yy, S.pal[ch]);
    }
  }
}

// ---------- bubbles ----------
const bubbles = [];
const BUB = hex('#d6f3ff'), BUB_D = hex('#8fd0ea');

// treasure chest in the bottom-right corner; lid pops open every so often in a burst of bubbles
const CHEST_PAL = { o: '#2e1c0c', w: '#8a5a2b', d: '#5e3a1a', g: '#f2c443', G: '#b8862a', k: '#3a2410' };
for (const k in CHEST_PAL) CHEST_PAL[k] = hex(CHEST_PAL[k]);
const CHEST_BASE = [
  "oGgwwwwggwwwwgGo",
  "oGgwwwwgkwwwwgGo",
  "oGgddddggddddgGo",
  "oGgwwwwwwwwwwgGo",
  "oGgwwwwwwwwwwgGo",
  "oGgddddddddddgGo",
  "oooooooooooooooo",
];
const CHEST_LID = [
  "...oooooooooo...",
  ".owwwwwwwwwwwwo.",
  "oGgwwwwwwwwwwgGo",
  "oGgddddddddddgGo",
  "oggggggggggggggo",
];
const INSIDE = hex('#1c1008'), COIN = hex('#ffd84a'), COIN_D = hex('#c9962a'), GLINT = hex('#ffffff');
const chest = { x: 180, y: 0, t: 0, open: 0 };
chest.y = Math.max(...Array.from({ length: 16 }, (_, i) => sandTop[chest.x + i])) + 1 - CHEST_BASE.length; // top of base
const CHEST_CYCLE = 9, CHEST_OPEN_AT = 6, CHEST_CLOSE_AT = 8.5;

function updateChest(dt) {
  chest.t = (chest.t + dt) % CHEST_CYCLE;
  const goal = chest.t > CHEST_OPEN_AT && chest.t < CHEST_CLOSE_AT ? 1 : 0;
  chest.open += Math.sign(goal - chest.open) * Math.min(Math.abs(goal - chest.open), dt * 3);
}
function drawChest() {
  const gap = Math.round(chest.open * 4), x0 = chest.x, y0 = chest.y;
  CHEST_BASE.forEach((row, r) => { for (let c = 0; c < 16; c++) px(x0 + c, y0 + r, CHEST_PAL[row[c]]); });
  for (let g = 1; g <= gap; g++) {                 // open interior: dark, with coins heaped at the bottom
    const y = y0 - g;
    px(x0, y, CHEST_PAL.o); px(x0 + 15, y, CHEST_PAL.o);
    for (let c = 1; c < 15; c++) px(x0 + c, y, g === 1 ? ((c + Math.floor(T * 4)) % 5 === 0 ? GLINT : c % 2 ? COIN : COIN_D) : INSIDE);
  }
  const ly = y0 - gap - CHEST_LID.length;
  CHEST_LID.forEach((row, r) => { for (let c = 0; c < 16; c++) if (row[c] !== '.') px(x0 + c, ly + r, CHEST_PAL[row[c]]); });
}

let bubbleAcc = 0;
function updateBubbles(dt) {
  bubbleAcc += dt * (1.5 + chest.open * 24);
  while (bubbleAcc > 1) {
    bubbleAcc--;
    const wide = chest.open > 0.3;
    bubbles.push({ x0: chest.x + (wide ? rr(2, 13) : rr(6, 9)), y: chest.y - 1 - Math.round(chest.open * 4),
      s: wide && Math.random() < 0.45 ? 2 : 1, ph: rr(0, 6), vy: rr(14, 24) });
  }
  // occasional lone bubble from a random fish
  if (Math.random() < dt * 0.4) {
    const f = fishes[Math.floor(Math.random() * fishes.length)];
    bubbles.push({ x0: f.x + f.dir * f.w / 2, y: f.y - 1, s: 1, ph: 0, vy: 10 });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy * dt; b.vy = Math.min(30, b.vy + dt * 4);
    b.x = b.x0 + Math.sin(b.ph + b.y * 0.25);
    if (b.y < SURF + 1) bubbles.splice(i, 1);
  }
}
function drawBubbles() {
  for (const b of bubbles) {
    const x = Math.round(b.x), y = Math.round(b.y);
    if (b.s === 1) px(x, y, BUB);
    else { px(x, y, BUB); px(x + 1, y, BUB_D); px(x, y + 1, BUB_D); px(x + 1, y + 1, BUB_D); }
  }
}

// ---------- food ----------
const FOOD_C = ['#c8582c', '#e8a03a', '#8a6a3a', '#d06a4a'].map(hex);
function dropFood(x) {
  for (let i = 0; i < 6 && food.length < 60; i++)
    food.push({ x: Math.max(1, Math.min(W - 2, x + rr(-5, 5))), y: SURF + rr(0, 2), vy: rr(4, 8), ph: rr(0, 6),
      c: FOOD_C[Math.floor(Math.random() * FOOD_C.length)], life: 12 });
}
function updateFood(dt, t) {
  for (let i = food.length - 1; i >= 0; i--) {
    const p = food[i];
    const floor = sandTop[Math.round(p.x)] - 1;
    if (p.y < floor) {
      p.y = Math.min(floor, p.y + p.vy * dt);
      p.x += Math.sin(t * 2 + p.ph) * dt * 3;
      p.x = Math.max(1, Math.min(W - 2, p.x));
    } else if ((p.life -= dt) <= 0) food.splice(i, 1);
  }
}
function drawFood() {
  for (const p of food) px(Math.round(p.x), Math.round(p.y), p.c);
}

// ---------- water, light rays, surface ----------
const SURF_C = hex('#a6e2f2'), SURF_HI = hex('#f0fcff');
const rayLUT = new Float32Array(W + H);
function drawWater(t) {
  for (let u = 0; u < rayLUT.length; u++) {
    const r = Math.sin(u * 0.075 + t * 0.35) * 0.6 + Math.sin(u * 0.19 - t * 0.7) * 0.4;
    rayLUT[u] = Math.max(0, r - 0.25) * 1.5;
  }
  for (let y = SURF; y < H; y++) {
    const fade = (1 - (y - SURF) / (H - SURF) * 0.75) * (1 - night * 0.85);
    const row = y * W, shift = Math.floor(y * 0.5);
    for (let x = 0; x < W; x++) {
      const i = row + x;
      buf[i] = rayLUT[x + shift] * fade > bayer(x, y) ? bgL[i] : bg[i];
    }
  }
}
function drawSurface(t) {
  for (let x = 0; x < W; x++) {
    const w = Math.sin(x * 0.21 - t * 2.2) + Math.sin(x * 0.07 + t * 1.3);
    px(x, SURF, w > 1.1 ? SURF_HI : SURF_C);
    if (w > 0.6) px(x, SURF + 1, SURF_C);
  }
}

// ---------- day / night ----------
const DAY_LEN = 60;                                // seconds per full day
let night = 0;                                     // 0 = full day, 1 = full night
function updateDaylight() {
  const c = Math.cos(2 * Math.PI * T / DAY_LEN);   // 1 at noon, -1 at midnight
  const k = Math.max(0, Math.min(1, (0.3 - c) / 0.6));
  night = k * k * (3 - 2 * k);
}
function activity() { return 1 - 0.65 * night; }  // fish slow down at night

function applyNight() {                            // darken and blue-shift everything below the surface
  if (night < 0.01) return;
  const kr = 1 - 0.8 * night, kg = 1 - 0.7 * night, kb = 1 - 0.42 * night;
  for (let i = SURF * W; i < W * H; i++) {
    const c = buf[i];
    buf[i] = (0xff000000 | ((((c >> 16) & 255) * kb) << 16) | ((((c >> 8) & 255) * kg) << 8) | ((c & 255) * kr)) >>> 0;
  }
}

const SKY_DAY = [[104, 186, 234], [200, 236, 250]], SKY_NIGHT = [[6, 10, 32], [28, 38, 82]], DUSK = [244, 150, 96];
const SUN = hex('#ffe680'), SUN_CORE = hex('#fff8d0'), SUN_HALO = hex('#fff2c0');
const MOON = hex('#efeacc'), MOON_D = hex('#c4be9e'), MOON_HALO = hex('#34447e'), MOON_GLINT = hex('#c8d4f0');
const STAR = hex('#ffffff'), STAR_D = hex('#8c98c8');
const stars = Array.from({ length: 45 }, () => ({ x: Math.floor(Math.random() * W), y: Math.floor(Math.random() * (SURF - 3)),
  ph: rr(0, 6), bright: Math.random() < 0.3 }));

function disc(cx, cy, r, halo, haloCol, colorAt) {
  for (let y = Math.floor(cy - halo); y <= cy + halo; y++) {
    if (y < 0 || y >= SURF) continue;                // only above the water
    for (let x = Math.floor(cx - halo); x <= cx + halo; x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d <= r) px(x, y, colorAt(x - cx, y - cy));
      else if (d <= halo && bayer(x, y) < 0.35 * (1 - (d - r) / (halo - r))) px(x, y, haloCol);
    }
  }
}

function drawSky(t) {
  const dusk = 1 - Math.abs(2 * night - 1);
  const levels = [];
  for (let l = 0; l < 6; l++) {
    const k = l / 5;
    const c = mix(mix(SKY_DAY[0], SKY_DAY[1], k), mix(SKY_NIGHT[0], SKY_NIGHT[1], k), night);
    levels.push(packA(mix(c, DUSK, dusk * k * k * 0.8)));
  }
  for (let y = 0; y < SURF; y++) {
    const q = y / (SURF - 1) * 5;
    for (let x = 0; x < W; x++)
      buf[y * W + x] = levels[Math.min(5, Math.floor(q) + (q - Math.floor(q) > bayer(x, y) ? 1 : 0))];
  }
  if (night > 0.55) for (const s of stars) {
    if (!s.bright && night < 0.8) continue;
    if (Math.sin(t * 2 + s.ph) < -0.6) continue;     // twinkle
    px(s.x, s.y, s.bright ? STAR : STAR_D);
  }

  // sun and moon ride opposite arcs; they set behind the waterline
  const th = 2 * Math.PI * T / DAY_LEN;
  const arc = a => ({ x: W / 2 + Math.sin(a) * (W / 2 + 6), y: SURF + 2 - Math.cos(a) * (SURF - 6) });
  const sun = arc(th), moon = arc(th + Math.PI);
  disc(Math.round(sun.x), Math.round(sun.y), 4, 7, SUN_HALO, (dx, dy) => Math.hypot(dx, dy) < 2.5 ? SUN_CORE : SUN);
  disc(Math.round(moon.x), Math.round(moon.y), 4, 7, MOON_HALO, (dx, dy) =>
    dx < -2.5 || (dx === -1 && dy === -1) || (dx === 1 && dy === 1) || (dx === 2 && dy === -2) ? MOON_D : MOON);

  // moonlight glinting on the water below the moon
  if (night > 0.5 && moon.y < SURF) {
    const mx = Math.round(moon.x);
    for (let r = 0; r < 5; r++) for (let x = mx - 2 - r; x <= mx + 2 + r; x++)
      if (Math.sin(x * 0.9 + t * 3 + r * 1.7) > 0.55) px(x, SURF + r, MOON_GLINT);
  }
}

// ---------- main loop ----------
let last = performance.now(), T = DAY_LEN * 0.85;  // start mid-morning
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; T += dt;
  updateDaylight();

  school.timer -= dt;
  if (school.timer <= 0) wanderTarget(school);
  steer(school, school.tx, school.ty, 11 * activity(), dt);
  for (const f of fishes) updateFish(f, dt);
  updateChest(dt);
  updateBubbles(dt);
  updateFood(dt, T);

  drawWater(T);
  for (const p of plants) if (!p.front) drawPlant(p, T);
  drawChest();
  for (const f of fishes) drawFish(f);
  drawBubbles();
  for (const p of plants) if (p.front) drawPlant(p, T);
  drawFood();
  drawSurface(T);
  applyNight();
  drawSky(T);

  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- sizing & input ----------
function resize() {
  const s = Math.max(1, Math.floor(Math.min((innerWidth - 60) / W, (innerHeight - 150) / H)));
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', resize); resize();

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (Math.abs(x - puffer.x) <= puffer.w / 2 + 2 && Math.abs(y - puffer.y) <= puffer.h / 2 + 2) {
    puffer.puffTimer = 4;
    return;
  }
  if (x >= chest.x && x < chest.x + 16 && y >= chest.y - 10 && y < chest.y + CHEST_BASE.length) {
    chest.t = CHEST_OPEN_AT;
    return;
  }
  dropFood(x);
});
document.getElementById('feed').addEventListener('click', () => {
  dropFood(rr(25, 95)); dropFood(rr(105, 175));
});
</script>
</body>
