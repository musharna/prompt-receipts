<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
    border-style: solid;
    border-color: #2a2d38;
    box-shadow: 0 0 0 2px #14161d, 0 12px 40px rgba(0,0,0,.6);
  }
  #bar { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  #hint { color: #4a5266; font: 12px monospace; user-select: none; }
  #feed {
    font: bold 13px monospace; color: #ffe8b0; background: #6a4420;
    border: none; padding: 6px 16px; cursor: pointer;
    box-shadow: inset -2px -2px 0 #3a2410, inset 2px 2px 0 #9a6a34, 0 0 0 2px #14161d;
  }
  #feed:hover { background: #7a5026; }
  #feed:active { transform: translateY(1px); box-shadow: inset 2px 2px 0 #3a2410, inset -2px -2px 0 #9a6a34, 0 0 0 2px #14161d; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="feed">feed</button>
  <div id="hint">click the tank to drop food &middot; click the pufferfish to puff it up</div>
</div>
<script>
"use strict";

// ---------- setup ----------
const W = 192, H = 116, SURF = 14;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
cv.width = W; cv.height = H;

function resize() {
  const s = Math.max(1, Math.floor(Math.min((innerWidth - 40) / W, (innerHeight - 60) / H)));
  cv.style.width = W * s + "px";
  cv.style.height = H * s + "px";
  cv.style.borderWidth = Math.max(2, s * 2) + "px";
}
addEventListener("resize", resize);
resize();

// seeded RNG so the scenery is the same every load
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const srand = mulberry32(1337);
const rand = (a, b) => a + Math.random() * (b - a);
const srange = (a, b) => a + srand() * (b - a);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

// ---------- terrain ----------
const sandTop = new Array(W);
for (let x = 0; x < W; x++) {
  sandTop[x] = H - 13 + Math.round(Math.sin(x * 0.05) * 2 + Math.sin(x * 0.13 + 2) * 1.2);
}
const sandAt = x => sandTop[Math.max(0, Math.min(W - 1, Math.round(x)))];

// ---------- static background (water gradient, sand, rocks) ----------
const bg = document.createElement("canvas");
bg.width = W; bg.height = H;
const bctx = bg.getContext("2d");
const img = bctx.createImageData(W, H);
const bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

function setPx(x, y, c) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) * 4;
  img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
}

// water: banded gradient with ordered dithering
const water = ["#3aa6cc", "#2c8cb8", "#2075a3", "#195f8b", "#134a70", "#0e3857"].map(hex);
for (let y = 0; y < H; y++) {
  const t = Math.max(0, Math.min(1, (y - SURF) / (H - 12 - SURF))) * (water.length - 1);
  const i = Math.floor(t), f = t - i;
  for (let x = 0; x < W; x++) {
    const c = f * 16 > bayer[y & 3][x & 3] ? water[Math.min(i + 1, water.length - 1)] : water[i];
    setPx(x, y, c);
  }
}

// sand with speckles
const sand = ["#f0d9a0", "#e2c486", "#d4b073", "#c49c60", "#a9844c"].map(hex);
for (let x = 0; x < W; x++) {
  for (let y = sandTop[x]; y < H; y++) {
    const d = y - sandTop[x];
    let idx = d === 0 ? 0 : Math.min(4, 1 + Math.floor(d / 4));
    const r = srand();
    if (r < 0.15) idx = Math.max(0, idx - 1);
    else if (r > 0.88) idx = Math.min(4, idx + 1);
    setPx(x, y, sand[idx]);
  }
}

// pebbles & shells
const pebbleCols = ["#8f8a9e", "#b6a39a", "#e6d6c8", "#7a6e66", "#d99a8a"].map(hex);
for (let n = 0; n < 45; n++) {
  const x = Math.floor(srange(0, W));
  const y = Math.floor(srange(sandTop[x] + 1, H - 1));
  const c = pebbleCols[Math.floor(srand() * pebbleCols.length)];
  setPx(x, y, c);
  if (srand() < 0.5) setPx(x + 1, y, c);
}

// rocks: shaded ellipses, half-buried
const rockPal = ["#b4b0c4", "#928ea6", "#75718a", "#59566e", "#3e3c52"].map(hex);
function rock(cx, cy, rx, ry) {
  for (let dy = -ry; dy <= Math.ceil(ry * 0.6); dy++) {
    for (let dx = -rx; dx <= rx; dx++) {
      const e = (dx / rx) ** 2 + (dy / ry) ** 2;
      if (e > 1) continue;
      let s = (dx / rx) * 0.9 + (dy / ry) * 1.2 + 1.2 + (srand() - 0.5) * 0.5;
      if (e > 0.78) s += 0.9; // darker rim
      const idx = Math.max(0, Math.min(4, Math.floor(s * 1.4)));
      setPx(cx + dx, cy + dy, rockPal[idx]);
    }
  }
}
rock(30, sandTop[30] - 2, 11, 7);
rock(42, sandTop[42], 6, 4);
rock(118, sandTop[118] - 1, 8, 6);
rock(150, sandTop[150] - 1, 7, 5);
rock(96, sandTop[96], 4, 3);

// treasure chest in the bottom-right corner (drawn each frame so the lid can open)
const CHEST_X = 168, CHEST_W = 14;
const CHEST_Y = Math.min(...sandTop.slice(CHEST_X, CHEST_X + CHEST_W)) - 4; // top of the base

bctx.putImageData(img, 0, 0);

// ---------- sprites ----------
function buildSprite(rows, pal, flip) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === ".") continue;
      g.fillStyle = pal[ch];
      g.fillRect(flip ? w - 1 - x : x, y, 1, 1);
    }
  });
  return c;
}

// all sprites are drawn facing left
const SPECIES = [
  {
    name: "clown", count: 2, speed: 16,
    pal: { o: "#f47a20", w: "#ffffff", k: "#1a1a1a", e: "#000000" },
    frames: [[
      "...oooo.....",
      "..owwooww.k.",
      ".oewwoowwokk",
      "ooowwoowwoko",
      ".oowwoowwokk",
      "..owwooww.k.",
      "...oooo.....",
    ], [
      "...oooo.....",
      "..owwooww...",
      ".oewwoowwok.",
      "ooowwoowwokk",
      ".oowwoowwok.",
      "..owwooww...",
      "...oooo.....",
    ]],
  },
  {
    name: "tang", count: 2, speed: 20,
    pal: { b: "#2f6fe0", l: "#5b93f2", d: "#0e1f5a", y: "#ffd23a", e: "#000000" },
    frames: [[
      "...bbbbb.....",
      "..bbddddbb.yy",
      ".ebllbbddbyy.",
      "bbllbbbbdbyy.",
      ".bbbbbddbbyy.",
      "..bbddddb..yy",
      "....bbb......",
    ], [
      "...bbbbb.....",
      "..bbddddbb...",
      ".ebllbbddbyyy",
      "bbllbbbbdbyy.",
      ".bbbbbddbbyyy",
      "..bbddddb....",
      "....bbb......",
    ]],
  },
  {
    name: "angel", count: 1, speed: 10,
    pal: { b: "#e8e6d4", s: "#2a2a2a", f: "#b8b6a4", t: "#d4d2c0", e: "#000000" },
    frames: [[
      ".......f..",
      "......ff..",
      "....sff...",
      "..bbsbb...",
      ".bbbsbbb.t",
      "ebbbsbbbtt",
      "bbbbsbbbtt",
      ".bbbsbbb.t",
      "..bbsbb...",
      "....sff...",
      "......ff..",
      ".......f..",
    ], [
      "......f...",
      "......ff..",
      "....sff...",
      "..bbsbb...",
      ".bbbsbbb..",
      "ebbbsbbbtt",
      "bbbbsbbbtt",
      ".bbbsbbb..",
      "..bbsbb...",
      "....sff...",
      "......ff..",
      "......f...",
    ]],
  },
  {
    name: "clownSmall", count: 2, speed: 18,
    pal: { o: "#ff8a2a", w: "#ffffff", k: "#1a1a1a", e: "#000000" },
    frames: [[
      "..ooo....",
      ".ewoowo.k",
      "oowoowokk",
      ".owoowo.k",
      "..ooo....",
    ], [
      "..ooo....",
      ".ewoowo..",
      "oowoowokk",
      ".owoowo..",
      "..ooo....",
    ]],
  },
  {
    name: "puffer", count: 1, speed: 9,
    pal: { y: "#e8c35a", s: "#8a6a2a", w: "#f7ecc4", t: "#d8b04a", e: "#000000" },
    frames: [[
      "...yyyyy....",
      "..ysyysyy..t",
      ".yeyyyysyytt",
      "yyyyyyyyyytt",
      ".ywwwwwwyy.t",
      "..wwwwwww...",
    ], [
      "...yyyyy....",
      "..ysyysyy...",
      ".yeyyyysyytt",
      "yyyyyyyyyytt",
      ".ywwwwwwyy..",
      "..wwwwwww...",
    ]],
  },
  {
    name: "tetra", count: 7, speed: 24, school: true,
    pal: { b: "#9fb8c8", s: "#3ef0ff", r: "#ff3a3a", w: "#e8f0f0", t: "#c8d8e0", e: "#000000" },
    frames: [[
      "..bbbbb.t",
      "ebsssssbt",
      "bbrrrrrbt",
      "..wwwww.t",
    ], [
      "..bbbbb..",
      "ebsssssbt",
      "bbrrrrrbt",
      "..wwwww..",
    ]],
  },
];
for (const sp of SPECIES) {
  sp.w = Math.max(...sp.frames[0].map(r => r.length));
  sp.h = sp.frames[0].length;
  sp.spr = { "-1": sp.frames.map(f => buildSprite(f, sp.pal, false)),
             "1": sp.frames.map(f => buildSprite(f, sp.pal, true)) };
}

const snailRows = [
  "......e",
  ".sss..f",
  "sbbbs.f",
  "sbsbsff",
  "fffffff",
];
const snailPal = { s: "#7a3f22", b: "#c9824a", f: "#d8c8a8", e: "#333333" };
const snailSpr = { "1": buildSprite(snailRows, snailPal, false), "-1": buildSprite(snailRows, snailPal, true) };

// ---------- plants ----------
const plants = [], frontPlants = [];
const plantCols = [
  ["#1e6b3a", "#3fa65a"],
  ["#2b7d2b", "#6cc24a"],
  ["#17594a", "#2f9b7c"],
  ["#8a2b4a", "#d0507a"],
];
function addPlant(list, x, type) {
  const c = type === "red" ? plantCols[3] : plantCols[Math.floor(srand() * 3)];
  list.push({
    x, type, c,
    h: type === "kelp" ? Math.floor(srange(40, 75)) :
       type === "leafy" ? Math.floor(srange(18, 34)) :
       type === "red" ? Math.floor(srange(14, 24)) : Math.floor(srange(4, 10)),
    w: type === "kelp" ? 2 : 1,
    amp: type === "kelp" ? srange(3, 5) : type === "grass" ? 1 : srange(1.5, 3),
    spd: srange(0.8, 1.4),
    ph: srange(0, 10),
  });
}
[8, 14, 56, 63, 137, 183].forEach(x => addPlant(plants, x, "kelp"));
[20, 48, 72, 108, 126, 146, 160].forEach(x => addPlant(plants, x, "leafy"));
[86, 104, 152].forEach(x => addPlant(plants, x, "red"));
for (let i = 0; i < 26; i++) {
  const cx = Math.floor(srange(2, W - 2));
  for (let k = 0; k < 3; k++) addPlant(frontPlants, Math.min(W - 1, cx + k * 2 - 2), "grass");
}

function drawPlant(p, t) {
  const base = sandTop[p.x] + 1;
  for (let j = 0; j < p.h; j++) {
    const k = j / p.h;
    const sway = Math.sin(t * p.spd + p.ph + j * 0.18) * p.amp * k * k + Math.sin(t * 0.6 + p.ph) * k * 1.2;
    const x = Math.round(p.x + sway), y = base - j;
    ctx.fillStyle = p.c[0];
    ctx.fillRect(x, y, p.w, 1);
    if (p.w > 1) { ctx.fillStyle = p.c[1]; ctx.fillRect(x + 1, y, 1, 1); }
    // leaves
    const every = p.type === "kelp" ? 6 : 4;
    if (p.type !== "grass" && j > 2 && j % every === 0) {
      ctx.fillStyle = p.c[1];
      if ((j / every) & 1) { ctx.fillRect(x + p.w, y, 2, 1); ctx.fillRect(x + p.w + 2, y - 1, 1, 1); }
      else { ctx.fillRect(x - 2, y, 2, 1); ctx.fillRect(x - 3, y - 1, 1, 1); }
    }
    if (p.type === "red" && j === p.h - 1) { ctx.fillStyle = "#f08ab0"; ctx.fillRect(x, y - 1, 1, 1); }
    if (p.type === "grass" && j === p.h - 1) { ctx.fillStyle = p.c[1]; ctx.fillRect(x, y, 1, 1); }
  }
}

// ---------- fish ----------
const school = { x: W / 2, y: 40, tx: W / 2, ty: 40 };
const fishes = [];
const food = [];
const bubbles = [];

class Fish {
  constructor(sp) {
    this.sp = sp;
    this.x = rand(10, W - 10 - sp.w);
    this.y = rand(SURF + 8, H - 20 - sp.h);
    this.vx = 0; this.vy = 0;
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this.phase = rand(0, 10);
    this.maxSp = sp.speed * rand(0.8, 1.2);
    this.ox = rand(-12, 12); this.oy = rand(-7, 7);
    this.pause = 0;
    this.newTarget();
  }
  newTarget() {
    this.tx = rand(4, W - 4);
    this.ty = rand(SURF + 6, H - 18);
  }
  mouth() { return { x: this.dir < 0 ? this.x : this.x + this.sp.w, y: this.y + this.sp.h / 2 }; }
  update(dt, t) {
    const sp = this.sp, m = this.mouth();
    let tx, ty, maxSp = this.maxSp * speedMul, chasing = null;

    // nearest food wins over everything
    let best = 1e9;
    for (const f of food) {
      const d = Math.hypot(f.x - m.x, f.y - m.y);
      if (d < best) { best = d; chasing = f; }
    }
    if (chasing) {
      tx = chasing.x; ty = chasing.y; maxSp *= 1.8;
    } else if (sp.school) {
      tx = school.x + this.ox; ty = school.y + this.oy;
    } else {
      tx = this.tx; ty = this.ty;
    }

    const cx = chasing ? m.x : this.x + sp.w / 2;
    const cy = chasing ? m.y : this.y + sp.h / 2;
    const dx = tx - cx, dy = ty - cy, d = Math.hypot(dx, dy) || 1;

    if (chasing && d < 2.5) {
      food.splice(food.indexOf(chasing), 1);
      bubbles.push(new Bubble(m.x, m.y - 1, 0));
    } else if (!chasing && !sp.school && d < 4) {
      this.newTarget();
      this.pause = Math.random() < 0.4 ? rand(0.5, 2.5) : 0;
    }

    if (this.pause > 0 && !chasing) {
      this.pause -= dt;
      this.vx *= Math.pow(0.2, dt); this.vy *= Math.pow(0.2, dt);
    } else {
      const acc = (chasing ? 60 : 30) * (0.4 + 0.6 * speedMul);
      this.vx += (dx / d) * acc * dt;
      this.vy += (dy / d) * acc * dt * 0.7;
      this.vx *= Math.pow(0.6, dt); this.vy *= Math.pow(0.4, dt);
      const s = Math.hypot(this.vx, this.vy);
      if (s > maxSp) { this.vx *= maxSp / s; this.vy *= maxSp / s; }
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.x = Math.max(1, Math.min(W - 1 - sp.w, this.x));
    this.y = Math.max(SURF + 3, Math.min(H - 16 - sp.h, this.y));
    if (this.vx > 2) this.dir = 1; else if (this.vx < -2) this.dir = -1;

    if (Math.random() < dt * 0.06) bubbles.push(new Bubble(m.x, m.y - 1, 0));
  }
  draw(t) {
    const s = Math.hypot(this.vx, this.vy);
    const frame = Math.floor(t * (2.5 + s * 0.35) + this.phase) & 1;
    const bob = Math.round(Math.sin(t * 2 + this.phase) * 0.6);
    ctx.drawImage(this.sp.spr[this.dir][frame], Math.round(this.x), Math.round(this.y) + bob);
  }
}
// pufferfish: click it and it inflates into a spiky ball for a few seconds
class Puffer extends Fish {
  constructor(sp) { super(sp); this.p = 0; this.puffTime = 0; }
  radius() { return 3 + this.p * 4; }
  center() { return { x: this.x + this.sp.w / 2, y: this.y + this.sp.h / 2 }; }
  hit(x, y) {
    const c = this.center();
    const r = this.p > 0.12 ? this.radius() + 2 : this.sp.w / 2 + 2;
    return Math.hypot(x - c.x, y - c.y) <= r;
  }
  puff() {
    if (this.puffTime <= 0) for (let i = 0; i < 4; i++) {
      const c = this.center();
      bubbles.push(new Bubble(c.x + rand(-3, 3), c.y - 3, Math.random() < 0.5 ? 1 : 0));
    }
    this.puffTime = 4;
  }
  update(dt, t) {
    this.puffTime -= dt;
    const target = this.puffTime > 0 ? 1 : 0;
    this.p += Math.sign(target - this.p) * Math.min(Math.abs(target - this.p), (target ? 5 : 0.8) * dt);
    if (this.p <= 0.05) return super.update(dt, t);
    // puffed: drift to a stop and keep the ball inside the tank
    this.vx *= Math.pow(0.05, dt); this.vy *= Math.pow(0.05, dt);
    this.x += this.vx * dt; this.y += this.vy * dt;
    const R = Math.ceil(this.radius()) + 3, c = this.center();
    const cx = Math.max(R, Math.min(W - 1 - R, c.x));
    const cy = Math.max(SURF + 2 + R, Math.min(H - 14 - R, c.y));
    this.x += cx - c.x; this.y += cy - c.y;
  }
  draw(t) {
    if (this.p <= 0.12) return super.draw(t);
    const r = this.radius(), R = Math.round(r), d = this.dir;
    const c = this.center();
    const cx = Math.round(c.x), cy = Math.round(c.y + Math.sin(t * 1.5 + this.phase) * 0.6);
    // tail fin
    ctx.fillStyle = "#d8b04a";
    const tx = cx - d * (R + 1);
    ctx.fillRect(tx, cy - 1, 1, 3);
    ctx.fillRect(tx - d, cy - 2, 1, 5);
    // spikes
    for (let k = 0; k < 14; k++) {
      const a = k * Math.PI / 7 + 0.2;
      ctx.fillStyle = "#c9a040";
      ctx.fillRect(cx + Math.round(Math.cos(a) * (r + 1)), cy + Math.round(Math.sin(a) * (r + 1)), 1, 1);
      if (this.p > 0.7) {
        ctx.fillStyle = "#8a6a2a";
        ctx.fillRect(cx + Math.round(Math.cos(a) * (r + 2)), cy + Math.round(Math.sin(a) * (r + 2)), 1, 1);
      }
    }
    // body
    for (let dy = -R; dy <= R; dy++) {
      for (let dx = -R; dx <= R; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > r * r) continue;
        let col = dy > R * 0.25 ? "#f7ecc4" : "#e8c35a";
        if (dy <= R * 0.25 && ((dx * 3 + dy * 5) & 7) === 0) col = "#8a6a2a";
        if (dx * -d < 0 && dy < 0 && d2 < r * r * 0.25 && dx * -d > -3) col = "#f8dc80";
        if (d2 > (r - 1) * (r - 1)) col = "#a8822a";
        ctx.fillStyle = col;
        ctx.fillRect(cx + dx, cy + dy, 1, 1);
      }
    }
    // eye + mouth
    const ex = cx + d * (R - 2), ey = cy - 2;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(ex - d, ey, 1, 1);
    ctx.fillStyle = "#000000"; ctx.fillRect(ex, ey, 1, 1);
    ctx.fillStyle = "#8a5a2a"; ctx.fillRect(cx + d * (R - 1), cy + 1, 1, 1);
  }
}

// eel: a chain of segments that follows the head, with a travelling sine wiggle
const EEL = { name: "eel", w: 1, h: 1, speed: 13, layer: 100 };
class Eel extends Fish {
  constructor() {
    super(EEL);
    this.n = 30;
    this.wph = 0;
    this.seg = [];
    for (let i = 0; i < this.n; i++) this.seg.push({ x: this.x - this.dir * i * 1.2, y: this.y });
  }
  newTarget() {
    super.newTarget();
    this.ty = rand(SURF + 14, H - 22); // keep the long body clear of surface and sand
  }
  update(dt, t) {
    super.update(dt, t);
    const s = this.seg, SP = 1.2;
    s[0].x = this.x; s[0].y = this.y;
    for (let i = 1; i < this.n; i++) {
      const dx = s[i].x - s[i - 1].x, dy = s[i].y - s[i - 1].y, d = Math.hypot(dx, dy) || 1;
      s[i].x = s[i - 1].x + (dx / d) * SP;
      s[i].y = s[i - 1].y + (dy / d) * SP;
    }
    this.wph += dt * (2 + Math.hypot(this.vx, this.vy) * 0.5);
  }
  draw(t) {
    const s = this.seg, n = this.n;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = s[Math.max(0, i - 1)], b = s[Math.min(n - 1, i + 1)];
      let tx = a.x - b.x, ty = a.y - b.y;
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const w = Math.sin(this.wph * 3 - i * 0.45) * Math.min(1, i / 6) * 1.8;
      pts.push({ x: Math.round(s[i].x - ty * w), y: Math.round(s[i].y + tx * w) });
    }
    // tail first so the head ends up on top
    for (let i = n - 1; i >= 0; i--) {
      const p = pts[i];
      const th = i < 4 ? 3 : i > n - 5 ? 1 : 2;
      const top = p.y - (th >> 1);
      if (i > 3 && i < n - 3) { ctx.fillStyle = "#7fb4ff"; ctx.fillRect(p.x, top - 1, 1, 1); } // dorsal fin
      ctx.fillStyle = "#2f63c4"; ctx.fillRect(p.x, top, 1, th);
      if (th > 1) { ctx.fillStyle = "#183a80"; ctx.fillRect(p.x, top + th - 1, 1, 1); }
      if (th > 2) { ctx.fillStyle = "#4a86e8"; ctx.fillRect(p.x, top, 1, 1); }
    }
    ctx.fillStyle = "#ffe060";
    ctx.fillRect(pts[1].x, pts[1].y - 1, 1, 1);
  }
}

for (const sp of SPECIES) {
  for (let i = 0; i < sp.count; i++) fishes.push(sp.name === "puffer" ? new Puffer(sp) : new Fish(sp));
}
fishes.push(new Eel());
// big fish behind small ones
fishes.sort((a, b) => (b.sp.layer || b.sp.h) - (a.sp.layer || a.sp.h));

function updateSchool(dt) {
  const dx = school.tx - school.x, dy = school.ty - school.y, d = Math.hypot(dx, dy);
  if (d < 3) { school.tx = rand(20, W - 20); school.ty = rand(SURF + 14, H - 30); return; }
  const v = 11 * speedMul;
  school.x += (dx / d) * v * dt;
  school.y += (dy / d) * v * dt * 0.6;
}

// ---------- bubbles ----------
class Bubble {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.r = r;
    this.vy = r ? rand(14, 20) : rand(9, 14);
    this.ph = rand(0, 10);
  }
  update(dt, t) {
    this.y -= this.vy * dt;
    this.dx = Math.round(Math.sin(t * 4 + this.ph) * 0.8);
    return this.y > SURF + 1;
  }
  draw() {
    const x = Math.round(this.x) + (this.dx || 0), y = Math.round(this.y);
    if (this.r === 0) {
      ctx.fillStyle = "#c8f2ff"; ctx.fillRect(x, y, 1, 1);
    } else {
      ctx.fillStyle = "#a8e4f8";
      ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x - 1, y, 1, 1);
      ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y + 1, 1, 1);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x - 1, y - 1, 1, 1);
    }
  }
}
let bubbleTimer = 0, burst = 0, lid = 0;
function spawnBubbles(dt) {
  bubbleTimer -= dt;
  lid += Math.sign((burst > 0 ? 1 : 0) - lid) * Math.min(Math.abs((burst > 0 ? 1 : 0) - lid), 3 * dt);
  if (bubbleTimer <= 0) {
    if (burst <= 0) { burst = Math.floor(rand(4, 10)); bubbleTimer = rand(0.8, 2.5); return; }
    burst--;
    bubbleTimer = rand(0.08, 0.22);
    if (lid > 0.5) bubbles.push(new Bubble(CHEST_X + rand(3, CHEST_W - 3), CHEST_Y - 5, Math.random() < 0.6 ? 1 : 0));
  }
  if (Math.random() < dt * 0.3) {
    const x = Math.floor(rand(0, W));
    bubbles.push(new Bubble(x, sandTop[x] - 1, 0));
  }
}

// ---------- food ----------
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * W;
  const y = ((e.clientY - r.top) / r.height) * H;
  const puffer = fishes.find(f => f instanceof Puffer && f.hit(x, y));
  if (puffer) { puffer.puff(); return; }
  for (let i = 0; i < 5; i++) {
    food.push({ x: x + rand(-4, 4), y: SURF + rand(0, 2), vy: rand(5, 9), ph: rand(0, 10), life: 12, c: Math.random() < 0.5 ? "#c8743a" : "#9a4f22" });
  }
});
const flakeCols = ["#e8562a", "#f2a03a", "#f4d35e", "#7ab84a", "#d0703a"];
function feed() {
  const cx = rand(35, W - 35);
  for (let i = 0; i < 14; i++) {
    food.push({
      x: Math.max(1, Math.min(W - 2, cx + rand(-30, 30))),
      y: SURF - rand(0, 8), // start in the air and drift down into the water
      vy: rand(3, 6), ph: rand(0, 10), life: 12, flake: true,
      c: flakeCols[Math.floor(Math.random() * flakeCols.length)],
    });
  }
}
document.getElementById("feed").addEventListener("click", feed);

function updateFood(dt, t) {
  for (let i = food.length - 1; i >= 0; i--) {
    const f = food[i];
    const floor = sandAt(f.x) - 1;
    if (f.y < floor) {
      f.y = Math.min(floor, f.y + f.vy * dt);
      f.x += Math.sin(t * 2 + f.ph) * (f.flake ? 7 : 3) * dt;
      f.x = Math.max(0, Math.min(W - 1, f.x));
    } else if ((f.life -= dt) <= 0) {
      food.splice(i, 1);
    }
  }
}

// ---------- snail ----------
const snail = { x: 60, dir: 1 };
function updateSnail(dt) {
  snail.x += snail.dir * 1.2 * dt;
  if (snail.x > CHEST_X - 9) snail.dir = -1;
  if (snail.x < 3) snail.dir = 1;
}
function drawSnail(t) {
  const x = Math.round(snail.x);
  const y = Math.min(sandAt(x), sandAt(x + 6)) - 4;
  ctx.drawImage(snailSpr[snail.dir], x, y);
}

// ---------- treasure chest ----------
const chestPal = { d: "#3a2412", b: "#7a4a24", l: "#9a6232", g: "#e0b040", k: "#2a180a" };
const chestLid = buildSprite([
  "..dddddddddd..",
  ".dlllllllllld.",
  "dbbbbbbbbbbbbd",
  "dggggggggggggd",
], chestPal, false);
const chestBase = buildSprite([
  "dggggggggggggd",
  "dbbbbbgkgbbbbd",
  "dbbbbbgggbbbbd",
  "dbbbbbbbbbbbbd",
  "dggggggggggggd",
  "dbbbbbbbbbbbbd",
  "dddddddddddddd",
], chestPal, false);
function drawChest(t) {
  const open = Math.round(lid * 2);
  if (open > 0) {
    // gold glinting through the gap
    for (let x = 1; x < CHEST_W - 1; x++) {
      ctx.fillStyle = Math.sin(x * 1.7 + t * 5) > 0.7 ? "#fff6c0" : (x & 1 ? "#ffd84a" : "#e0a030");
      ctx.fillRect(CHEST_X + x, CHEST_Y - open, 1, open);
    }
  }
  ctx.drawImage(chestBase, CHEST_X, CHEST_Y);
  ctx.drawImage(chestLid, CHEST_X, CHEST_Y - 4 - open);
}

// ---------- day / night ----------
const DAY_LEN = 60; // seconds for one full day + night
let night = 0, speedMul = 1, cyclePhase = 0;
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const C = {
  dayTop: hex("#6fbde3"), dayBot: hex("#c4ecf8"),
  nightTop: hex("#03061a"), nightBot: hex("#141c48"),
  dusk: hex("#f0a070"),
  white: hex("#ffffff"), nightTint: hex("#28346e"),
  surfDay: hex("#8fdcf2"), surfNight: hex("#4c5c9c"),
};
function updateCycle(t) {
  cyclePhase = (t / DAY_LEN) % 1;                       // 0 = midday, 0.5 = midnight
  const c = 0.5 - 0.5 * Math.cos(cyclePhase * Math.PI * 2);
  const k = Math.max(0, Math.min(1, (c - 0.25) / 0.5));  // hold day/night, blend in between
  night = k * k * (3 - 2 * k);
  speedMul = 1 - 0.65 * night;
}
// darken and blue-shift everything under the sky
function drawNightTint() {
  if (night <= 0.01) return;
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = css(mix(C.white, C.nightTint, night));
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
// moon: rises out of the water at dusk, arcs over, sets at dawn
function moonPos() {
  const u = (cyclePhase - 0.25) / 0.5;
  if (u < 0 || u > 1) return null;
  return { x: Math.round(8 + u * (W - 16)), y: Math.round(4 + (1 - Math.sin(Math.PI * u)) * 14) };
}
function drawMoon(m, t) {
  const r = 3.6;
  for (let dy = -5; dy <= 5; dy++) {
    for (let dx = -5; dx <= 5; dx++) {
      const x = m.x + dx, y = m.y + dy, d2 = dx * dx + dy * dy;
      if (y >= surfY(x, t)) continue; // hidden below the waterline
      let col = null;
      if (d2 <= r * r) {
        col = "#f4f0d8";
        if (dx > 1 && d2 > 5) col = "#d8d2b4";                                   // shaded side
        if ((dx === -1 && dy === -1) || (dx === 1 && dy === 1) || (dx === -2 && dy === 1)) col = "#c8c0a0"; // craters
      } else if (d2 <= (r + 1.2) * (r + 1.2)) {
        col = "#2c3878"; // faint halo
      }
      if (col) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }
    }
  }
}
function drawMoonReflection(m, t) {
  ctx.save();
  ctx.fillStyle = "#b8c4f0";
  for (let k = 0; k < 9; k++) {
    ctx.globalAlpha = night * 0.45 * (1 - k / 9);
    const w = 1 + (k >> 1);
    ctx.fillRect(m.x + Math.round(Math.sin(t * 3 + k * 1.3) * (1 + k * 0.3)) - (w >> 1), SURF + 2 + k * 2, w, 1);
  }
  ctx.restore();
}

// ---------- light & surface ----------
const rays = [];
for (let i = 0; i < 5; i++) rays.push({ x: 20 + i * 42 + srange(-8, 8), w: srange(5, 12), ph: srange(0, 10) });
function drawRays(t) {
  ctx.save();
  ctx.fillStyle = "#d8ffff";
  for (const r of rays) {
    ctx.globalAlpha = (0.05 + 0.03 * Math.sin(t * 0.7 + r.ph)) * (1 - night);
    const x0 = r.x + Math.sin(t * 0.25 + r.ph) * 8;
    ctx.beginPath();
    ctx.moveTo(x0, SURF);
    ctx.lineTo(x0 + r.w, SURF);
    ctx.lineTo(x0 + r.w * 1.8 - 35, H);
    ctx.lineTo(x0 - 35, H);
    ctx.fill();
  }
  ctx.restore();
}
const stars = [];
for (let i = 0; i < 26; i++) stars.push({ x: Math.floor(srange(0, W)), y: Math.floor(srange(0, SURF - 3)), ph: srange(0, 10) });
const surfY = (x, t) => SURF + Math.round(Math.sin(x * 0.15 + t * 1.8) * 0.8 + Math.sin(x * 0.07 - t * 1.1) * 0.7);
function drawSurface(t) {
  // sky: day blue -> orange at dusk/dawn -> night
  const dusk = Math.sin(Math.PI * night) ** 2 * 0.6;
  const rows = [];
  for (let y = 0; y <= SURF + 2; y++) {
    const k = y / (SURF + 2);
    let c = mix(mix(C.dayTop, C.dayBot, k), mix(C.nightTop, C.nightBot, k), night);
    c = mix(c, C.dusk, dusk * k * k);
    rows.push(css(c));
  }
  for (let y = 0; y < SURF - 2; y++) { ctx.fillStyle = rows[y]; ctx.fillRect(0, y, W, 1); }
  for (let x = 0; x < W; x++) {
    const yy = surfY(x, t);
    for (let y = SURF - 2; y < yy; y++) { ctx.fillStyle = rows[y]; ctx.fillRect(x, y, 1, 1); }
  }
  // stars fade in as it gets dark
  if (night > 0.3) {
    for (const s of stars) {
      const b = (night - 0.3) / 0.7 * (0.6 + 0.4 * Math.sin(t * 2.3 + s.ph));
      if (b < 0.25) continue;
      ctx.fillStyle = b > 0.7 ? "#ffffff" : "#8890c0";
      ctx.fillRect(s.x, s.y, 1, 1);
    }
  }
  const m = moonPos();
  if (m) drawMoon(m, t);
  // waterline
  const surf = css(mix(C.surfDay, C.surfNight, night));
  for (let x = 0; x < W; x++) {
    ctx.fillStyle = (Math.sin(x * 0.9 + t * 3) > 0.85) ? (night > 0.5 ? "#c8d0ff" : "#ffffff") : surf;
    ctx.fillRect(x, surfY(x, t), 1, 1);
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  updateCycle(t);
  updateSchool(dt);
  for (const f of fishes) f.update(dt, t);
  updateFood(dt, t);
  updateSnail(dt);
  spawnBubbles(dt);
  for (let i = bubbles.length - 1; i >= 0; i--) if (!bubbles[i].update(dt, t)) bubbles.splice(i, 1);

  ctx.drawImage(bg, 0, 0);
  drawRays(t);
  for (const p of plants) drawPlant(p, t);
  drawSnail(t);
  drawChest(t);
  for (const f of food) {
    ctx.fillStyle = f.c;
    // flakes flutter between a flat and an edge-on pixel
    if (f.flake && Math.sin(t * 4 + f.ph) > 0) ctx.fillRect(Math.round(f.x), Math.round(f.y), 2, 1);
    else ctx.fillRect(Math.round(f.x), Math.round(f.y), 1, 1);
  }
  for (const f of fishes) f.draw(t);
  for (const b of bubbles) b.draw();
  for (const p of frontPlants) drawPlant(p, t);
  drawNightTint();
  const moon = moonPos();
  if (moon && night > 0.05) drawMoonReflection(moon, t);
  drawSurface(t);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
