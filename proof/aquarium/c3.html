<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1420; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: monospace; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 6px #2b2233, 0 0 0 10px #120d16, 0 20px 60px #000;
    cursor: pointer;
  }
  #hint { position: fixed; bottom: 10px; width: 100%; text-align: center; color: #6d5f7a; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click the water to drop food</div>
<script>
const W = 192, H = 112;      // logical pixel resolution
const WT = 8;                // water top line
const SAND = H - 16;         // average sand level

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function resize() {
  const s = Math.max(1, Math.floor(Math.min((innerWidth - 40) / W, (innerHeight - 60) / H)));
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', resize);
resize();

// Seeded RNG so the scenery is the same every load
let seed = 1337;
function rnd() {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function px(c, x, y, col) { c.fillStyle = col; c.fillRect(x, y, 1, 1); }

const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function dither(cols, t, x, y) {
  t = clamp(t, 0, 1) * (cols.length - 1);
  const i = Math.floor(t), f = t - i;
  return cols[Math.min(cols.length - 1, i + (f * 16 > BAYER[y & 3][x & 3] ? 1 : 0))];
}

// Sand surface height per column
const sandY = [];
for (let x = 0; x < W; x++) sandY[x] = SAND + Math.round(Math.sin(x * 0.05) * 2 + Math.sin(x * 0.13 + 1));

// ---------- Static background ----------
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
const b = bg.getContext('2d');

const WATER = ['#55b8d2', '#3d9ec2', '#2d84ae', '#236c98', '#1b5682', '#15436a'];
const SANDC = ['#e6c88c', '#d4b277', '#bf9a60', '#a3804b'];
const ROCK  = ['#2e2b3a', '#4a4658', '#6b6579', '#8e889b', '#b0abbb'];

(function buildBackground() {
  // lid + air gap
  b.fillStyle = '#2b2233'; b.fillRect(0, 0, W, 3);
  b.fillStyle = '#3d3247'; b.fillRect(0, 2, W, 1);
  b.fillStyle = '#cdebf1'; b.fillRect(0, 3, W, WT - 2);

  // water gradient
  for (let y = WT; y < H; y++)
    for (let x = 0; x < W; x++)
      px(b, x, y, dither(WATER, (y - WT) / (SAND - WT), x, y));

  // sand
  for (let x = 0; x < W; x++) {
    for (let y = sandY[x]; y < H; y++) {
      let c;
      if (y === sandY[x]) c = '#f2dca6';
      else c = dither(SANDC, (y - sandY[x]) / (H - SAND + 2), x, y);
      const r = rnd();
      if (r < 0.07) c = '#9c7a48';
      else if (r < 0.11) c = '#f4e2b0';
      px(b, x, y, c);
    }
  }

  // pebbles
  const PEB = [['#8d7b6a', '#b3a290'], ['#c26a4a', '#e08e6c'], ['#6f8f8a', '#97b6b0'], ['#5d5670', '#857d99']];
  for (let i = 0; i < 30; i++) {
    const x = Math.floor(rnd() * (W - 2)), y = sandY[x] + 1 + Math.floor(rnd() * 12);
    const [d, l] = PEB[Math.floor(rnd() * PEB.length)];
    b.fillStyle = d; b.fillRect(x, y, 2 + (rnd() < 0.5 ? 1 : 0), 2);
    px(b, x, y, l);
  }

  // rocks
  function rock(cx, rx, ry) {
    const cy = sandY[cx] + 2;
    for (let dy = -ry; dy <= 2; dy++) {
      for (let dx = -rx; dx <= rx; dx++) {
        const v = (dx / rx) ** 2 + (dy / ry) ** 2 + rnd() * 0.12;
        if (v >= 1) continue;
        let shade = -dx / rx * 0.5 - dy / ry * 0.9 + rnd() * 0.25;
        let idx = clamp(Math.floor((shade + 0.6) * 2.2), 0, 4);
        if (v > 0.82) idx = Math.min(idx, 1);
        px(b, cx + dx, cy + dy, ROCK[idx]);
      }
    }
  }
  rock(42, 11, 9); rock(55, 6, 5); rock(126, 15, 12); rock(144, 7, 6); rock(98, 4, 3);

  // bubbler stone
  b.fillStyle = '#3a3346'; b.fillRect(158, sandY[160] - 2, 6, 3);
  b.fillStyle = '#5a5168'; b.fillRect(159, sandY[160] - 2, 4, 1);
})();

// ---------- Plants ----------
const plants = [];
function addPlant(type, x, front = false, scale = 1) {
  const p = { type, x, front, base: sandY[x] + 1, ph: rnd() * 6.28, sp: 0.9 + rnd() * 0.6, amp: 1.5 + rnd() * 1.5, blades: [] };
  if (type === 'grass') {
    const n = 4 + Math.floor(rnd() * 4);
    for (let i = 0; i < n; i++)
      p.blades.push({ dx: Math.round((rnd() - 0.5) * 7), h: Math.round((10 + rnd() * 20) * scale), lean: (rnd() - 0.5) * 1.6, ph: rnd() * 6.28 });
  } else if (type === 'kelp') {
    p.blades.push({ dx: 0, h: Math.round((35 + rnd() * 35) * scale), lean: (rnd() - 0.5) * 0.4, ph: 0 });
    p.amp = 3 + rnd() * 2;
  } else if (type === 'red') {
    for (let i = 0; i < 3; i++)
      p.blades.push({ dx: i * 3 - 3, h: Math.round((18 + rnd() * 18) * scale), lean: (i - 1) * 0.5, ph: rnd() * 2 });
  }
  plants.push(p);
}
for (const x of [18, 33, 116, 170, 183]) addPlant('kelp', x);
for (const x of [8, 62, 76, 104, 138, 150]) addPlant('grass', x);
for (const x of [88, 26]) addPlant('red', x);
addPlant('grass', 3, true, 0.6);
addPlant('grass', 188, true, 0.7);
addPlant('grass', 112, true, 0.45);

function stemX(p, bl, j, t) {
  const k = j / bl.h;
  return p.x + bl.dx + Math.sin(t * p.sp + p.ph + bl.ph + j * 0.08) * p.amp * k * k + bl.lean * k * k * bl.h * 0.25;
}

function drawPlant(p, t) {
  for (const bl of p.blades) {
    for (let j = 0; j <= bl.h; j++) {
      const k = j / bl.h;
      const x = Math.round(stemX(p, bl, j, t)), y = p.base - j;
      if (p.type === 'grass') {
        px(ctx, x, y, k < 0.3 ? '#1f6b3a' : k < 0.75 ? '#2f9a4e' : '#62c96e');
        if (k < 0.4) px(ctx, x + 1, y, '#185a30');
      } else if (p.type === 'kelp') {
        px(ctx, x, y, '#3b6e26');
        if (j > 2 && j % 3 === 0) {
          const side = (j / 3) % 2 ? 1 : -1;
          const len = j > bl.h - 6 ? 2 : 4;
          for (let i = 1; i <= len; i++)
            px(ctx, x + side * i, y - (i > 2 ? 1 : 0), i === len ? '#9bd451' : '#6aa83a');
        }
      } else if (p.type === 'red') {
        px(ctx, x, y, '#7a2a33');
        if (j > 1 && j % 3 === 0) {
          const c = k > 0.7 ? '#ff7a85' : '#d9485a';
          px(ctx, x - 1, y, c); px(ctx, x - 2, y - 1, c);
          px(ctx, x + 1, y, c); px(ctx, x + 2, y - 1, c);
        }
        if (j === bl.h) px(ctx, x, y - 1, '#ff9aa2');
      }
    }
  }
}

// ---------- Fish sprites (facing right; 2 tail frames) ----------
const SPRITES = {
  clown: {
    pal: { 1: '#f28a24', 2: '#fff4e0', 3: '#c2551a', 4: '#1a1a2a' }, speed: 11, count: 3,
    frames: [[
      '3...1211..',
      '33.112111.',
      '3311121141',
      '3311121111',
      '33.112111.',
      '3...1211..',
    ], [
      '....1211..',
      '3..112111.',
      '3311121141',
      '3311121111',
      '3..112111.',
      '....1211..',
    ]],
  },
  tetra: {
    pal: { 1: '#3ad0ff', 2: '#ff3b4a', 3: '#b9e6f0', 4: '#10202a' }, speed: 17, count: 7,
    frames: [[
      '3.11111.',
      '33111141',
      '3.22222.',
    ], [
      '..11111.',
      '33111141',
      '..22222.',
    ]],
  },
  angel: {
    pal: { 1: '#dfe4ec', 2: '#3b3f55', 3: '#aab3c2', 4: '#151520' }, speed: 7, count: 2,
    frames: [[
      '....3.....',
      '...313....',
      '..121111..',
      '3.1211111.',
      '3312111141',
      '3.1211111.',
      '..121111..',
      '...313....',
      '....3.....',
    ], [
      '.....3....',
      '...313....',
      '..121111..',
      '..1211111.',
      '3312111141',
      '..1211111.',
      '..121111..',
      '...313....',
      '.....3....',
    ]],
  },
  gold: {
    pal: { 1: '#ff9a1f', 2: '#ffd166', 3: '#ff6a00', 4: '#2a1208' }, speed: 9, count: 2,
    frames: [[
      '3......11..',
      '33..111111.',
      '.331111141.',
      '.3311122111',
      '33..122221.',
      '3......2...',
    ], [
      '.......11..',
      '.3..111111.',
      '3331111141.',
      '3331112211.',
      '.3..122221.',
      '.......2...',
    ]],
  },
};
for (const s of Object.values(SPRITES)) {
  s.w = s.frames[0][0].length;
  s.h = s.frames[0].length;
  s.eyeRow = s.frames[0].findIndex(r => r.includes('4'));
}

function drawSprite(s, frame, x, y, dir) {
  const rows = s.frames[frame];
  for (let r = 0; r < s.h; r++) {
    const row = rows[r];
    for (let i = 0; i < s.w; i++) {
      const ch = row[i];
      if (ch === '.') continue;
      ctx.fillStyle = s.pal[ch];
      ctx.fillRect(x + (dir > 0 ? i : s.w - 1 - i), y + r, 1, 1);
    }
  }
}

// ---------- Fish ----------
const food = [];
const bubbles = [];

class Fish {
  constructor(kind) {
    this.s = SPRITES[kind];
    this.x = rand(10, W - 20);
    this.y = rand(WT + 6, SAND - 20);
    this.vx = 0; this.vy = 0;
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.speed = this.s.speed * rand(0.8, 1.2);
    this.anim = Math.random() * 10;
    this.ph = Math.random() * 6.28;
    this.pickTarget();
  }
  pickTarget() {
    this.tx = rand(4, W - this.s.w - 4);
    this.ty = rand(WT + 4, SAND - this.s.h - 6);
    this.timer = rand(2, 7);
    this.pace = rand(0.4, 1);
  }
  mouth() {
    return { x: this.dir > 0 ? this.x + this.s.w : this.x, y: this.y + this.s.eyeRow };
  }
  update(dt) {
    this.timer -= dt;
    const m = this.mouth();
    let tx = this.tx + (this.dir > 0 ? this.s.w : 0), ty = this.ty + this.s.eyeRow;
    let speed = this.speed * this.pace;

    // chase the nearest food pellet
    let best = null, bd = 1e9;
    for (const f of food) {
      const d = Math.hypot(f.x - m.x, f.y - m.y);
      if (d < bd) { bd = d; best = f; }
    }
    if (best) {
      tx = best.x; ty = best.y; speed = this.speed * 1.8;
      if (bd < 2.5) { food.splice(food.indexOf(best), 1); this.burp = 0.3; }
    } else if (this.timer <= 0 || Math.hypot(tx - m.x, ty - m.y) < 3) {
      this.pickTarget();
    }

    const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy) || 1;
    const slow = Math.min(1, d / 10);
    const dvx = dx / d * speed * slow, dvy = dy / d * speed * slow * 0.7;
    const k = Math.min(1, dt * 1.6);
    this.vx += (dvx - this.vx) * k;
    this.vy += (dvy - this.vy) * k;
    this.x = clamp(this.x + this.vx * dt, 1, W - this.s.w - 1);
    this.y = clamp(this.y + this.vy * dt, WT + 3, SAND - this.s.h - 3);

    if (this.vx > 1.2) this.dir = 1;
    else if (this.vx < -1.2) this.dir = -1;
    this.anim += dt * (2.5 + Math.hypot(this.vx, this.vy) * 0.35);

    if (Math.random() < dt * 0.04) {
      const mm = this.mouth();
      bubbles.push({ x: mm.x, y: mm.y - 1, vy: rand(6, 10), ph: Math.random() * 6, size: 1 });
    }
  }
  draw(t) {
    const bob = Math.sin(t * 2 + this.ph) * 0.6;
    drawSprite(this.s, Math.floor(this.anim) % 2, Math.round(this.x), Math.round(this.y + bob), this.dir);
  }
}

const fish = [];
for (const [kind, s] of Object.entries(SPRITES))
  for (let i = 0; i < s.count; i++) fish.push(new Fish(kind));
// draw big fish behind small ones
fish.sort((a, b) => b.s.w * b.s.h - a.s.w * a.s.h);

// ---------- Input ----------
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  for (let i = 0; i < 5; i++)
    food.push({ x: clamp(x + rand(-5, 5), 2, W - 3), y: WT + rand(0, 2), vy: rand(4, 7), ph: Math.random() * 6, rest: 0 });
});

// ---------- Effects ----------
const rays = [];
for (let i = 0; i < 6; i++) rays.push({ x: rnd() * W * 1.2 - 20, w: 3 + Math.floor(rnd() * 6), ph: rnd() * 6.28, sp: 0.2 + rnd() * 0.3 });

function drawRays(t) {
  ctx.fillStyle = '#ffffff';
  for (const r of rays) {
    ctx.globalAlpha = 0.05 + Math.sin(t * r.sp * 2 + r.ph) * 0.03;
    const x0 = r.x + Math.sin(t * r.sp + r.ph) * 8;
    for (let y = WT; y < SAND; y++) {
      const fade = 1 - (y - WT) / (SAND - WT);
      ctx.fillRect(Math.round(x0 + (y - WT) * 0.45), y, Math.max(1, Math.round(r.w * (0.6 + fade * 0.4))), 1);
    }
  }
  ctx.globalAlpha = 1;
}

function drawSurface(t) {
  for (let x = 0; x < W; x++) {
    const wy = WT + Math.round(Math.sin(x * 0.18 + t * 2.2) * 0.7 + Math.sin(x * 0.07 - t * 1.3) * 0.5);
    ctx.fillStyle = WATER[0];
    if (wy < WT) ctx.fillRect(x, wy, 1, WT - wy + 1);
    else if (wy > WT) { ctx.fillStyle = '#cdebf1'; ctx.fillRect(x, WT, 1, wy - WT); }
    px(ctx, x, wy, (x + Math.floor(t * 6)) % 9 < 3 ? '#ffffff' : '#a8e6f0');
  }
}

let bubbleClock = 0;
function updateBubbles(dt, t) {
  bubbleClock -= dt;
  if (bubbleClock <= 0) {
    bubbleClock = rand(0.08, 0.35);
    bubbles.push({ x: 160 + rand(-1, 2), y: sandY[160] - 3, vy: rand(10, 18), ph: Math.random() * 6, size: Math.random() < 0.3 ? 3 : Math.random() < 0.5 ? 2 : 1 });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const bb = bubbles[i];
    bb.y -= bb.vy * dt;
    bb.vy = Math.min(bb.vy + dt * 4, 24);
    if (bb.y < WT + 1) bubbles.splice(i, 1);
  }
}

function drawBubbles(t) {
  for (const bb of bubbles) {
    const x = Math.round(bb.x + Math.sin(t * 4 + bb.ph + bb.y * 0.1) * 1.2), y = Math.round(bb.y);
    if (bb.size === 1) px(ctx, x, y, '#d8f4ff');
    else if (bb.size === 2) {
      ctx.fillStyle = '#9fdcf0'; ctx.fillRect(x, y, 2, 2);
      px(ctx, x, y, '#ffffff');
    } else {
      ctx.fillStyle = '#9fdcf0';
      ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y + 1, 1, 1);
      ctx.fillRect(x + 2, y + 1, 1, 1); ctx.fillRect(x + 1, y + 2, 1, 1);
      px(ctx, x, y, '#ffffff');
    }
  }
}

function updateFood(dt, t) {
  for (let i = food.length - 1; i >= 0; i--) {
    const f = food[i];
    const floor = sandY[Math.round(f.x)] - 1;
    if (f.y < floor) {
      f.y = Math.min(floor, f.y + f.vy * dt);
      f.x += Math.sin(t * 3 + f.ph) * dt * 2;
    } else if ((f.rest += dt) > 12) food.splice(i, 1);
  }
}

function drawFood() {
  for (const f of food) px(ctx, Math.round(f.x), Math.round(f.y), f.rest > 0 ? '#8a4f26' : '#d2783a');
}

function drawGlass() {
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.07;
  for (let i = 0; i < 26; i++) {
    ctx.fillRect(14 + i, WT + 4 + i * 2, 3, 2);
    ctx.fillRect(22 + i, WT + 4 + i * 2, 1, 2);
  }
  ctx.globalAlpha = 1;
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  updateBubbles(dt, t);
  updateFood(dt, t);
  for (const f of fish) f.update(dt);

  ctx.drawImage(bg, 0, 0);
  drawRays(t);
  for (const p of plants) if (!p.front) drawPlant(p, t);
  drawFood();
  for (const f of fish) f.draw(t);
  drawBubbles(t);
  for (const p of plants) if (p.front) drawPlant(p, t);
  drawSurface(t);
  drawGlass();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
