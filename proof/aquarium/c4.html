<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px monospace; color: #cfe; opacity: .55; pointer-events: none;
    transition: opacity 1s; text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click to drop food</div>
<script>
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mixC = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

const WATER_TOP = [86, 196, 214], WATER_BOT = [12, 52, 96];
const AIR = [18, 30, 44], FAR = [10, 60, 72];
const SAND = [[242, 226, 176], [226, 206, 150], [212, 188, 130], [196, 170, 112], [178, 150, 96], [160, 132, 82]];
const ROCK = [[58, 64, 76], [84, 92, 104], [112, 120, 130], [142, 150, 158]];
const PEBBLES = [[120, 110, 100], [90, 84, 80], [170, 90, 60], [200, 190, 170], [70, 90, 110]];

let W, H, S, SURF, SAND_BASE, t = 0;
let sandTop = [], bgCv, sandCv, plants = [], fish = [], bubbles = [], food = [], vents = [], rays = [], schools = [];

// ---------- fish sprites (drawn facing left; 't' = tail, animated) ----------
const SPECIES = {
  clown: {
    rows: [
      '....fff.....',
      '..bbsbbbsb.t',
      '.bebsbbbsbtt',
      'bbbbsbbbsbbt',
      '.bbbsbbbsbtt',
      '..bbsbbbsb.t',
      '....ff......',
    ],
    pal: { b: '#f47a1f', s: '#fff4e6', e: '#111', f: '#d2560f', t: '#d2560f' }, speed: 12,
  },
  blueTang: {
    rows: [
      '...ffffff...',
      '..bbbbbbbb.t',
      '.bebbssbbbtt',
      'bbbbsbbbsbtt',
      '.bbbbbssbbtt',
      '..bbbbbbbb.t',
      '....ffff....',
    ],
    pal: { b: '#2f62e0', s: '#0d1530', e: '#fff', f: '#1d3f9e', t: '#f5d000' }, speed: 15,
  },
  yellowTang: {
    rows: [
      '...ffffff...',
      '..bbbbbbbb.t',
      '.bebbbbbbbtt',
      'bbbbbbbbbbtt',
      '.bbbbbbbbbtt',
      '..bbbbbbbb.t',
      '....ffff....',
    ],
    pal: { b: '#ffd21f', e: '#222', f: '#e8b400', t: '#f0c000' }, speed: 14,
  },
  angel: {
    rows: [
      '...f.....',
      '...ff....',
      '..bsbf...',
      '.bsbsbf..',
      'besbsbbtt',
      'bbsbsbbtt',
      '.bsbsbb.t',
      '..bsbf...',
      '...ff....',
      '...f.....',
      '....f....',
    ],
    pal: { b: '#ece4cc', s: '#3a3a3a', e: '#111', f: '#cfc6ad', t: '#d8d0b8' }, speed: 8,
  },
  tetra: {
    rows: [
      '.bbbbbb.t',
      'bessssstt',
      '.rrrrrr.t',
    ],
    pal: { b: '#a9c4cf', s: '#27e8ff', r: '#ff3b3b', e: '#111', t: '#a9c4cf' }, speed: 20,
  },
};

function buildSprite(sp) {
  const rows = sp.rows, h = rows.length, w = rows[0].length, mid = (h - 1) / 2;
  const frames = [[], []]; // [dir][frame], dir 0 = left, 1 = right
  for (let f = 0; f < 2; f++) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      let yy = y;
      if (f === 1 && ch === 't') yy = y < mid ? y + 1 : y > mid ? y - 1 : y; // tail flap
      g.fillStyle = sp.pal[ch];
      g.fillRect(x, yy, 1, 1);
    }
    const m = document.createElement('canvas');
    m.width = w; m.height = h;
    const mg = m.getContext('2d');
    mg.translate(w, 0); mg.scale(-1, 1); mg.drawImage(c, 0, 0);
    frames[0].push(c); frames[1].push(m);
  }
  sp.frames = frames; sp.w = w; sp.h = h;
}
Object.values(SPECIES).forEach(buildSprite);

// ---------- fish ----------
class Fish {
  constructor(kind, school) {
    this.sp = SPECIES[kind];
    this.w = this.sp.w; this.h = this.sp.h;
    this.school = school || null;
    this.ox = rand(-10, 10); this.oy = rand(-6, 6);
    this.x = rand(this.xmin, this.xmax); this.y = rand(this.ymin, this.ymax);
    this.vx = 0; this.vy = 0;
    this.dir = Math.random() < .5 ? 0 : 1;
    this.anim = Math.random() * 2;
    this.bob = Math.random() * 6;
    this.newTarget();
  }
  get xmin() { return 3; }
  get xmax() { return W - 3 - this.w; }
  get ymin() { return SURF + 4; }
  get ymax() { return SAND_BASE - 3 - this.h; }
  newTarget() {
    if (this.school) {
      this.tx = this.school.tx + this.ox; this.ty = this.school.ty + this.oy;
      this.timer = rand(.3, .8);
    } else {
      this.tx = rand(this.xmin, this.xmax); this.ty = rand(this.ymin, this.ymax);
      this.timer = rand(2, 7);
      this.cruise = rand(.4, 1.2);
    }
  }
  update(dt) {
    this.timer -= dt;
    // look for food
    let best = null, bd = 60;
    for (const f of food) {
      if (f.y > this.ymax + this.h + 2) continue;
      const d = Math.hypot(f.x - (this.x + this.w / 2), f.y - (this.y + this.h / 2));
      if (d < bd) { bd = d; best = f; }
    }
    let tx, ty, speed = this.sp.speed * (this.school ? 1 : this.cruise);
    if (best) {
      tx = best.x - this.w / 2; ty = best.y - this.h / 2; speed = this.sp.speed * 2.2;
      if (bd < this.w / 2 + 1) { best.eaten = true; }
    } else {
      if (this.timer <= 0) this.newTarget();
      tx = this.tx; ty = this.ty;
    }
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy) || 1;
    if (!best && d < 3 && !this.school) speed *= 0.15; // drift when arrived
    const k = Math.min(1, dt * (best ? 3 : 1.4));
    this.vx += (dx / d * speed - this.vx) * k;
    this.vy += (dy / d * speed * .6 - this.vy) * k;
    this.x = clamp(this.x + this.vx * dt, this.xmin, this.xmax);
    this.y = clamp(this.y + this.vy * dt, this.ymin, this.ymax);
    if (this.vx < -2) this.dir = 0; else if (this.vx > 2) this.dir = 1;
    this.anim += dt * (2.5 + Math.abs(this.vx) * .35);
    if (Math.random() < dt * .06) {
      bubbles.push(newBubble(this.dir ? this.x + this.w : this.x - 1, this.y + 1, 1));
    }
  }
  draw() {
    const img = this.sp.frames[this.dir][Math.floor(this.anim) % 2];
    const by = Math.round(Math.sin(t * 1.3 + this.bob) * .6);
    ctx.drawImage(img, Math.round(this.x), Math.round(this.y) + by);
  }
}

// ---------- bubbles ----------
function newBubble(x, y, size) {
  return { x, y, size: size || pick([1, 1, 1, 2, 2, 3]), ph: rand(0, 6), spd: rand(10, 18) };
}
function drawBubble(b) {
  const x = Math.round(b.x + Math.sin(t * 3 + b.ph) * .8), y = Math.round(b.y);
  if (b.size === 1) {
    ctx.fillStyle = 'rgba(220,248,255,.85)'; ctx.fillRect(x, y, 1, 1);
  } else if (b.size === 2) {
    ctx.fillStyle = 'rgba(200,240,255,.55)'; ctx.fillRect(x, y, 2, 2);
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(x, y, 1, 1);
  } else {
    ctx.fillStyle = 'rgba(200,240,255,.7)';
    ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y + 1, 1, 1);
    ctx.fillRect(x + 2, y + 1, 1, 1); ctx.fillRect(x + 1, y + 2, 1, 1);
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(x, y, 1, 1);
  }
}

// ---------- scene generation ----------
function setup() {
  S = Math.max(2, Math.floor(innerHeight / 120));
  W = Math.ceil(innerWidth / S); H = Math.ceil(innerHeight / S);
  cv.width = W; cv.height = H;
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  ctx.imageSmoothingEnabled = false;

  SURF = 9;
  SAND_BASE = H - Math.max(14, Math.floor(H * .16));
  const s1 = rand(0, 10), s2 = rand(0, 10);
  sandTop = [];
  for (let x = 0; x < W; x++) {
    sandTop[x] = Math.round(SAND_BASE + 2 * Math.sin(x * .04 + s1) + 1.5 * Math.sin(x * .13 + s2));
  }
  bgCv = makeBackground();
  vents = [];
  for (let i = 0; i < Math.max(1, Math.round(W / 160)); i++) vents.push({ x: ri(15, W - 15), cd: 0, burst: 0 });
  sandCv = makeSand();
  makePlants();
  makeFish();
  rays = [];
  for (let i = 0; i < Math.round(W / 40) + 2; i++) {
    rays.push({ x: rand(-20, W), w: rand(4, 14), ph: rand(0, 6), sp: rand(.05, .15), a: rand(.03, .07) });
  }
  bubbles = []; food = [];
}

function makeBackground() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), img = g.createImageData(W, H), d = img.data;
  const N = 7;
  for (let y = 0; y < H; y++) {
    const tt = Math.max(0, (y - SURF) / (H - SURF));
    const band = Math.floor(tt * N), frac = tt * N - band;
    const c0 = mixC(WATER_TOP, WATER_BOT, band / N);
    const c1 = mixC(WATER_TOP, WATER_BOT, Math.min(1, (band + 1) / N));
    for (let x = 0; x < W; x++) {
      let col;
      if (y < SURF) col = AIR;
      else {
        const dither = BAYER[(y & 3) * 4 + (x & 3)] / 16;
        col = dither < frac ? c1 : c0;
        // distant underwater hills for depth
        const hill2 = SAND_BASE - 20 - 8 * Math.sin(x * .021 + 2.1) - 4 * Math.sin(x * .07);
        const hill1 = SAND_BASE - 8 - 5 * Math.sin(x * .035 + 1.3) - 3 * Math.sin(x * .11 + .4);
        if (y > hill1) col = mixC(col, FAR, .45);
        else if (y > hill2) col = mixC(col, FAR, .22);
      }
      const i = (y * W + x) * 4;
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

function makeSand() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), img = g.createImageData(W, H), d = img.data;
  const set = (x, y, col) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = (y * W + x) * 4;
    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  };
  for (let x = 0; x < W; x++) {
    for (let y = sandTop[x]; y < H; y++) {
      const depth = y - sandTop[x];
      let idx = depth === 0 ? 0 : 1 + Math.floor(depth / 5) + (Math.random() < .25 ? 1 : 0) - (Math.random() < .15 ? 1 : 0);
      if (depth > 0) idx = clamp(idx, 1, SAND.length - 1);
      set(x, y, SAND[idx]);
      if (depth > 1 && Math.random() < .015) {
        const p = pick(PEBBLES); set(x, y, p);
        if (Math.random() < .4) set(x + 1, y, p);
      }
    }
  }
  // rocks
  const nRocks = Math.max(2, Math.round(W / 70));
  for (let r = 0; r < nRocks; r++) {
    const cx = ri(10, W - 10), rw = ri(5, 13), rh = ri(4, 10), cy = sandTop[cx] + 1;
    for (let x = cx - rw; x <= cx + rw; x++) {
      for (let y = cy - rh; y <= cy; y++) {
        const dx = (x - cx) / rw, dy = (y - cy) / rh;
        if (dx * dx + dy * dy > 1 - Math.random() * .08) continue;
        const l = (-dx - dy) * .5 + .25 + rand(-.12, .12);
        let col = ROCK[clamp(Math.floor((l + .5) * ROCK.length), 0, ROCK.length - 1)];
        if (dy < -.75 && Math.random() < .35) col = [74, 128, 64]; // moss
        set(x, y, col);
      }
    }
  }
  // bubbler stones
  for (const v of vents) {
    const y0 = sandTop[v.x];
    for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 0; dy++) {
      if (Math.abs(dx) === 2 && dy === -2) continue;
      set(v.x + dx, y0 + dy, dy === -2 ? [110, 110, 120] : [70, 72, 82]);
    }
    set(v.x, y0 - 2, [30, 30, 36]);
    v.y = y0 - 3;
  }
  g.putImageData(img, 0, 0);
  return c;
}

const GREENS = [['#2f8f3a', '#1f6b2c'], ['#4caf50', '#2e7d32'], ['#6cc24a', '#3f8f2a'], ['#2a9d6f', '#1b6e4e']];
const REDS = [['#c0453a', '#8a2b25'], ['#d86a3a', '#a3482a']];

function makePlants() {
  plants = [];
  const n = Math.round(W / 9);
  for (let i = 0; i < n; i++) {
    const x = ri(2, W - 4);
    const front = Math.random() < .3;
    const by = sandTop[x] + (front ? 1 : 0);
    if (Math.random() < .55) {
      const [c1, c2] = Math.random() < .2 ? pick(REDS) : pick(GREENS);
      const maxH = (SAND_BASE - SURF) * (front ? .35 : .8);
      plants.push({
        type: 'kelp', front, x, by, h: ri(10, Math.max(12, maxH)), c1, c2,
        amp: rand(1.5, 3.5), spd: rand(.8, 1.6), ph: rand(0, 6), lean: rand(-2, 2), leaf: ri(0, 3),
      });
    } else {
      const blades = [];
      for (let j = 0, nb = ri(3, 7); j < nb; j++) {
        blades.push({ dx: ri(-3, 3), h: ri(4, front ? 9 : 15), c: pick(GREENS)[Math.random() < .5 ? 0 : 1], ph: rand(0, 6) });
      }
      plants.push({ type: 'grass', front, x, by, blades });
    }
  }
}

function makeFish() {
  fish = []; schools = [];
  const k = Math.max(1, W / 220);
  const add = (kind, n) => { for (let i = 0; i < n; i++) fish.push(new Fish(kind)); };
  add('clown', Math.round(2 * k));
  add('blueTang', Math.round(1 * k));
  add('yellowTang', Math.round(1 * k));
  add('angel', Math.round(1.5 * k));
  for (let s = 0; s < Math.round(k); s++) {
    const school = { tx: W / 2, ty: H / 2, timer: 0 };
    schools.push(school);
    for (let i = 0, n = ri(7, 10); i < n; i++) fish.push(new Fish('tetra', school));
  }
}

// ---------- drawing ----------
function px(x, y) { ctx.fillRect(x, y, 1, 1); }

function drawPlant(p) {
  if (p.type === 'kelp') {
    for (let i = 0; i < p.h; i++) {
      const k = i / p.h;
      const off = Math.sin(t * p.spd + p.ph - i * .15) * p.amp * k * k + p.lean * k;
      const x = Math.round(p.x + off), y = p.by - i;
      ctx.fillStyle = p.c1; px(x, y);
      ctx.fillStyle = p.c2; px(x + 1, y);
      if (i > 3 && i % 4 === p.leaf) {
        const side = (Math.floor(i / 4) % 2) ? 1 : -1;
        ctx.fillStyle = p.c1;
        if (side < 0) { px(x - 1, y); px(x - 2, y - 1); }
        else { ctx.fillStyle = p.c2; px(x + 2, y); px(x + 3, y - 1); }
      }
    }
  } else {
    for (const b of p.blades) {
      ctx.fillStyle = b.c;
      for (let i = 0; i < b.h; i++) {
        const k = i / b.h;
        const off = Math.sin(t * 1.4 + b.ph - i * .2) * 1.3 * k * k + b.dx * k * .6;
        px(Math.round(p.x + b.dx * .4 + off), p.by - i);
      }
    }
  }
}

function drawRays() {
  ctx.fillStyle = '#e6fbff';
  for (const r of rays) {
    const x = r.x + Math.sin(t * r.sp + r.ph) * 10;
    ctx.globalAlpha = r.a * (.7 + .3 * Math.sin(t * .7 + r.ph));
    ctx.beginPath();
    ctx.moveTo(x, SURF); ctx.lineTo(x + r.w, SURF);
    ctx.lineTo(x + r.w + 30, SAND_BASE); ctx.lineTo(x + 30 - r.w * .5, SAND_BASE);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSurface() {
  for (let x = 0; x < W; x++) {
    const wy = SURF + Math.round(Math.sin(x * .18 + t * 2.2) * .8 + Math.sin(x * .05 - t * 1.3) * .7);
    for (let y = SURF - 2; y < wy; y++) { ctx.fillStyle = `rgb(${AIR})`; px(x, y); }
    for (let y = wy; y <= SURF + 1; y++) { ctx.fillStyle = `rgb(${WATER_TOP})`; px(x, y); }
    ctx.fillStyle = '#c4f6ff'; px(x, wy);
    if ((x + Math.floor(t * 6)) % 7 === 0) { ctx.fillStyle = 'rgba(255,255,255,.5)'; px(x, wy + 1); }
  }
}

function drawFrame() {
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, 0, W, 3);            // lid
  ctx.fillRect(0, H - 3, W, 3);        // stand
  ctx.fillRect(0, 0, 1, H); ctx.fillRect(W - 1, 0, 1, H);
  ctx.fillStyle = '#2c3646';
  ctx.fillRect(1, 2, W - 2, 1);
  ctx.fillRect(1, H - 3, W - 2, 1);
  // glass glare
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for (let i = 0; i < 26; i++) { ctx.fillRect(6 + i, SURF + 6 + i * 2, 2, 2); ctx.fillRect(13 + i, SURF + 6 + i * 2, 1, 2); }
}

// ---------- main loop ----------
function update(dt) {
  t += dt;
  for (const s of schools) {
    s.timer -= dt;
    if (s.timer <= 0) {
      s.tx = rand(15, W - 25); s.ty = rand(SURF + 12, SAND_BASE - 15); s.timer = rand(3, 7);
    }
  }
  for (const f of fish) f.update(dt);

  for (const v of vents) {
    v.cd -= dt;
    if (v.cd <= 0) {
      bubbles.push(newBubble(v.x + rand(-.5, .5), v.y));
      if (v.burst > 0) { v.burst--; v.cd = rand(.05, .15); }
      else { v.cd = rand(.15, .6); if (Math.random() < .08) v.burst = ri(6, 14); }
    }
  }
  for (const b of bubbles) { b.y -= b.spd * dt * (1 + b.size * .15); }
  bubbles = bubbles.filter(b => b.y > SURF + 1);

  for (const f of food) {
    if (!f.settled) {
      f.y += f.vy * dt; f.x += Math.sin(t * 2 + f.ph) * dt * 3;
      if (f.y >= sandTop[clamp(Math.round(f.x), 0, W - 1)] - 1) f.settled = true;
    } else f.life -= dt;
  }
  food = food.filter(f => !f.eaten && f.life > 0);
}

function render() {
  ctx.drawImage(bgCv, 0, 0);
  drawRays();
  ctx.drawImage(sandCv, 0, 0);
  for (const p of plants) if (!p.front) drawPlant(p);
  for (const f of fish) f.draw();
  for (const p of plants) if (p.front) drawPlant(p);
  for (const f of food) {
    ctx.fillStyle = f.settled && f.life < 2 ? 'rgba(170,90,40,.5)' : '#b5652e';
    px(Math.round(f.x), Math.round(f.y));
  }
  for (const b of bubbles) drawBubble(b);
  drawSurface();
  drawFrame();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / S;
  for (let i = 0, n = ri(4, 7); i < n; i++) {
    food.push({ x: clamp(x + rand(-5, 5), 2, W - 3), y: SURF + rand(0, 2), vy: rand(6, 10), ph: rand(0, 6), life: 8 });
  }
  document.getElementById('hint').style.opacity = 0;
});

let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(setup, 200); });

setup();
requestAnimationFrame(loop);
</script>
</body>
</html>
