name: Add a receipt to the gallery
description: Send a receipt link made with receipt.py --link, to show it in the gallery
title: "Receipt: "
labels: ["receipt"]
body:
  - type: markdown
    attributes:
      value: |
        A bot checks the link and replies with what the gallery will show. It goes in once the repo's owner adds the `gallery` label. Everything here is public, so check the prompts have nothing private in them first (`receipt.py --redact` or `--hide prompt` help). `--prompt --turns` shows each prompt with its time and cost.
  - type: input
    id: link
    attributes:
      label: Receipt link
      description: The link `receipt.py --link` printed (it starts https://musharna.github.io/prompt-receipts/r/#r1.)
    validations:
      required: true
  - type: dropdown
    id: worked
    attributes:
      label: Did it work?
      description: Your word for it; the gallery shows it as yours.
      options:
        - Worked
        - Partly
        - Didn't work
        - Not saying
  - type: input
    id: made
    attributes:
      label: What it made
      description: A few words, like "a three-panel comic page" or "a browser game that crashes on level 2". Optional.
  - type: textarea
    id: note
    attributes:
      label: Anything to add
      description: What you made, or where the output is. Optional.
  - type: checkboxes
    id: public
    attributes:
      label: Public
      options:
        - label: I'm happy for this receipt to be public in the gallery, its prompts under CC BY 4.0 like the site's
          required: true
