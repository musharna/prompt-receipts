name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'  # the tests that need ffmpeg run here, and fail rather than skip without it
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python tools/receipt.py --version
      - run: python -m unittest discover -s tests -v
        env:
          RECEIPT_TEST_NEEDS_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: python -m pip install .
      - run: prompt-receipts --version
      - run: receipt --version
